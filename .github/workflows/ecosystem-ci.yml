name: Ecosystem CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
