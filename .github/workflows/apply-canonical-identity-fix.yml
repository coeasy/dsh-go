name: Apply repository identity hardening

on:
  push:
    branches: ["fix/canonical-repository-identity"]
    paths:
      - ".github/workflows/apply-canonical-identity-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply identity hardening
        shell: bash
        run: |
          cat > scripts/repository-identity.mjs <<'EOF'
          const REPO_RE = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;

          export function canonicalRepoKey(value) {
            return String(value || '').trim().toLowerCase();
          }

          export function isValidRepositoryName(value) {
            return REPO_RE.test(String(value || '').trim());
          }

          export function repoNameFromFullName(value) {
            const repo = String(value || '').trim();
            if (!isValidRepositoryName(repo)) return '';
            return repo.split('/')[1];
          }

          export function canonicalRepoUrl(value) {
            const repo = String(value || '').trim();
            return isValidRepositoryName(repo) ? `https://github.com/${repo}` : '';
          }

          export function installProfile(category) {
            if (category === 'web-ui') return 'web';
            if (category === 'desktop') return 'desktop';
            return 'tools';
          }

          export function makeInstallCmd(fullName, category) {
            return `dsh plugin --profile ${installProfile(category)} add github:${fullName}`;
          }

          export function normalizeHttpUrl(value) {
            if (!value) return null;
            try {
              const url = new URL(String(value));
              if (url.protocol !== 'http:' && url.protocol !== 'https:') return null;
              return url.toString();
            } catch {
              return null;
            }
          }

          export function discoveryTopics(repo) {
            if (Array.isArray(repo?.topics)) return repo.topics.filter(Boolean).map(String);
            const nodes = repo?.repositoryTopics?.nodes || [];
            return nodes.map((node) => node?.topic?.name).filter(Boolean).map(String);
          }

          export function discoveryRepoId(repo) {
            const id = repo?.databaseId ?? repo?.id ?? null;
            if (id === null || id === undefined || id === '') return null;
            return String(id);
          }

          export function normalizeStoredPlugin(plugin) {
            const fullName = String(plugin?.full_name || plugin?.source?.repo || '').trim();
            if (!isValidRepositoryName(fullName)) return { ...plugin };
            const repoName = repoNameFromFullName(fullName);
            const authoritativeManifest = plugin?.manifest_file === 'dsh-plugin.json';
            const manualOverride = plugin?.metadata_source === 'override';
            const category = plugin?.category || 'other';
            const metadataSource = manualOverride ? 'override' : (authoritativeManifest ? 'dsh-plugin' : 'github');
            return {
              ...plugin,
              full_name: fullName,
              repo_name: repoName,
              repo_url: canonicalRepoUrl(fullName),
              install_cmd: makeInstallCmd(fullName, category),
              homepage: normalizeHttpUrl(plugin?.homepage),
              metadata_source: metadataSource,
              manifest_file: authoritativeManifest ? 'dsh-plugin.json' : null,
              verified: authoritativeManifest,
              name: metadataSource === 'github' ? repoName : (plugin?.name || repoName),
            };
          }

          export function mergeDiscoveredRepository(current, discovered) {
            if (!current) return normalizeStoredPlugin(discovered);
            const base = normalizeStoredPlugin(current);
            const live = normalizeStoredPlugin(discovered);
            const manifestAuthoritative = base.manifest_file === 'dsh-plugin.json';
            const manualOverride = base.metadata_source === 'override';
            const contentAuthoritative = manifestAuthoritative || manualOverride;
            const category = contentAuthoritative ? base.category : live.category;
            const merged = {
              ...base,
              repo_id: live.repo_id || base.repo_id || null,
              full_name: live.full_name,
              repo_name: live.repo_name,
              repo_url: canonicalRepoUrl(live.full_name),
              install_cmd: makeInstallCmd(live.full_name, category),
              topics: live.topics || [],
              stars: Number(live.stars || 0),
              forks: Number(live.forks || 0),
              watchers: Number(live.watchers || 0),
              open_issues: Number(live.open_issues || 0),
              created_at: live.created_at || base.created_at || '',
              updated_at: live.updated_at || base.updated_at || '',
              language: live.language || '',
              license: live.license || '',
              homepage: normalizeHttpUrl(contentAuthoritative ? (base.homepage || live.homepage) : live.homepage),
              snapshot_commit: live.snapshot_commit || base.snapshot_commit,
              snapshot_ref: live.snapshot_ref || base.snapshot_ref,
              deprecated: Boolean(live.deprecated),
              disabled: Boolean(live.disabled),
            };

            if (contentAuthoritative) {
              merged.metadata_source = manualOverride ? 'override' : 'dsh-plugin';
              merged.manifest_file = manifestAuthoritative ? 'dsh-plugin.json' : null;
              merged.verified = manifestAuthoritative;
              merged.category = base.category;
              merged.tags = Array.isArray(base.tags) ? base.tags : live.tags;
              merged.name = base.name || live.repo_name;
              merged.description = base.description || live.description || '';
            } else {
              merged.metadata_source = 'github';
              merged.manifest_file = null;
              merged.verified = false;
              merged.category = live.category;
              merged.tags = Array.isArray(live.tags) ? live.tags : [];
              merged.name = live.repo_name;
              merged.description = live.description || '';
            }
            return merged;
          }

          export function mergeCatalogPluginsWithDiscovery(existingPlugins, discoveredPlugins) {
            const byKey = new Map();
            const idToKey = new Map();
            for (const raw of existingPlugins || []) {
              const plugin = normalizeStoredPlugin(raw);
              const key = canonicalRepoKey(plugin.full_name);
              if (!key) continue;
              byKey.set(key, plugin);
              if (plugin.repo_id) idToKey.set(String(plugin.repo_id), key);
            }

            const discoveredKeys = new Set();
            let renamed = 0;
            for (const raw of discoveredPlugins || []) {
              const live = normalizeStoredPlugin(raw);
              const liveKey = canonicalRepoKey(live.full_name);
              if (!liveKey) continue;
              discoveredKeys.add(liveKey);
              const id = live.repo_id ? String(live.repo_id) : '';
              const matchedKey = (id && idToKey.get(id)) || (byKey.has(liveKey) ? liveKey : '');
              const current = matchedKey ? byKey.get(matchedKey) : null;
              if (matchedKey && matchedKey !== liveKey) {
                byKey.delete(matchedKey);
                renamed++;
              }
              const merged = mergeDiscoveredRepository(current, live);
              byKey.set(liveKey, merged);
              if (id) idToKey.set(id, liveKey);
            }

            const plugins = [];
            let pruned = 0;
            for (const [key, plugin] of byKey) {
              const mainTopic = (plugin.topics || []).some((topic) => String(topic).toLowerCase() === 'dsh-plugin');
              if (mainTopic && !discoveredKeys.has(key)) {
                pruned++;
                continue;
              }
              plugins.push(plugin);
            }
            return { plugins, renamed, pruned };
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          # github-discovery: stable repo ids, topics/counts, canonical URLs, case-insensitive identity.
          replace_once('scripts/github-discovery.mjs',
              "const API_BASE = 'https://api.github.com';",
              "import { canonicalRepoKey, canonicalRepoUrl, discoveryRepoId, discoveryTopics, makeInstallCmd, normalizeHttpUrl } from './repository-identity.mjs';\n\nconst API_BASE = 'https://api.github.com';")
          replace_once('scripts/github-discovery.mjs',
              "      nodes {\n        name\n        nameWithOwner\n        description\n        stargazerCount\n        forkCount",
              "      nodes {\n        databaseId\n        name\n        nameWithOwner\n        description\n        isArchived\n        isDisabled\n        stargazerCount\n        forkCount\n        watchers { totalCount }\n        issues(states: OPEN) { totalCount }\n        repositoryTopics(first: 20) { nodes { topic { name } } }")
          replace_once('scripts/github-discovery.mjs',
              "      if (repo?.nameWithOwner) repositories.set(repo.nameWithOwner, repo);",
              "      if (repo?.nameWithOwner) repositories.set(String(discoveryRepoId(repo) || canonicalRepoKey(repo.nameWithOwner)), repo);")
          replace_once('scripts/github-discovery.mjs',
              "  const unique = new Map();\n  for (const repo of items) if (repo?.full_name) unique.set(repo.full_name, repo);",
              "  const unique = new Map();\n  for (const repo of items) if (repo?.full_name) unique.set(String(discoveryRepoId(repo) || canonicalRepoKey(repo.full_name)), repo);")
          replace_once('scripts/github-discovery.mjs',
              "  const topics = repo.topics || [];",
              "  const topics = discoveryTopics(repo);")
          replace_once('scripts/github-discovery.mjs',
              "    slug: fullName.replace('/', '-'),\n    name: repo.name,",
              "    slug: fullName.replace('/', '-'),\n    repo_id: discoveryRepoId(repo),\n    name: repo.name,")
          replace_once('scripts/github-discovery.mjs',
              "    watchers: Number(repo.watchers_count || 0),\n    open_issues: Number(repo.open_issues_count || 0),",
              "    watchers: Number(repo.watchers?.totalCount ?? repo.subscribers_count ?? 0),\n    open_issues: Number(repo.issues?.totalCount ?? repo.open_issues_count ?? 0),")
          replace_once('scripts/github-discovery.mjs',
              "    install_cmd: `dsh plugin --profile tools add github:${fullName}`,\n    repo_url: repo.url || repo.html_url || `https://github.com/${fullName}`,\n    homepage: repo.homepageUrl || repo.homepage || null,",
              "    install_cmd: makeInstallCmd(fullName, category),\n    repo_url: canonicalRepoUrl(fullName),\n    homepage: normalizeHttpUrl(repo.homepageUrl || repo.homepage || null),\n    deprecated: Boolean(repo.isArchived ?? repo.archived),\n    disabled: Boolean(repo.isDisabled ?? repo.disabled),")

          # sync: canonicalize every record, dedupe by stable repo id, and repair retained legacy records.
          replace_once('scripts/sync.mjs',
              "import { fileURLToPath } from 'node:url';",
              "import { fileURLToPath } from 'node:url';\nimport { canonicalRepoKey, canonicalRepoUrl, discoveryRepoId, makeInstallCmd, normalizeStoredPlugin } from './repository-identity.mjs';")
          replace_once('scripts/sync.mjs',
              "function makeInstallCmd(fullName, category) {\n  const profile = category === 'web-ui' ? 'web' : category === 'desktop' ? 'desktop' : 'tools';\n  return `dsh plugin --profile ${profile} add github:${fullName}`;\n}\n\n",
              "")
          replace_once('scripts/sync.mjs',
              "  const old = oldPlugins.find((p) => p.full_name === fullName);",
              "  const repoId = discoveryRepoId(repo);\n  const repoKey = canonicalRepoKey(fullName);\n  const old = oldPlugins.find((p) => (repoId && String(p.repo_id || '') === repoId) || canonicalRepoKey(p.full_name) === repoKey);")
          replace_once('scripts/sync.mjs',
              "  return {\n    slug: fullName.replace('/', '-'),",
              "  return normalizeStoredPlugin({\n    slug: fullName.replace('/', '-'),\n    repo_id: repoId,")
          replace_once('scripts/sync.mjs',
              "    watchers: repo.subscribers_count || repo.watchers_count || 0,",
              "    watchers: repo.subscribers_count || 0,")
          replace_once('scripts/sync.mjs',
              "    repo_url: repo.html_url || `https://github.com/${fullName}`,",
              "    repo_url: canonicalRepoUrl(fullName),")
          replace_once('scripts/sync.mjs',
              "    snapshot_commit: repo.default_branch || 'main',\n  };",
              "    snapshot_commit: repo.default_branch || 'main',\n    snapshot_ref: repo.default_branch || 'main',\n  });")
          replace_once('scripts/sync.mjs',
              "  const seen = new Set();\n  repos = repos.filter((r) => {\n    if (seen.has(r.full_name)) return false;\n    seen.add(r.full_name);\n    return true;\n  });",
              "  const seen = new Set();\n  repos = repos.filter((r) => {\n    const key = String(discoveryRepoId(r) || canonicalRepoKey(r.full_name));\n    if (!key || seen.has(key)) return false;\n    seen.add(key);\n    return true;\n  });")
          replace_once('scripts/sync.mjs',
              "    const currentNames = new Set(plugins.map((p) => p.full_name));\n    let kept = 0;\n    for (const old of oldPlugins) {\n      if (!currentNames.has(old.full_name)) { plugins.push(old); kept++; }\n    }",
              "    const currentKeys = new Set(plugins.map((p) => canonicalRepoKey(p.full_name)));\n    const currentIds = new Set(plugins.map((p) => String(p.repo_id || '')).filter(Boolean));\n    let kept = 0;\n    for (const oldRaw of oldPlugins) {\n      const old = normalizeStoredPlugin(oldRaw);\n      const oldKey = canonicalRepoKey(old.full_name);\n      const oldId = String(old.repo_id || '');\n      if (!currentKeys.has(oldKey) && (!oldId || !currentIds.has(oldId))) { plugins.push(old); kept++; }\n    }")
          replace_once('scripts/sync.mjs',
              "  if (o.name) plugin.name = o.name;\n  if (o.description) plugin.description = o.description;",
              "  if (o.name) { plugin.name = o.name; plugin.metadata_source = 'override'; }\n  if (o.description) { plugin.description = o.description; plugin.metadata_source = 'override'; }")
          replace_once('scripts/sync.mjs',
              "    plugin.category = o.category in CATEGORIES ? o.category : 'other';",
              "    plugin.category = o.category in CATEGORIES ? o.category : 'other';\n    plugin.metadata_source = 'override';")
          replace_once('scripts/sync.mjs',
              "function buildFeed(plugins) {",
              "export function buildFeed(plugins) {")

          # sync-v3: complete discovery becomes authoritative identity layer and writes repaired legacy catalog back.
          replace_once('scripts/sync-v3.mjs',
              "import { sha256 } from './checksum.mjs';",
              "import { sha256 } from './checksum.mjs';\nimport { buildFeed } from './sync.mjs';\nimport { mergeCatalogPluginsWithDiscovery } from './repository-identity.mjs';")
          replace_once('scripts/sync-v3.mjs',
              "const META_FILE = resolve(CATALOG, 'meta.json');",
              "const META_FILE = resolve(CATALOG, 'meta.json');\nconst FEED_FILE = resolve(CATALOG, 'feed.xml');")
          replace_once('scripts/sync-v3.mjs',
              "function parseMode() { if (process.argv.includes('--full')) return 'full'; if (process.argv.includes('--incremental')) return 'incremental'; return process.env.SYNC_MODE === 'full' ? 'full' : 'incremental'; }",
              "function parseMode() { if (process.argv.includes('--full')) return 'full'; if (process.argv.includes('--incremental')) return 'incremental'; return process.env.SYNC_MODE === 'full' ? 'full' : 'incremental'; }\n\nfunction rebuildLegacyCatalog(source, plugins) {\n  const now = Date.now();\n  for (const plugin of plugins) {\n    const updated7 = now - new Date(plugin.updated_at || 0).getTime() < 7 * 864e5 ? 1 : 0;\n    const created30 = now - new Date(plugin.created_at || 0).getTime() < 30 * 864e5 ? 1 : 0;\n    plugin.trend_score = Number(plugin.stars || 0) + 20 * updated7 + 10 * created30;\n  }\n  plugins.sort((a, b) => (a.verified !== b.verified ? (a.verified ? -1 : 1) : Number(b.trend_score || 0) - Number(a.trend_score || 0)));\n  plugins.forEach((plugin, index) => { plugin.rank = index + 1; });\n  const byCategory = {}, byLanguage = {}, byLicense = {};\n  let verified = 0;\n  for (const plugin of plugins) {\n    byCategory[plugin.category || 'other'] = (byCategory[plugin.category || 'other'] || 0) + 1;\n    if (plugin.language) byLanguage[plugin.language] = (byLanguage[plugin.language] || 0) + 1;\n    if (plugin.license) byLicense[plugin.license] = (byLicense[plugin.license] || 0) + 1;\n    if (plugin.verified) verified++;\n  }\n  const etag = sha256(JSON.stringify(plugins)).slice(0, 16);\n  return { ...source, meta: { ...(source.meta || {}), updated_at: new Date().toISOString(), count: plugins.length, etag, stats: { total: plugins.length, verified, by_category: byCategory, by_language: byLanguage, by_license: byLicense } }, plugins };\n}")
          replace_once('scripts/sync-v3.mjs',
              "  const legacy = await readJson(LEGACY_FILE);",
              "  let legacy = await readJson(LEGACY_FILE);")
          replace_once('scripts/sync-v3.mjs',
              "    const byRepo = new Map((legacy.plugins || []).map((plugin) => [plugin.full_name, { ...plugin }]));\n    for (const repo of discovery.repositories) {\n      const discovered = discoveryRepoToLegacy(repo);\n      if (!discovered.full_name) continue;\n      const current = byRepo.get(discovered.full_name);\n      if (current) {\n        if (/^[0-9a-f]{40}$/i.test(discovered.snapshot_commit || '')) current.snapshot_commit = discovered.snapshot_commit;\n        if (discovered.snapshot_ref) current.snapshot_ref = discovered.snapshot_ref;\n        byRepo.set(discovered.full_name, current);\n      } else {\n        byRepo.set(discovered.full_name, discovered);\n      }\n    }\n    registryCatalog = { ...legacy, meta: { ...(legacy.meta || {}), count: byRepo.size }, plugins: [...byRepo.values()] };\n    console.log(`[sync-v3] complete discovery transport=${discoveryTransport} reported=${discovery.reported_total} unique=${discoveredCount} merged=${registryCatalog.plugins.length}`);",
              "    const discoveredPlugins = discovery.repositories.map(discoveryRepoToLegacy).filter((plugin) => plugin.full_name && !plugin.disabled);\n    const merged = mergeCatalogPluginsWithDiscovery(legacy.plugins || [], discoveredPlugins);\n    const canonicalLegacy = rebuildLegacyCatalog(legacy, merged.plugins);\n    const legacyChanged = JSON.stringify(canonicalLegacy.plugins) !== JSON.stringify(legacy.plugins || []);\n    if (legacyChanged) {\n      await writeJsonAtomic(LEGACY_FILE, canonicalLegacy);\n      await writeFile(FEED_FILE, buildFeed(canonicalLegacy.plugins), 'utf8');\n      console.log(`[sync-v3] canonical legacy catalog repaired: renamed=${merged.renamed} pruned=${merged.pruned} count=${canonicalLegacy.plugins.length}`);\n    }\n    legacy = canonicalLegacy;\n    registryCatalog = canonicalLegacy;\n    console.log(`[sync-v3] complete discovery transport=${discoveryTransport} reported=${discovery.reported_total} unique=${discoveredCount} merged=${registryCatalog.plugins.length}`);")

          # registry builder: case-insensitive identity + stable repo id + canonical URLs.
          replace_once('scripts/registry-v3-builder.mjs',
              "import { artifactIntegrity, registryContentHash } from './checksum.mjs';",
              "import { artifactIntegrity, registryContentHash } from './checksum.mjs';\nimport { canonicalRepoKey, canonicalRepoUrl, makeInstallCmd, repoNameFromFullName } from './repository-identity.mjs';")
          replace_once('scripts/registry-v3-builder.mjs',
              "      name: legacy.name || normalized.id, repo_name: legacy.repo_name || normalized.repo.split('/')[1],",
              "      name: legacy.name || normalized.id, repo_id: legacy.repo_id || null, repo_name: legacy.repo_name || repoNameFromFullName(normalized.repo),")
          replace_once('scripts/registry-v3-builder.mjs',
              "      stars: Number(legacy.stars || 0), rank: Number(legacy.rank || 0), repo_url: legacy.repo_url || `https://github.com/${normalized.repo}`,\n      install_cmd: legacy.install_cmd || '', manifest_file: legacy.manifest_file || null,",
              "      stars: Number(legacy.stars || 0), rank: Number(legacy.rank || 0), repo_url: canonicalRepoUrl(normalized.repo),\n      install_cmd: makeInstallCmd(normalized.repo, legacy.category || 'other'), manifest_file: legacy.manifest_file || null,")
          replace_once('scripts/registry-v3-builder.mjs',
              "  const existingByRepo = new Map((existingRegistry?.plugins || []).filter((p) => p?.source?.repo).map((p) => [p.source.repo, p]));",
              "  const existingByRepo = new Map((existingRegistry?.plugins || []).filter((p) => p?.source?.repo).map((p) => [canonicalRepoKey(p.source.repo), p]));\n  const existingByRepoId = new Map((existingRegistry?.plugins || []).filter((p) => p?.metadata?.repo_id).map((p) => [String(p.metadata.repo_id), p]));")
          replace_once('scripts/registry-v3-builder.mjs',
              "    if (seenRepos.has(normalized.repo)) { excluded.push({ repo: normalized.repo, reason: 'duplicate repository' }); continue; }\n    seenIds.add(normalized.id); seenRepos.add(normalized.repo); inputs.push({ legacy, normalized });",
              "    const repoKey = canonicalRepoKey(normalized.repo);\n    if (seenRepos.has(repoKey)) { excluded.push({ repo: normalized.repo, reason: 'duplicate repository' }); continue; }\n    seenIds.add(normalized.id); seenRepos.add(repoKey); inputs.push({ legacy, normalized });")
          replace_once('scripts/registry-v3-builder.mjs',
              "    const previous = existingByRepo.get(normalized.repo);",
              "    const previous = (legacy.repo_id && existingByRepoId.get(String(legacy.repo_id))) || existingByRepo.get(canonicalRepoKey(normalized.repo));")
          replace_once('scripts/registry-v3-builder.mjs',
              "      if (!repo || seenRepos.has(repo)) continue;",
              "      const repoKey = canonicalRepoKey(repo);\n      if (!repo || seenRepos.has(repoKey)) continue;")
          replace_once('scripts/registry-v3-builder.mjs',
              "      plugins.push(previous); seenRepos.add(repo); seenIds.add(previous.id); reusedExistingOnly++;",
              "      plugins.push(previous); seenRepos.add(repoKey); seenIds.add(previous.id); reusedExistingOnly++;")

          # Legacy/API validators and search surface.
          replace_once('scripts/validate.mjs',
              "import { fileURLToPath } from 'node:url';",
              "import { fileURLToPath } from 'node:url';\nimport { canonicalRepoKey, canonicalRepoUrl, makeInstallCmd, repoNameFromFullName } from './repository-identity.mjs';")
          replace_once('scripts/validate.mjs',
              "  const slugs = new Set();",
              "  const slugs = new Set();\n  const repos = new Set();\n  const repoIds = new Set();")
          replace_once('scripts/validate.mjs',
              "    if (!p.full_name || !p.full_name.includes('/')) errors.push(`full_name 非法: ${p.slug}`);",
              "    if (!p.full_name || !p.full_name.includes('/')) errors.push(`full_name 非法: ${p.slug}`);\n    const repoKey = canonicalRepoKey(p.full_name);\n    if (repos.has(repoKey)) errors.push(`full_name 大小写归一后重复: ${p.full_name}`);\n    repos.add(repoKey);\n    if (p.repo_id) { const repoId = String(p.repo_id); if (repoIds.has(repoId)) errors.push(`repo_id 重复: ${repoId}`); repoIds.add(repoId); }\n    if (p.repo_name && p.repo_name !== repoNameFromFullName(p.full_name)) errors.push(`repo_name 与 full_name 不一致: ${p.full_name}`);\n    if (p.repo_url && p.repo_url !== canonicalRepoUrl(p.full_name)) errors.push(`repo_url 非 canonical GitHub 地址: ${p.full_name}`);\n    if (p.install_cmd && p.install_cmd !== makeInstallCmd(p.full_name, p.category || 'other')) errors.push(`install_cmd 与仓库身份不一致: ${p.full_name}`);\n    if (p.metadata_source === 'github' && p.name !== repoNameFromFullName(p.full_name)) errors.push(`GitHub 来源名称与仓库名不一致: ${p.full_name} -> ${p.name}`);")

          replace_once('scripts/validate-registry-v3.mjs',
              "import { DEFAULT_PLUGIN_VERSION, REGISTRY_VERSION, SCHEMA_VERSION, isCommitSha } from './registry-v3-builder.mjs';",
              "import { DEFAULT_PLUGIN_VERSION, REGISTRY_VERSION, SCHEMA_VERSION, isCommitSha } from './registry-v3-builder.mjs';\nimport { canonicalRepoKey, canonicalRepoUrl, makeInstallCmd, repoNameFromFullName } from './repository-identity.mjs';")
          replace_once('scripts/validate-registry-v3.mjs',
              "    if (repos.has(repo)) errors.push(`${id}: duplicate source.repo ${repo}`);\n    repos.add(repo);",
              "    const repoKey = canonicalRepoKey(repo);\n    if (repos.has(repoKey)) errors.push(`${id}: duplicate source.repo ${repo}`);\n    repos.add(repoKey);")
          replace_once('scripts/validate-registry-v3.mjs',
              "    if (!Array.isArray(plugin?.dependencies)) errors.push(`${id}: dependencies must be array`);",
              "    if (!Array.isArray(plugin?.dependencies)) errors.push(`${id}: dependencies must be array`);\n    const metadata = plugin?.metadata || {};\n    if (metadata.repo_name && metadata.repo_name !== repoNameFromFullName(repo)) errors.push(`${id}: metadata.repo_name mismatch`);\n    if (metadata.repo_url && metadata.repo_url !== canonicalRepoUrl(repo)) errors.push(`${id}: metadata.repo_url is not canonical`);\n    if (metadata.install_cmd && metadata.install_cmd !== makeInstallCmd(repo, metadata.category || 'other')) errors.push(`${id}: metadata.install_cmd source mismatch`);\n    if (metadata.verified && metadata.manifest_file !== 'dsh-plugin.json') errors.push(`${id}: verified metadata requires dsh-plugin.json`);\n    if (metadata.manifest_file && metadata.manifest_file !== 'dsh-plugin.json') errors.push(`${id}: unsupported manifest_file ${metadata.manifest_file}`);")

          replace_once('functions/_lib.ts',
              "  name: string;\n  full_name: string;",
              "  name: string;\n  repo_name?: string;\n  repo_id?: string | null;\n  metadata_source?: 'github' | 'dsh-plugin' | 'override';\n  full_name: string;")
          replace_once('functions/_lib.ts',
              "        p.name.toLowerCase().includes(kw) ||\n        p.description.toLowerCase().includes(kw) ||",
              "        p.name.toLowerCase().includes(kw) ||\n        p.full_name.toLowerCase().includes(kw) ||\n        (p.repo_name || '').toLowerCase().includes(kw) ||\n        p.description.toLowerCase().includes(kw) ||")

          # Package command and sync gate.
          replace_once('package.json',
              "    \"validate\": \"node scripts/validate.mjs\",",
              "    \"validate\": \"node scripts/validate.mjs\",\n    \"audit:identity\": \"node scripts/audit-catalog-identity.mjs\",")
          replace_once('.github/workflows/sync.yml',
              "          npm run validate\n          npm run registry:verify",
              "          npm run validate\n          npm run audit:identity -- --strict\n          npm run registry:verify")
          PY

          cat > scripts/audit-catalog-identity.mjs <<'EOF'
          #!/usr/bin/env node
          import { readFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { canonicalRepoKey, canonicalRepoUrl, makeInstallCmd, repoNameFromFullName } from './repository-identity.mjs';

          export function auditCatalogIdentity(data) {
            const errors = [];
            const repos = new Set();
            const repoIds = new Set();
            for (const plugin of data?.plugins || []) {
              const label = plugin.full_name || plugin.slug || '<unknown>';
              const key = canonicalRepoKey(plugin.full_name);
              const repoName = repoNameFromFullName(plugin.full_name);
              if (!repoName) errors.push(`${label}: invalid full_name`);
              if (repos.has(key)) errors.push(`${label}: duplicate repository after case normalization`);
              repos.add(key);
              if (plugin.repo_id) {
                const id = String(plugin.repo_id);
                if (repoIds.has(id)) errors.push(`${label}: duplicate repo_id ${id}`);
                repoIds.add(id);
              }
              if (plugin.repo_name !== repoName) errors.push(`${label}: repo_name mismatch (${plugin.repo_name || '<missing>'})`);
              if (plugin.repo_url !== canonicalRepoUrl(plugin.full_name)) errors.push(`${label}: non-canonical repo_url (${plugin.repo_url || '<missing>'})`);
              if (plugin.install_cmd !== makeInstallCmd(plugin.full_name, plugin.category || 'other')) errors.push(`${label}: install_cmd source mismatch`);
              if (plugin.manifest_file && plugin.manifest_file !== 'dsh-plugin.json') errors.push(`${label}: package/non-DSH manifest used (${plugin.manifest_file})`);
              if (plugin.verified && plugin.manifest_file !== 'dsh-plugin.json') errors.push(`${label}: verified without dsh-plugin.json`);
              if (plugin.metadata_source === 'github' && plugin.name !== repoName) errors.push(`${label}: GitHub-sourced name mismatch (${plugin.name})`);
              if (plugin.repo_url?.startsWith('https://api.github.com/')) errors.push(`${label}: GitHub API URL exposed as repository URL`);
            }
            return { errors, count: data?.plugins?.length || 0 };
          }

          async function main() {
            const file = process.argv.find((arg) => arg.endsWith('.json')) || resolve(process.cwd(), 'catalog/plugins.json');
            const strict = process.argv.includes('--strict');
            const data = JSON.parse(await readFile(file, 'utf8'));
            const result = auditCatalogIdentity(data);
            console.log(`[identity-audit] plugins=${result.count} errors=${result.errors.length}`);
            result.errors.slice(0, 100).forEach((error) => console.error(`[identity-audit] ${error}`));
            if (strict && result.errors.length) process.exit(1);
          }

          if (process.argv[1]?.endsWith('audit-catalog-identity.mjs')) main().catch((error) => { console.error(error); process.exit(1); });
          EOF

          cat > tests/repository-identity.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';

          const {
            canonicalRepoKey, canonicalRepoUrl, discoveryTopics, makeInstallCmd,
            mergeCatalogPluginsWithDiscovery, normalizeStoredPlugin,
          } = await import('../scripts/repository-identity.mjs');
          const { discoveryRepoToLegacy } = await import('../scripts/github-discovery.mjs');
          const { auditCatalogIdentity } = await import('../scripts/audit-catalog-identity.mjs');

          describe('repository identity', () => {
            it('normalizes GitHub identity independent of package metadata', () => {
              const plugin: any = normalizeStoredPlugin({
                full_name: 'ruvnet/ruflo', name: 'claude-flow', category: 'agent',
                manifest_file: 'package.json', verified: true, repo_url: 'https://api.github.com/repos/ruvnet/ruflo',
              });
              expect(plugin.name).toBe('ruflo');
              expect(plugin.repo_name).toBe('ruflo');
              expect(plugin.manifest_file).toBeNull();
              expect(plugin.verified).toBe(false);
              expect(plugin.repo_url).toBe('https://github.com/ruvnet/ruflo');
              expect(plugin.install_cmd).toContain('github:ruvnet/ruflo');
            });

            it('uses stable repo ids to reconcile renames and removes stale identity', () => {
              const current: any = { full_name: 'owner/old-name', repo_id: '42', name: 'old-name', category: 'tool', topics: ['dsh-plugin'] };
              const live: any = { full_name: 'owner/new-name', repo_id: '42', name: 'new-name', repo_name: 'new-name', category: 'tool', topics: ['dsh-plugin'], tags: ['dsh-plugin'], stars: 1, repo_url: 'x' };
              const merged = mergeCatalogPluginsWithDiscovery([current], [live]);
              expect(merged.renamed).toBe(1);
              expect(merged.plugins).toHaveLength(1);
              expect(merged.plugins[0].full_name).toBe('owner/new-name');
              expect(merged.plugins[0].name).toBe('new-name');
            });

            it('deduplicates repository identity case-insensitively', () => {
              expect(canonicalRepoKey('Owner/Repo')).toBe(canonicalRepoKey('owner/repo'));
            });

            it('extracts GraphQL topics and true watcher/issue counts', () => {
              const repo: any = {
                databaseId: 7, name: 'demo', nameWithOwner: 'owner/demo', url: 'https://github.com/owner/demo',
                repositoryTopics: { nodes: [{ topic: { name: 'mcp' } }, { topic: { name: 'dsh-plugin' } }] },
                watchers: { totalCount: 9 }, issues: { totalCount: 3 }, stargazerCount: 100, forkCount: 5,
                defaultBranchRef: { name: 'main', target: { oid: '0123456789abcdef0123456789abcdef01234567' } },
              };
              expect(discoveryTopics(repo)).toEqual(['mcp', 'dsh-plugin']);
              const plugin: any = discoveryRepoToLegacy(repo);
              expect(plugin.category).toBe('mcp');
              expect(plugin.watchers).toBe(9);
              expect(plugin.open_issues).toBe(3);
              expect(plugin.repo_url).toBe('https://github.com/owner/demo');
              expect(plugin.repo_id).toBe('7');
            });

            it('audits wrong repo URLs and install sources', () => {
              const data: any = { plugins: [{ full_name: 'owner/demo', repo_name: 'demo', name: 'demo', metadata_source: 'github', category: 'tool', repo_url: 'https://api.github.com/repos/owner/demo', install_cmd: 'bad', manifest_file: null, verified: false }] };
              const result = auditCatalogIdentity(data);
              expect(result.errors.some((e: string) => e.includes('repo_url'))).toBe(true);
              expect(result.errors.some((e: string) => e.includes('install_cmd'))).toBe(true);
              expect(canonicalRepoUrl('owner/demo')).toBe('https://github.com/owner/demo');
              expect(makeInstallCmd('owner/demo', 'tool')).toContain('github:owner/demo');
            });
          });
          EOF

