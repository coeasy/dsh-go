name: Apply repository identity hardening

on:
  push:
    branches: ["fix/canonical-repository-identity"]
    paths:
      - ".github/workflows/apply-canonical-identity-fix.yml"

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply hardening patch
        shell: bash
        run: |
          git show bae96ce204e17ea97864897601e57b7404858986:.github/workflows/apply-canonical-identity-fix.yml > /tmp/hardening-source.yml
          python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/hardening-source.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if line == '      - name: Apply identity hardening')
          run_line = next(i for i in range(start + 1, len(src)) if src[i] == '        run: |')
          end = next(i for i in range(run_line + 1, len(src)) if src[i].startswith('      - name: '))
          body = [line[10:] if line.startswith('          ') else line for line in src[run_line + 1:end]]
          Path('/tmp/apply-hardening.sh').write_text('\n'.join(body) + '\n')
          PY
          bash -euxo pipefail /tmp/apply-hardening.sh
      - name: Verify
        shell: bash
        run: |
          npm ci
          cd site && npm ci && cd ..
          node --check scripts/repository-identity.mjs
          node --check scripts/audit-catalog-identity.mjs
          node --check scripts/github-discovery.mjs
          node --check scripts/sync.mjs
          node --check scripts/sync-v3.mjs
          node --check scripts/registry-v3-builder.mjs
          node --check scripts/validate.mjs
          node --check scripts/validate-registry-v3.mjs
          npm run typecheck
          npm run lint
          npm test
          cd site && npm run check && cd ..
          npm run audit:identity || true
      - name: Commit source hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/repository-identity.mjs scripts/audit-catalog-identity.mjs scripts/github-discovery.mjs scripts/sync.mjs scripts/sync-v3.mjs scripts/registry-v3-builder.mjs scripts/validate.mjs scripts/validate-registry-v3.mjs functions/_lib.ts tests/repository-identity.test.ts package.json
          git commit -m "fix: harden repository identity and catalog URLs"
          git push
