name: Validate ephemeral observation sidecar

on:
  push:
    branches: ["fix/canonical-repository-identity"]
    paths:
      - ".github/workflows/apply-canonical-identity-fix.yml"

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Replace persistent observation timestamps with sidecar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/sync.mjs')
          text = p.read_text()
          old = "const FEED_FILE = resolve(CATALOG_DIR, 'feed.xml');\n"
          new = "const FEED_FILE = resolve(CATALOG_DIR, 'feed.xml');\nconst OBSERVED_FILE = resolve(CATALOG_DIR, '.sync-observed.json');\n"
          if text.count(old) != 1:
              raise SystemExit('FEED_FILE anchor mismatch')
          text = text.replace(old, new, 1)
          old = "    observed_at: now,\n"
          if text.count(old) != 1:
              raise SystemExit('observed_at anchor mismatch')
          text = text.replace(old, '', 1)
          old = "  const extraCount = repos.filter((r) => r.__extra).length;\n  log(`搜索到 ${repos.length} 个候选仓库（含补充主题 ${extraCount} 个）`);\n"
          new = "  const extraCount = repos.filter((r) => r.__extra).length;\n  log(`搜索到 ${repos.length} 个候选仓库（含补充主题 ${extraCount} 个）`);\n\n  // Full-sync liveness is passed to Sync V3 through an ephemeral sidecar. It is\n  // deliberately excluded from plugins.json so repeated full syncs remain idempotent.\n  if (mode === 'full') {\n    const observedRepos = [...new Set(repos.map((repo) => repo.full_name).filter(Boolean))];\n    const observedRepoIds = [...new Set(repos.map((repo) => discoveryRepoId(repo)).filter(Boolean))];\n    await writeFile(OBSERVED_FILE, JSON.stringify({ mode: 'full', repos: observedRepos, repo_ids: observedRepoIds }, null, 2) + '\\n');\n    log(`写入临时观测集合：repos=${observedRepos.length}, repo_ids=${observedRepoIds.length}`);\n  }\n"
          if text.count(old) != 1:
              raise SystemExit('dedupe log anchor mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Verify code and UI
        shell: bash
        run: |
          npm ci
          cd site && npm ci && cd ..
          node --check scripts/sync.mjs
          node --check scripts/sync-v3.mjs
          node --check scripts/repository-identity.mjs
          npm run typecheck
          npm run lint
          npm test
          cd site && npm run check && cd ..
      - name: Commit source change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/sync.mjs
          git commit -m "fix: keep full-sync observations ephemeral"
          git push
