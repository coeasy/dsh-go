name: Monitor

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require SITE_URL
        run: |
          [ -n "$SITE_URL" ] || { echo "SITE_URL repository variable is missing"; exit 1; }
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Check site and API
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          curl -fsS --max-time 20 "${SITE_URL}/" >/dev/null
          curl -fsS --max-time 20 "${SITE_URL}/api/v1/health" >/dev/null
          curl -fsS --max-time 20 "${SITE_URL}/api/v1/registry" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d);if(r.registry_version!==3||!r.generated?.content_hash||!r.plugins?.length)process.exit(1)})"
      - name: Check data freshness and registry consistency
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          META=$(curl -fsS --max-time 20 "${SITE_URL}/api/v1/meta")
          UPDATED=$(printf '%s' "$META" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).last_sync.at))")
          AGE_H=$(( ( $(date +%s) - $(date -d "$UPDATED" +%s) ) / 3600 ))
          [ "$AGE_H" -lt 36 ] || { echo "Data is stale: ${AGE_H}h"; exit 1; }
          META_HASH=$(printf '%s' "$META" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).registry.content_hash))")
          REG_HASH=$(curl -fsS --max-time 20 "${SITE_URL}/catalog/registry-v3.json" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).generated.content_hash))")
          [ "$META_HASH" = "$REG_HASH" ] || { echo "Registry/meta hash mismatch"; exit 1; }
          echo "Registry healthy, data age=${AGE_H}h, hash=${REG_HASH}"
