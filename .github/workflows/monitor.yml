name: Monitor

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact release SHA to verify"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ inputs.commit_sha || github.sha }}
  cancel-in-progress: false

env:
  DEPLOYMENT_SHA: ${{ inputs.commit_sha || github.sha }}
  SITE_URL: ${{ vars.SITE_URL || 'https://dsh-go.pages.dev' }}
  GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  EDGEONE_SITE_URL: ${{ vars.EDGEONE_SITE_URL || 'https://dsh-go.edgeone.cool' }}
  EDGEONE_STABLE_CONFIGURED: "true"

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}
          fetch-depth: 1

      - name: Verify release revision and authority
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          [ "$ACTUAL" = "$DEPLOYMENT_SHA" ] || { echo "Release revision mismatch: expected=$DEPLOYMENT_SHA actual=$ACTUAL"; exit 1; }
          node scripts/validate-registry-v4.mjs catalog/registry-v4.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check Cloudflare API V2 authority
        id: cloudflare-api
        continue-on-error: true
        env:
          BASE_URL: ${{ env.SITE_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL%/}"
          EXPECTED_REVISION=$(node -p "require('./catalog/registry-v4.json').revision")
          EXPECTED_PACKAGES=$(node -p "require('./catalog/registry-v4.json').packages.length")
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 20 "${BASE_URL}/api/v2/health?__dsh_smoke=${DEPLOYMENT_SHA}-${attempt}" -o /tmp/health.json \
              && EXPECTED_REVISION="$EXPECTED_REVISION" EXPECTED_PACKAGES="$EXPECTED_PACKAGES" node -e "const h=require('/tmp/health.json');const d=h.data||{};if(d.status!=='ok'||d.protocol_version!==2||d.registry_schema!==4||d.registry_revision!==process.env.EXPECTED_REVISION||String(d.package_count)!==process.env.EXPECTED_PACKAGES)process.exit(1)"; then
              echo "Cloudflare API V2 converged to Registry V4 ${EXPECTED_REVISION}"
              exit 0
            fi
            echo "Cloudflare API V2 not converged (${attempt}/18)"
            sleep 10
          done
          echo "::error::Cloudflare API V2 did not converge to expected Registry V4 revision"
          exit 1

      - name: Check Cloudflare exact SHA
        id: cloudflare-sha
        continue-on-error: true
        if: always()
        env:
          DEPLOY_BASE_URL: ${{ env.SITE_URL }}
          EXPECTED_DEPLOYMENT_SHA: ${{ env.DEPLOYMENT_SHA }}
          DEPLOY_LABEL: Cloudflare Pages final smoke
          DEPLOY_SHA_ATTEMPTS: "18"
          DEPLOY_SHA_DELAY_MS: "10000"
        run: node scripts/check-production-sha.mjs

      - name: Check Cloudflare Registry V4
        id: cloudflare-registry
        continue-on-error: true
        if: always()
        env:
          DEPLOY_BASE_URL: ${{ env.SITE_URL }}
          DEPLOY_LABEL: Cloudflare Pages final smoke
          DEPLOY_CONVERGENCE_ATTEMPTS: "18"
          DEPLOY_CONVERGENCE_DELAY_MS: "10000"
        run: node scripts/check-deployment-convergence.mjs

      - name: Check GitHub Pages exact SHA
        id: pages-sha
        continue-on-error: true
        if: always()
        env:
          DEPLOY_BASE_URL: ${{ env.GITHUB_PAGES_URL }}
          EXPECTED_DEPLOYMENT_SHA: ${{ env.DEPLOYMENT_SHA }}
          DEPLOY_LABEL: GitHub Pages final smoke
          DEPLOY_SHA_ATTEMPTS: "18"
          DEPLOY_SHA_DELAY_MS: "10000"
        run: node scripts/check-production-sha.mjs

      - name: Check GitHub Pages Registry V4
        id: pages-registry
        continue-on-error: true
        if: always()
        env:
          DEPLOY_BASE_URL: ${{ env.GITHUB_PAGES_URL }}
          DEPLOY_LABEL: GitHub Pages final smoke
          DEPLOY_CONVERGENCE_ATTEMPTS: "18"
          DEPLOY_CONVERGENCE_DELAY_MS: "10000"
        run: node scripts/check-deployment-convergence.mjs

      - name: Check EdgeOne exact SHA
        id: edgeone-sha
        continue-on-error: true
        if: ${{ always() && env.EDGEONE_SITE_URL != '' }}
        env:
          DEPLOY_BASE_URL: ${{ env.EDGEONE_SITE_URL }}
          EXPECTED_DEPLOYMENT_SHA: ${{ env.DEPLOYMENT_SHA }}
          DEPLOY_LABEL: Tencent EdgeOne final smoke
          DEPLOY_SHA_ATTEMPTS: "30"
          DEPLOY_SHA_DELAY_MS: "10000"
        run: node scripts/check-production-sha.mjs

      - name: Check EdgeOne Registry V4
        id: edgeone-registry
        continue-on-error: true
        if: ${{ always() && env.EDGEONE_SITE_URL != '' }}
        env:
          DEPLOY_BASE_URL: ${{ env.EDGEONE_SITE_URL }}
          DEPLOY_LABEL: Tencent EdgeOne final smoke
          DEPLOY_CONVERGENCE_ATTEMPTS: "18"
          DEPLOY_CONVERGENCE_DELAY_MS: "10000"
        run: node scripts/check-deployment-convergence.mjs

      - name: Check Provider Adapter Registry on static targets
        id: providers
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          EXPECTED_HASH=$(node -p "require('./catalog/provider-adapters.json').generated.content_hash")
          EXPECTED_COUNT=$(node -p "require('./catalog/provider-adapters.json').providers.length")
          failed=0
          targets=("cloudflare|$SITE_URL" "github_pages|$GITHUB_PAGES_URL")
          if [ -n "$EDGEONE_SITE_URL" ]; then targets+=("edgeone|$EDGEONE_SITE_URL"); fi
          for TARGET in "${targets[@]}"; do
            label=${TARGET%%|*}; BASE=${TARGET#*|}; BASE="${BASE%/}"; outcome=failure
            for attempt in $(seq 1 18); do
              if curl -fsS --max-time 20 "${BASE}/catalog/provider-adapters.json?__dsh_smoke=${DEPLOYMENT_SHA}-${attempt}" -o /tmp/providers.json \
                && EXPECTED_HASH="$EXPECTED_HASH" EXPECTED_COUNT="$EXPECTED_COUNT" node -e "const p=require('/tmp/providers.json');if(p.generated?.content_hash!==process.env.EXPECTED_HASH||String(p.providers?.length)!==process.env.EXPECTED_COUNT)process.exit(1)"; then outcome=success; break; fi
              sleep 10
            done
            echo "${label}=${outcome}" >> "$GITHUB_OUTPUT"
            [ "$outcome" = success ] || { echo "::error::Provider Adapter Registry did not converge: ${label}"; failed=1; }
          done
          if [ -z "$EDGEONE_SITE_URL" ]; then echo "edgeone=skipped" >> "$GITHUB_OUTPUT"; fi
          [ "$failed" -eq 0 ]

      - name: Enforce final production smoke gates
        if: always()
        env:
          CLOUDFLARE_API: ${{ steps.cloudflare-api.outcome }}
          CLOUDFLARE_SHA: ${{ steps.cloudflare-sha.outcome }}
          CLOUDFLARE_REGISTRY: ${{ steps.cloudflare-registry.outcome }}
          PAGES_SHA: ${{ steps.pages-sha.outcome }}
          PAGES_REGISTRY: ${{ steps.pages-registry.outcome }}
          EDGEONE_SHA: ${{ steps.edgeone-sha.outcome }}
          EDGEONE_REGISTRY: ${{ steps.edgeone-registry.outcome }}
          EDGEONE_REQUIRED: ${{ env.EDGEONE_STABLE_CONFIGURED }}
          PROVIDERS_CLOUDFLARE: ${{ steps.providers.outputs.cloudflare }}
          PROVIDERS_PAGES: ${{ steps.providers.outputs.github_pages }}
          PROVIDERS_EDGEONE: ${{ steps.providers.outputs.edgeone }}
        run: |
          set -euo pipefail
          EXPECTED_REGISTRY_REVISION=$(node -p "require('./catalog/registry-v4.json').revision")
          failed=0
          for item in "Cloudflare API V2:$CLOUDFLARE_API" "Cloudflare SHA:$CLOUDFLARE_SHA" "Cloudflare Registry V4:$CLOUDFLARE_REGISTRY" "GitHub Pages SHA:$PAGES_SHA" "GitHub Pages Registry V4:$PAGES_REGISTRY" "Provider Cloudflare:$PROVIDERS_CLOUDFLARE" "Provider GitHub Pages:$PROVIDERS_PAGES"; do
            label=${item%%:*}; outcome=${item#*:}; [ "$outcome" = success ] || { echo "::error::Final smoke gate failed: ${label}=${outcome}"; failed=1; }
          done
          if [ "$EDGEONE_REQUIRED" = true ]; then
            for item in "EdgeOne SHA:$EDGEONE_SHA" "EdgeOne Registry V4:$EDGEONE_REGISTRY" "Provider EdgeOne:$PROVIDERS_EDGEONE"; do
              label=${item%%:*}; outcome=${item#*:}; [ "$outcome" = success ] || { echo "::error::Final smoke gate failed: ${label}=${outcome}"; failed=1; }
            done
          fi
          [ "$failed" -eq 0 ]
          echo "All required production targets converged to SHA ${DEPLOYMENT_SHA} / Registry V4 ${EXPECTED_REGISTRY_REVISION}"

      - name: Final smoke summary
        if: always()
        run: |
          REGISTRY_REVISION=$(node -p "require('./catalog/registry-v4.json').revision")
          echo "### Final production smoke · V4" >> "$GITHUB_STEP_SUMMARY"
          echo "- release SHA: ${DEPLOYMENT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registry V4 revision: ${REGISTRY_REVISION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- cross-platform identity: ${DEPLOYMENT_SHA} / ${REGISTRY_REVISION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare API/SHA/Registry: ${{ steps.cloudflare-api.outcome || 'skipped' }} / ${{ steps.cloudflare-sha.outcome || 'skipped' }} / ${{ steps.cloudflare-registry.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub Pages SHA/Registry: ${{ steps.pages-sha.outcome || 'skipped' }} / ${{ steps.pages-registry.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- EdgeOne target: ${EDGEONE_SITE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- EdgeOne SHA/Registry: ${{ steps.edgeone-sha.outcome || 'skipped' }} / ${{ steps.edgeone-registry.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
