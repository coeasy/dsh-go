name: Monitor

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main registry
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Require SITE_URL
        run: |
          [ -n "$SITE_URL" ] || { echo "SITE_URL repository variable is missing"; exit 1; }
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Check site and API
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          curl -fsS --max-time 20 "${SITE_URL}/" >/dev/null
          curl -fsS --max-time 20 "${SITE_URL}/api/v1/health" >/dev/null
          curl -fsS --max-time 20 "${SITE_URL}/api/v1/registry" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d);if(r.registry_version!==3||!r.generated?.content_hash||!r.plugins?.length)process.exit(1)})"
      - name: Check data freshness and deployed registry convergence
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          MAIN_HASH=$(node -p "require('./catalog/registry-v3.json').generated.content_hash")
          MAIN_COUNT=$(node -p "require('./catalog/registry-v3.json').plugins.length")
          UPDATED=""
          for attempt in 1 2 3 4 5 6 7 8 9; do
            META=$(curl -fsS --max-time 20 "${SITE_URL}/api/v1/meta")
            UPDATED=$(printf '%s' "$META" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).last_sync.at))")
            META_HASH=$(printf '%s' "$META" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).registry.content_hash))")
            REGISTRY=$(curl -fsS --max-time 20 "${SITE_URL}/catalog/registry-v3.json")
            REG_HASH=$(printf '%s' "$REGISTRY" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).generated.content_hash))")
            REG_COUNT=$(printf '%s' "$REGISTRY" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).plugins.length))")
            API_HASH=$(curl -fsS --max-time 20 "${SITE_URL}/api/v1/registry" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).generated.content_hash))")
            if [ "$META_HASH" = "$MAIN_HASH" ] && [ "$REG_HASH" = "$MAIN_HASH" ] && [ "$API_HASH" = "$MAIN_HASH" ] && [ "$REG_COUNT" = "$MAIN_COUNT" ]; then
              AGE_H=$(( ( $(date +%s) - $(date -d "$UPDATED" +%s) ) / 3600 ))
              [ "$AGE_H" -lt 36 ] || { echo "Data is stale: ${AGE_H}h"; exit 1; }
              echo "Registry converged with main, data age=${AGE_H}h, count=${REG_COUNT}, hash=${MAIN_HASH}"
              exit 0
            fi
            echo "Registry not converged (attempt ${attempt}/9): main=${MAIN_HASH}/${MAIN_COUNT}, meta=${META_HASH}, catalog=${REG_HASH}/${REG_COUNT}, api=${API_HASH}"
            sleep 10
          done
          echo "Deployed Registry V3 did not converge to main within the monitor retry window"
          exit 1
      - name: Check GitHub Pages registry convergence
        env:
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          MAIN_HASH=$(node -p "require('./catalog/registry-v3.json').generated.content_hash")
          MAIN_COUNT=$(node -p "require('./catalog/registry-v3.json').plugins.length")
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "${GITHUB_PAGES_URL}/catalog/registry-v3.json" -o /tmp/github-pages-registry.json; then
              if MAIN_HASH="$MAIN_HASH" MAIN_COUNT="$MAIN_COUNT" node -e "const r=require('/tmp/github-pages-registry.json'); if(r.generated?.content_hash!==process.env.MAIN_HASH || String(r.plugins?.length)!==process.env.MAIN_COUNT) process.exit(1)"; then
                echo "GitHub Pages converged with main"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "GitHub Pages Registry V3 did not converge to main"
          exit 1
      - name: Check optional EdgeOne registry convergence
        env:
          EDGEONE_SITE_URL: ${{ vars.EDGEONE_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$EDGEONE_SITE_URL" ]; then
            echo "EDGEONE_SITE_URL is not configured; skipping scheduled EdgeOne health check"
            exit 0
          fi
          MAIN_HASH=$(node -p "require('./catalog/registry-v3.json').generated.content_hash")
          MAIN_COUNT=$(node -p "require('./catalog/registry-v3.json').plugins.length")
          BASE_URL="${EDGEONE_SITE_URL%/}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "${BASE_URL}/catalog/registry-v3.json" -o /tmp/edgeone-registry.json; then
              if MAIN_HASH="$MAIN_HASH" MAIN_COUNT="$MAIN_COUNT" node -e "const r=require('/tmp/edgeone-registry.json'); if(r.generated?.content_hash!==process.env.MAIN_HASH || String(r.plugins?.length)!==process.env.MAIN_COUNT) process.exit(1)"; then
                echo "EdgeOne converged with main"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "EdgeOne Registry V3 did not converge to main"
          exit 1
