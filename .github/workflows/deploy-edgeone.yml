name: Deploy Tencent EdgeOne

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact commit SHA to deploy"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: edgeone-deploy
  cancel-in-progress: true

env:
  EDGEONE_PROJECT: ${{ vars.EDGEONE_PROJECT || 'dsh-go' }}
  EDGEONE_CLI_VERSION: ${{ vars.EDGEONE_CLI_VERSION || '1.6.28' }}
  EDGEONE_DEPLOY_RETRIES: ${{ vars.EDGEONE_DEPLOY_RETRIES || '3' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact deployment revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 1
      - name: Verify deployment revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ inputs.commit_sha || github.sha }}"
          ACTUAL=$(git rev-parse HEAD)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "Deployment revision mismatch: expected=$EXPECTED actual=$ACTUAL"; exit 1; }
      - name: Check canonical Registry V3
        id: registry
        shell: bash
        run: |
          if [ -f catalog/registry-v3.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Registry V3 is not committed yet; EdgeOne deployment is a successful no-op"
          fi
      - name: Detect EdgeOne configuration
        id: edgeone-config
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          if [ -n "$EDGEONE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EDGEONE_API_TOKEN is not configured; EdgeOne deployment will be skipped. Create it at https://console.cloud.tencent.com/edgeone/pages?tab=api"
          fi
      - name: Setup Node.js
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.configured == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install dependencies
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.configured == 'true' }}
        run: |
          npm ci
          cd site && npm ci
      - name: Deploy Gate V3 and tests
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.configured == 'true' }}
        run: |
          npm run deploy:gate
          npm run typecheck
          npm test
      - name: Copy catalog into site
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.configured == 'true' }}
        run: npm run copy-assets
      - name: Build static EdgeOne site
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.configured == 'true' }}
        run: cd site && npm run build
        env:
          PUBLIC_SITE_URL: https://${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}.pages.dev
          PUBLIC_API_URL: https://${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}.pages.dev
      - name: Verify build output
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.configured == 'true' }}
        run: |
          test -f site/dist/index.html
          test -f site/dist/catalog/plugins.json
          test -f site/dist/catalog/registry-v3.json
          test -f site/dist/catalog/schema-v3.json
          node -e "const r=require('./site/dist/catalog/registry-v3.json'); if(r.registry_version!==3 || !r.generated?.content_hash || !r.plugins.length) process.exit(1)"
      - name: Verify EdgeOne CLI namespace
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.configured == 'true' }}
        run: npx --yes "edgeone@${EDGEONE_CLI_VERSION}" makers deploy --help >/dev/null
      - name: Deploy to Tencent EdgeOne Makers
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.configured == 'true' }}
        id: edgeone
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_SITE_URL: ${{ vars.EDGEONE_SITE_URL }}
        run: |
          set -euo pipefail
          case "$EDGEONE_DEPLOY_RETRIES" in
            ''|*[!0-9]*) echo "Invalid EDGEONE_DEPLOY_RETRIES: $EDGEONE_DEPLOY_RETRIES"; exit 1 ;;
          esac
          [ "$EDGEONE_DEPLOY_RETRIES" -ge 1 ] || { echo "EDGEONE_DEPLOY_RETRIES must be >= 1"; exit 1; }

          DEPLOY_JSON=""
          LAST_ERROR=""
          for attempt in $(seq 1 "$EDGEONE_DEPLOY_RETRIES"); do
            echo "EdgeOne deployment attempt ${attempt}/${EDGEONE_DEPLOY_RETRIES}"
            set +e
            OUTPUT=$(npx --yes "edgeone@${EDGEONE_CLI_VERSION}" makers deploy ./site/dist \
              -n "$EDGEONE_PROJECT" \
              -t "$EDGEONE_API_TOKEN" \
              -e production \
              --json 2>&1)
            STATUS=$?
            set -e

            LAST_JSON=$(printf '%s\n' "$OUTPUT" | awk '/^\{.*\}$/{line=$0} END{print line}')
            if [ "$STATUS" -eq 0 ] && [ -n "$LAST_JSON" ]; then
              if DEPLOY_JSON="$LAST_JSON" node -e "const r=JSON.parse(process.env.DEPLOY_JSON); if(r.status!=='success' || !r.url || !r.projectId) process.exit(1)"; then
                DEPLOY_JSON="$LAST_JSON"
                break
              fi
            fi

            if [ -n "$LAST_JSON" ]; then
              LAST_ERROR=$(DEPLOY_JSON="$LAST_JSON" node -e "try{const r=JSON.parse(process.env.DEPLOY_JSON);process.stdout.write(String(r.error||r.message||'unknown EdgeOne error'))}catch{process.stdout.write('invalid EdgeOne JSON response')}" || true)
            else
              SAFE_OUTPUT=${OUTPUT//"$EDGEONE_API_TOKEN"/***}
              LAST_ERROR=$(printf '%s\n' "$SAFE_OUTPUT" | tail -n 20)
            fi
            echo "::warning::EdgeOne deployment attempt ${attempt} failed: ${LAST_ERROR}"

            if [ "$attempt" -lt "$EDGEONE_DEPLOY_RETRIES" ] && printf '%s\n' "$OUTPUT" | grep -Eqi 'fetch failed|ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|socket hang up|network'; then
              WAIT=$((attempt * 10))
              echo "Transient EdgeOne network/API failure; retrying in ${WAIT}s"
              sleep "$WAIT"
              continue
            fi
            break
          done

          [ -n "$DEPLOY_JSON" ] || { echo "EdgeOne deployment failed after retry policy: ${LAST_ERROR}"; exit 1; }

          DEPLOY_URL=$(DEPLOY_JSON="$DEPLOY_JSON" node -e "const r=JSON.parse(process.env.DEPLOY_JSON);process.stdout.write(r.url)")
          PROJECT_ID=$(DEPLOY_JSON="$DEPLOY_JSON" node -e "const r=JSON.parse(process.env.DEPLOY_JSON);process.stdout.write(r.projectId)")
          CONSOLE_URL=$(DEPLOY_JSON="$DEPLOY_JSON" node -e "const r=JSON.parse(process.env.DEPLOY_JSON);process.stdout.write(r.consoleUrl||'')")
          HEALTH_URL="${EDGEONE_SITE_URL:-$DEPLOY_URL}"

          echo "::add-mask::$DEPLOY_URL"
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "console_url=$CONSOLE_URL" >> "$GITHUB_OUTPUT"
          echo "health_url=$HEALTH_URL" >> "$GITHUB_OUTPUT"
          echo "EdgeOne deployment accepted: project=${PROJECT_ID}"
      - name: Post-deploy Registry V3 convergence check
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.configured == 'true' && steps.edgeone.outputs.health_url != '' }}
        shell: bash
        env:
          EDGEONE_SITE_URL: ${{ steps.edgeone.outputs.health_url }}
        run: |
          set -euo pipefail
          EXPECTED_HASH=$(node -p "require('./catalog/registry-v3.json').generated.content_hash")
          EXPECTED_COUNT=$(node -p "require('./catalog/registry-v3.json').plugins.length")
          REGISTRY_URL=$(node -e "const u=new URL(process.env.EDGEONE_SITE_URL);u.pathname='/catalog/registry-v3.json';process.stdout.write(u.toString())")
          for attempt in 1 2 3 4 5 6 7 8 9; do
            if curl -fsS --max-time 20 "$REGISTRY_URL" -o /tmp/registry-v3.json; then
              if EXPECTED_HASH="$EXPECTED_HASH" EXPECTED_COUNT="$EXPECTED_COUNT" node -e "const r=require('/tmp/registry-v3.json'); if(r.generated?.content_hash!==process.env.EXPECTED_HASH || String(r.plugins?.length)!==process.env.EXPECTED_COUNT) process.exit(1)"; then
                echo "EdgeOne Registry V3 converged: hash=${EXPECTED_HASH}, count=${EXPECTED_COUNT}"
                exit 0
              fi
            fi
            echo "Waiting for EdgeOne production convergence (${attempt}/9)"
            sleep 10
          done
          echo "EdgeOne production did not converge to the exact Registry V3 revision"
          exit 1
      - name: EdgeOne summary
        if: always()
        run: |
          echo "### Tencent EdgeOne Makers" >> "$GITHUB_STEP_SUMMARY"
          echo "- revision: ${{ inputs.commit_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- configured: ${{ steps.edgeone-config.outputs.configured || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- project: ${EDGEONE_PROJECT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CLI: edgeone@${EDGEONE_CLI_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- retry limit: ${EDGEONE_DEPLOY_RETRIES}" >> "$GITHUB_STEP_SUMMARY"
          echo "- project id: ${{ steps.edgeone.outputs.project_id || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- console URL: ${{ steps.edgeone.outputs.console_url || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ vars.EDGEONE_SITE_URL }}" ]; then
            echo "- stable site URL: ${{ vars.EDGEONE_SITE_URL }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- deployment URL: generated by EdgeOne and masked in Actions logs" >> "$GITHUB_STEP_SUMMARY"
          fi
