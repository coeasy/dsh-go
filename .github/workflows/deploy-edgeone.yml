name: Deploy Tencent EdgeOne

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact commit SHA to deploy"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: edgeone-production
  cancel-in-progress: true

env:
  DEPLOYMENT_SHA: ${{ inputs.commit_sha || github.sha }}
  EDGEONE_PROJECT: dsh-go
  EDGEONE_EXPECTED_PROJECT: dsh-go
  EDGEONE_CLI_VERSION: ${{ vars.EDGEONE_CLI_VERSION || '1.6.28' }}
  EDGEONE_DEPLOY_RETRIES: ${{ vars.EDGEONE_DEPLOY_RETRIES || '3' }}
  EDGEONE_ATTEMPT_TIMEOUT_SECONDS: ${{ vars.EDGEONE_ATTEMPT_TIMEOUT_SECONDS || '240' }}
  PAGES_SOURCE: skills

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact deployment revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}
          fetch-depth: 1

      - name: Verify deployment revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${DEPLOYMENT_SHA}"
          ACTUAL=$(git rev-parse HEAD)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "Deployment revision mismatch: expected=$EXPECTED actual=$ACTUAL"; exit 1; }

      - name: Check canonical Registry V3
        id: registry
        shell: bash
        run: |
          if [ -f catalog/registry-v3.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Registry V3 is not committed yet; EdgeOne deployment is a successful no-op"
          fi

      - name: Detect EdgeOne configuration
        id: edgeone-config
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_SITE_URL: ${{ vars.EDGEONE_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -n "$EDGEONE_API_TOKEN" ]; then
            echo "::add-mask::$EDGEONE_API_TOKEN"
            echo "token_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "token_configured=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$EDGEONE_SITE_URL" ]; then
            echo "site_url_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_url_configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require EdgeOne API token
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured != 'true' }}
        run: |
          echo "::error::EDGEONE_API_TOKEN secret is required for production deployment"
          exit 1

      - name: Setup Node.js
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install dependencies
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        run: |
          npm ci
          cd site && npm ci

      - name: Deploy Gate V3 and tests
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        run: |
          npm run deploy:gate
          npm run typecheck
          npm test

      - name: Copy catalog into site
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        run: npm run copy-assets

      - name: Build static EdgeOne site
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        run: |
          cd site
          npm run build
          cp package.json dist/package.json
        env:
          PUBLIC_SITE_URL: ${{ vars.EDGEONE_SITE_URL }}
          PUBLIC_API_URL: ${{ vars.EDGEONE_SITE_URL }}

      - name: Checkout current deployment control plane
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci-control
          fetch-depth: 1
          persist-credentials: false

      - name: Verify deployment control revision
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          CONTROL=$(git -C .ci-control rev-parse HEAD)
          [ "$CONTROL" = "${GITHUB_SHA}" ] || { echo "Deployment control revision mismatch: expected=${GITHUB_SHA} actual=${CONTROL}"; exit 1; }

      - name: Stamp exact deployment SHA
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        run: node .ci-control/scripts/write-deployment-version.mjs site/dist/version.json

      - name: Verify build output
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        run: |
          set -euo pipefail
          test -f site/dist/index.html
          test -f site/dist/package.json
          test -f site/dist/version.json
          test -f site/dist/catalog/plugins.json
          test -f site/dist/catalog/registry-v3.json
          test -f site/dist/catalog/schema-v3.json
          test -f site/dist/catalog/provider-adapters.json
          node -e "const fs=require('node:fs'); const v=JSON.parse(fs.readFileSync('site/dist/version.json','utf8')); if(v.git_sha !== process.env.DEPLOYMENT_SHA) process.exit(1)"
          node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync('site/dist/catalog/registry-v3.json','utf8')); if(r.registry_version!==3 || !r.generated?.content_hash || !r.plugins.length) process.exit(1)"
          node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync('site/dist/catalog/provider-adapters.json','utf8')); if(r.registry_version!==1 || !r.generated?.content_hash || !Array.isArray(r.providers) || r.generated.count!==r.providers.length) process.exit(1)"

      - name: Verify EdgeOne CLI contract
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        run: node .ci-control/scripts/edgeone-deploy-ci.mjs --check

      - name: Deploy to Tencent EdgeOne Makers
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        id: edgeone
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_SITE_URL: ${{ vars.EDGEONE_SITE_URL }}
          EDGEONE_DIAGNOSTIC_FILE: ${{ runner.temp }}/edgeone-deploy-diagnostic.json
        run: node .ci-control/scripts/edgeone-deploy-ci.mjs

      - name: Upload sanitized EdgeOne deploy diagnostic
        if: ${{ failure() && steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: edgeone-deploy-diagnostic
          path: ${{ runner.temp }}/edgeone-deploy-diagnostic.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify deployment URL SHA
        id: deploy-url-sha
        continue-on-error: true
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' && steps.edgeone.outputs.deploy_url != '' }}
        env:
          DEPLOY_BASE_URL: ${{ steps.edgeone.outputs.deploy_url }}
          EXPECTED_DEPLOYMENT_SHA: ${{ env.DEPLOYMENT_SHA }}
          DEPLOY_LABEL: Tencent EdgeOne deployment URL
          DEPLOY_SHA_ATTEMPTS: "6"
          DEPLOY_SHA_DELAY_MS: "5000"
        run: node .ci-control/scripts/check-production-sha.mjs

      - name: Production target SHA Verify
        id: production-sha
        continue-on-error: true
        if: ${{ always() && steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' && steps.edgeone.outcome == 'success' && steps.edgeone.outputs.health_url != '' }}
        env:
          DEPLOY_BASE_URL: ${{ steps.edgeone.outputs.health_url }}
          EXPECTED_DEPLOYMENT_SHA: ${{ env.DEPLOYMENT_SHA }}
          DEPLOY_LABEL: Tencent EdgeOne production target
          DEPLOY_SHA_ATTEMPTS: "12"
          DEPLOY_SHA_DELAY_MS: "10000"
        run: node .ci-control/scripts/check-production-sha.mjs

      - name: Production Registry V3 convergence gate
        id: production-convergence
        continue-on-error: true
        if: ${{ always() && steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' && steps.edgeone.outcome == 'success' && steps.edgeone.outputs.health_url != '' }}
        env:
          DEPLOY_BASE_URL: ${{ steps.edgeone.outputs.health_url }}
          DEPLOY_LABEL: Tencent EdgeOne production target
          DEPLOY_CONVERGENCE_ATTEMPTS: "12"
          DEPLOY_CONVERGENCE_DELAY_MS: "10000"
        run: node .ci-control/scripts/check-deployment-convergence.mjs

      - name: Capture post-deploy diagnostics
        if: ${{ always() && steps.edgeone.outcome == 'success' && (steps.deploy-url-sha.outcome == 'failure' || steps.production-sha.outcome == 'failure' || steps.production-convergence.outcome == 'failure') }}
        env:
          DEPLOY_URL_SHA_OUTCOME: ${{ steps.deploy-url-sha.outcome }}
          DEPLOY_URL_SHA_PROBLEM: ${{ steps.deploy-url-sha.outputs.problem }}
          PRODUCTION_SHA_OUTCOME: ${{ steps.production-sha.outcome }}
          PRODUCTION_SHA_PROBLEM: ${{ steps.production-sha.outputs.problem }}
          PRODUCTION_CONVERGENCE_OUTCOME: ${{ steps.production-convergence.outcome }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const diagnostic = {
            deployment_sha: process.env.DEPLOYMENT_SHA,
            deployment_url_sha: {
              outcome: process.env.DEPLOY_URL_SHA_OUTCOME || 'skipped',
              problem: process.env.DEPLOY_URL_SHA_PROBLEM || '',
            },
            production_sha: {
              outcome: process.env.PRODUCTION_SHA_OUTCOME || 'skipped',
              problem: process.env.PRODUCTION_SHA_PROBLEM || '',
            },
            production_convergence: {
              outcome: process.env.PRODUCTION_CONVERGENCE_OUTCOME || 'skipped',
            },
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/edgeone-post-deploy-diagnostic.json', JSON.stringify(diagnostic, null, 2) + '\n');
          NODE

      - name: Upload post-deploy diagnostics
        if: ${{ always() && steps.edgeone.outcome == 'success' && (steps.deploy-url-sha.outcome == 'failure' || steps.production-sha.outcome == 'failure' || steps.production-convergence.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: edgeone-post-deploy-diagnostic
          path: ${{ runner.temp }}/edgeone-post-deploy-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce production post-deploy gates
        if: ${{ always() && steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' && steps.edgeone.outcome == 'success' }}
        env:
          PRODUCTION_SHA_OUTCOME: ${{ steps.production-sha.outcome }}
          PRODUCTION_CONVERGENCE_OUTCOME: ${{ steps.production-convergence.outcome }}
        run: |
          set -euo pipefail
          if [ "$PRODUCTION_SHA_OUTCOME" != "success" ]; then
            echo "::error::Production SHA gate failed; see post-deploy diagnostic artifact"
            exit 1
          fi
          if [ "$PRODUCTION_CONVERGENCE_OUTCOME" != "success" ]; then
            echo "::error::Production Registry V3 convergence gate failed"
            exit 1
          fi

      - name: EdgeOne summary
        if: always()
        run: |
          echo "### Tencent EdgeOne Production Deploy Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- payload SHA: ${DEPLOYMENT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- control plane SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- token configured: ${{ steps.edgeone-config.outputs.token_configured || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- stable production URL configured: ${{ steps.edgeone-config.outputs.site_url_configured || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- production target fallback: CLI production deployment URL when EDGEONE_SITE_URL is unset" >> "$GITHUB_STEP_SUMMARY"
          echo "- project: ${EDGEONE_PROJECT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- expected project: ${EDGEONE_EXPECTED_PROJECT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CLI: edgeone@${EDGEONE_CLI_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- auth mode: direct named-project CI deploy (-n + -t)" >> "$GITHUB_STEP_SUMMARY"
          echo "- failure class: ${{ steps.edgeone.outputs.failure_class || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- project id: ${{ steps.edgeone.outputs.project_id || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- console URL: ${{ steps.edgeone.outputs.console_url || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- deployment URL SHA gate: ${{ steps.deploy-url-sha.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- deployment URL SHA detail: ${{ steps.deploy-url-sha.outputs.problem || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- production SHA gate: ${{ steps.production-sha.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- production SHA detail: ${{ steps.production-sha.outputs.problem || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- production convergence gate: ${{ steps.production-convergence.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- authoritative gate: production target SHA + Registry V3 convergence" >> "$GITHUB_STEP_SUMMARY"
