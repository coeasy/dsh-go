name: Deploy Tencent EdgeOne

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact commit SHA to deploy"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: edgeone-production
  cancel-in-progress: true

env:
  DEPLOYMENT_SHA: ${{ inputs.commit_sha || github.sha }}
  EDGEONE_PROJECT: ${{ vars.EDGEONE_PROJECT || 'dsh-go' }}
  EDGEONE_CLI_VERSION: ${{ vars.EDGEONE_CLI_VERSION || '1.6.28' }}
  EDGEONE_DEPLOY_RETRIES: ${{ vars.EDGEONE_DEPLOY_RETRIES || '3' }}
  EDGEONE_ATTEMPT_TIMEOUT_SECONDS: ${{ vars.EDGEONE_ATTEMPT_TIMEOUT_SECONDS || '240' }}
  PAGES_SOURCE: skills

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact deployment revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}
          fetch-depth: 1

      - name: Verify deployment revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${DEPLOYMENT_SHA}"
          ACTUAL=$(git rev-parse HEAD)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "Deployment revision mismatch: expected=$EXPECTED actual=$ACTUAL"; exit 1; }

      - name: Check canonical Registry V3
        id: registry
        shell: bash
        run: |
          if [ -f catalog/registry-v3.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Registry V3 is not committed yet; EdgeOne deployment is a successful no-op"
          fi

      - name: Detect EdgeOne configuration
        id: edgeone-config
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_SITE_URL: ${{ vars.EDGEONE_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -n "$EDGEONE_API_TOKEN" ]; then
            echo "::add-mask::$EDGEONE_API_TOKEN"
            echo "token_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "token_configured=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$EDGEONE_SITE_URL" ]; then
            echo "site_url_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_url_configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require EdgeOne API token
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured != 'true' }}
        run: |
          echo "::error::EDGEONE_API_TOKEN secret is required for production deployment"
          exit 1

      - name: Setup Node.js
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install dependencies
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        run: |
          npm ci
          cd site && npm ci

      - name: Deploy Gate V3 and tests
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        run: |
          npm run deploy:gate
          npm run typecheck
          npm test

      - name: Copy catalog into site
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        run: npm run copy-assets

      - name: Build static EdgeOne site
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        run: cd site && npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.EDGEONE_SITE_URL }}
          PUBLIC_API_URL: ${{ vars.EDGEONE_SITE_URL }}

      - name: Checkout current deployment control plane
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci-control
          fetch-depth: 1
          persist-credentials: false

      - name: Verify deployment control revision
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          CONTROL=$(git -C .ci-control rev-parse HEAD)
          [ "$CONTROL" = "${GITHUB_SHA}" ] || { echo "Deployment control revision mismatch: expected=${GITHUB_SHA} actual=${CONTROL}"; exit 1; }

      - name: Stamp exact deployment SHA
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        run: node .ci-control/scripts/write-deployment-version.mjs site/dist/version.json

      - name: Verify build output
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        run: |
          set -euo pipefail
          test -f site/dist/index.html
          test -f site/dist/version.json
          test -f site/dist/catalog/plugins.json
          test -f site/dist/catalog/registry-v3.json
          test -f site/dist/catalog/schema-v3.json
          node -e "const fs=require('node:fs'); const v=JSON.parse(fs.readFileSync('site/dist/version.json','utf8')); if(v.git_sha !== process.env.DEPLOYMENT_SHA) process.exit(1)"
          node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync('site/dist/catalog/registry-v3.json','utf8')); if(r.registry_version!==3 || !r.generated?.content_hash || !r.plugins.length) process.exit(1)"

      - name: Verify EdgeOne CLI contract
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        run: node .ci-control/scripts/edgeone-deploy-ci.mjs --check

      - name: Deploy to Tencent EdgeOne Makers
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' }}
        id: edgeone
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_SITE_URL: ${{ vars.EDGEONE_SITE_URL }}
        run: node .ci-control/scripts/edgeone-deploy-ci.mjs

      - name: Verify deployment URL SHA
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' && steps.edgeone.outputs.deploy_url != '' }}
        env:
          DEPLOY_BASE_URL: ${{ steps.edgeone.outputs.deploy_url }}
          EXPECTED_DEPLOYMENT_SHA: ${{ env.DEPLOYMENT_SHA }}
          DEPLOY_LABEL: Tencent EdgeOne deployment URL
          DEPLOY_SHA_ATTEMPTS: "6"
          DEPLOY_SHA_DELAY_MS: "5000"
        run: node .ci-control/scripts/check-production-sha.mjs

      - name: Production target SHA Verify
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' && steps.edgeone.outputs.health_url != '' }}
        env:
          DEPLOY_BASE_URL: ${{ steps.edgeone.outputs.health_url }}
          EXPECTED_DEPLOYMENT_SHA: ${{ env.DEPLOYMENT_SHA }}
          DEPLOY_LABEL: Tencent EdgeOne production target
          DEPLOY_SHA_ATTEMPTS: "12"
          DEPLOY_SHA_DELAY_MS: "10000"
        run: node .ci-control/scripts/check-production-sha.mjs

      - name: Production Registry V3 convergence gate
        if: ${{ steps.registry.outputs.ready == 'true' && steps.edgeone-config.outputs.token_configured == 'true' && steps.edgeone.outputs.health_url != '' }}
        env:
          DEPLOY_BASE_URL: ${{ steps.edgeone.outputs.health_url }}
          DEPLOY_LABEL: Tencent EdgeOne production target
          DEPLOY_CONVERGENCE_ATTEMPTS: "12"
          DEPLOY_CONVERGENCE_DELAY_MS: "10000"
        run: node .ci-control/scripts/check-deployment-convergence.mjs

      - name: EdgeOne summary
        if: always()
        run: |
          echo "### Tencent EdgeOne Production Deploy Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- payload SHA: ${DEPLOYMENT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- control plane SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- token configured: ${{ steps.edgeone-config.outputs.token_configured || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- stable production URL configured: ${{ steps.edgeone-config.outputs.site_url_configured || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- production target fallback: CLI production deployment URL when EDGEONE_SITE_URL is unset" >> "$GITHUB_STEP_SUMMARY"
          echo "- project: ${EDGEONE_PROJECT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CLI: edgeone@${EDGEONE_CLI_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- auth mode: explicit project link + per-invocation token (-t)" >> "$GITHUB_STEP_SUMMARY"
          echo "- failure class: ${{ steps.edgeone.outputs.failure_class || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- project id: ${{ steps.edgeone.outputs.project_id || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- console URL: ${{ steps.edgeone.outputs.console_url || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- gate: deployment URL SHA -> production target SHA -> Registry V3 convergence" >> "$GITHUB_STEP_SUMMARY"
