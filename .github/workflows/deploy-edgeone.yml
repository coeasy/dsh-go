name: Deploy Tencent EdgeOne

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact commit SHA to deploy"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: edgeone-production
  cancel-in-progress: true

env:
  DEPLOYMENT_SHA: ${{ inputs.commit_sha || github.sha }}
  EDGEONE_PROJECT: dsh-go
  EDGEONE_EXPECTED_PROJECT: dsh-go
  EDGEONE_SITE_URL: ${{ vars.EDGEONE_SITE_URL || '' }}
  EDGEONE_CLI_VERSION: ${{ vars.EDGEONE_CLI_VERSION || '1.6.28' }}
  EDGEONE_DEPLOY_RETRIES: ${{ vars.EDGEONE_DEPLOY_RETRIES || '3' }}
  EDGEONE_ATTEMPT_TIMEOUT_SECONDS: ${{ vars.EDGEONE_ATTEMPT_TIMEOUT_SECONDS || '240' }}
  PAGES_SOURCE: skills

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact deployment revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}
          fetch-depth: 1

      - name: Verify deployment revision and Registry V4 authority
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          [ "$ACTUAL" = "$DEPLOYMENT_SHA" ] || { echo "Deployment revision mismatch: expected=$DEPLOYMENT_SHA actual=$ACTUAL"; exit 1; }
          test -s catalog/registry-v4.json
          node scripts/validate-registry-v4.mjs catalog/registry-v4.json
          test ! -e functions/api/v1

      - name: Detect EdgeOne configuration
        id: edgeone-config
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$EDGEONE_API_TOKEN" ]; then
            echo "::add-mask::$EDGEONE_API_TOKEN"
            echo "token_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "token_configured=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$EDGEONE_SITE_URL" ]; then echo "site_url_configured=true" >> "$GITHUB_OUTPUT"; else echo "site_url_configured=false" >> "$GITHUB_OUTPUT"; fi

      - name: Require EdgeOne API token
        if: ${{ steps.edgeone-config.outputs.token_configured != 'true' }}
        run: |
          echo "::error::EDGEONE_API_TOKEN secret is required for production deployment"
          exit 1

      - name: Checkout current deployment control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci-control
          fetch-depth: 1
          persist-credentials: false

      - name: Verify deployment control revision
        shell: bash
        run: |
          set -euo pipefail
          CONTROL=$(git -C .ci-control rev-parse HEAD)
          [ "$CONTROL" = "${GITHUB_SHA}" ] || { echo "Deployment control revision mismatch: expected=${GITHUB_SHA} actual=${CONTROL}"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Pin npm for EdgeOne CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund npm@11.9.0
          test "$(npm --version)" = "11.9.0"

      - name: Install dependencies
        run: |
          npm ci
          cd site && npm ci

      - name: Canonical pre-deploy validation
        run: |
          npm run contract:check
          npm run architecture:check
          npm run typecheck
          npm test

      - name: Prepare deployment identity
        run: node .ci-control/scripts/write-deployment-version.mjs site/public/version.json

      - name: Build static EdgeOne site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_SITE_URL: ${{ env.EDGEONE_SITE_URL }}
          PUBLIC_API_URL: https://${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}.pages.dev
        run: |
          cd site
          npm run build
          cp package.json dist/package.json

      - name: Deployment Gate V4
        run: |
          set -euo pipefail
          npm run deploy:gate
          test -f site/dist/index.html
          test -f site/dist/publishers/index.html
          test -f site/dist/package.json
          test -f site/dist/version.json
          test -f site/dist/edgeone.json
          node scripts/check-platform-discovery.mjs --file site/dist/.well-known/dsh-marketplace.json
          test -f site/dist/catalog/registry-v4.json
          test -f site/dist/catalog/registry-v4/index.json
          test -f site/dist/catalog/search-index-v3.json
          test ! -e site/dist/catalog/registry-v3.json
          test ! -e site/dist/catalog/search-index-v2.json
          test ! -e site/dist/catalog/plugins.json
          test ! -e site/dist/catalog/registry-candidates-v1.json
          node -e "const fs=require('node:fs');const v=JSON.parse(fs.readFileSync('site/dist/version.json','utf8'));if(v.git_sha!==process.env.DEPLOYMENT_SHA)process.exit(1)"

      - name: Validate EdgeOne static file limits
        shell: bash
        run: |
          set -euo pipefail
          static_file_count=$(find site/dist -type f | wc -l | tr -d ' ')
          [ "$static_file_count" -le 19000 ] || { echo "::error::EdgeOne artifact contains $static_file_count files; budget=19000"; exit 1; }
          oversized=$(find site/dist -type f -size +26214400c -print)
          [ -z "$oversized" ] || { echo "::error::EdgeOne artifact contains files larger than 25 MiB:"; printf '%s\n' "$oversized"; exit 1; }
          echo "EdgeOne static file count: $static_file_count/19000"

      - name: Verify EdgeOne CLI contract
        run: node .ci-control/scripts/edgeone-deploy-ci.mjs --check

      - name: Deploy to Tencent EdgeOne Makers
        id: edgeone
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_UPLOAD_MODE: auto
          EDGEONE_UPLOAD_CWD: ./site
          EDGEONE_DIAGNOSTIC_FILE: ${{ runner.temp }}/edgeone-deploy-diagnostic.json
        run: node .ci-control/scripts/edgeone-deploy-ci.mjs

      - name: Upload sanitized EdgeOne deploy diagnostic
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: edgeone-deploy-diagnostic
          path: ${{ runner.temp }}/edgeone-deploy-diagnostic.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify deployment URL SHA
        id: deploy-url-sha
        continue-on-error: true
        if: ${{ steps.edgeone.outputs.deploy_url != '' }}
        env:
          DEPLOY_BASE_URL: ${{ steps.edgeone.outputs.deploy_url }}
          EXPECTED_DEPLOYMENT_SHA: ${{ env.DEPLOYMENT_SHA }}
          DEPLOY_LABEL: Tencent EdgeOne deployment URL
          DEPLOY_SHA_ATTEMPTS: "12"
          DEPLOY_SHA_DELAY_MS: "5000"
          DEPLOY_SHA_DIAGNOSTIC_FILE: ${{ runner.temp }}/edgeone-deploy-url-sha-diagnostic.json
        run: node .ci-control/scripts/check-production-sha.mjs

      - name: Production target SHA verify
        id: production-sha
        continue-on-error: true
        if: ${{ always() && steps.edgeone.outcome == 'success' }}
        env:
          DEPLOY_BASE_URL: ${{ vars.EDGEONE_SITE_URL || steps.edgeone.outputs.deploy_url }}
          EXPECTED_DEPLOYMENT_SHA: ${{ env.DEPLOYMENT_SHA }}
          DEPLOY_LABEL: Tencent EdgeOne production target
          DEPLOY_SHA_ATTEMPTS: "18"
          DEPLOY_SHA_DELAY_MS: "10000"
          DEPLOY_SHA_DIAGNOSTIC_FILE: ${{ runner.temp }}/edgeone-production-sha-diagnostic.json
        run: node .ci-control/scripts/check-production-sha.mjs

      - name: Production Registry V4 convergence gate
        id: production-convergence
        continue-on-error: true
        if: ${{ always() && steps.edgeone.outcome == 'success' }}
        env:
          DEPLOY_BASE_URL: ${{ vars.EDGEONE_SITE_URL || steps.edgeone.outputs.deploy_url }}
          DEPLOY_LABEL: Tencent EdgeOne production target
          DEPLOY_CONVERGENCE_ATTEMPTS: "18"
          DEPLOY_CONVERGENCE_DELAY_MS: "10000"
        run: node .ci-control/scripts/check-deployment-convergence.mjs

      - name: Enforce production post-deploy gates
        if: ${{ always() && steps.edgeone.outcome == 'success' }}
        env:
          DEPLOY_URL_SHA_OUTCOME: ${{ steps.deploy-url-sha.outcome }}
          PRODUCTION_SHA_OUTCOME: ${{ steps.production-sha.outcome }}
          PRODUCTION_CONVERGENCE_OUTCOME: ${{ steps.production-convergence.outcome }}
        run: |
          set -euo pipefail
          [ "$DEPLOY_URL_SHA_OUTCOME" = "success" ] || { echo "::error::Deployment URL SHA gate failed"; exit 1; }
          [ "$PRODUCTION_SHA_OUTCOME" = "success" ] || { echo "::error::Production SHA gate failed"; exit 1; }
          [ "$PRODUCTION_CONVERGENCE_OUTCOME" = "success" ] || { echo "::error::Production Registry V4 convergence gate failed"; exit 1; }

      - name: EdgeOne summary
        if: always()
        run: |
          echo "### Tencent EdgeOne · V4" >> "$GITHUB_STEP_SUMMARY"
          echo "- payload SHA: ${DEPLOYMENT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- control plane SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- production target: ${{ vars.EDGEONE_SITE_URL || 'CLI production URL' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- project: ${EDGEONE_PROJECT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CLI: edgeone@${EDGEONE_CLI_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- deployment URL SHA: ${{ steps.deploy-url-sha.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- production SHA: ${{ steps.production-sha.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registry V4 convergence: ${{ steps.production-convergence.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
