name: Phase E Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-e-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          cd site && npm ci

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Site check
        id: sitecheck
        continue-on-error: true
        run: cd site && npm run check

      - name: Site build
        id: sitebuild
        continue-on-error: true
        run: cd site && npm run build

      - name: Runtime syntax
        id: syntax
        continue-on-error: true
        run: |
          find runtime bin packages/dsh-go-marketplace-plugin -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Validation gate
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          SITECHECK: ${{ steps.sitecheck.outcome }}
          SITEBUILD: ${{ steps.sitebuild.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
        run: |
          printf 'typecheck=%s\nlint=%s\ntests=%s\nsitecheck=%s\nsitebuild=%s\nsyntax=%s\n' "$TYPECHECK" "$LINT" "$TESTS" "$SITECHECK" "$SITEBUILD" "$SYNTAX"
          test "$TYPECHECK" = success
          test "$LINT" = success
          test "$TESTS" = success
          test "$SITECHECK" = success
          test "$SITEBUILD" = success
          test "$SYNTAX" = success
