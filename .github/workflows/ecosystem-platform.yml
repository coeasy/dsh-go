name: Ecosystem Platform V1

on:
  pull_request:
    paths:
      - 'marketplace/**'
      - 'mcp/**'
      - 'skills/**'
      - 'agents/**'
      - 'profiles/**'
      - 'runtime/v3/**'
      - 'runtime/loader.mjs'
      - 'functions/**'
      - 'site/**'
      - 'docs/ECOSYSTEM_PLATFORM_V1.md'
      - 'tests/ecosystem-v1/**'
      - 'tests/runtime-v3/**'
      - 'tests/runtime-platform/activation.test.ts'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/ecosystem-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install site dependencies
        run: cd site && npm ci
      - name: Full source typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck > ecosystem-typecheck.log 2>&1
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-typecheck-${{ github.sha }}
          path: ecosystem-typecheck.log
          retention-days: 1
      - name: Typecheck gate
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - name: Full lint
        run: npm run lint
      - name: Ecosystem tests
        run: npm run ecosystem:test
      - name: Full regression tests
        run: npm test
      - name: Site check
        run: cd site && npm run check
      - name: Registry V3 compatibility
        run: npm run runtime:check
