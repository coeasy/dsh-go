name: Release DSH Go Marketplace MCP

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Package release channel
        required: true
        default: stable
        type: choice
        options: [stable, beta, nightly, dev]

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: write

concurrency:
  group: dsh-go-marketplace-package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/package-release.yml
    with:
      channel: ${{ inputs.channel }}
      package_path: packages/dsh-go-marketplace
      marketplace_repository: coeasy/dsh-go
    secrets: inherit
