name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact commit SHA to deploy"
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  DEPLOYMENT_SHA: ${{ inputs.commit_sha || github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact deployment revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}
          fetch-depth: 1

      - name: Verify deployment revision and Registry V4 authority
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${DEPLOYMENT_SHA}"
          ACTUAL=$(git rev-parse HEAD)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "Deployment revision mismatch: expected=$EXPECTED actual=$ACTUAL"; exit 1; }
          test -s catalog/registry-v4.json
          node scripts/validate-registry-v4.mjs catalog/registry-v4.json
          test ! -e functions/api/v1
          echo "Deploying exact Protocol V2 / Registry V4 revision $ACTUAL"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          cd site && npm ci

      - name: Canonical pre-deploy validation
        run: |
          npm run contract:check
          npm run architecture:check
          npm run typecheck
          npm run lint
          npm test

      - name: Prepare deployment identity
        run: node scripts/write-deployment-version.mjs site/public/version.json

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_SITE_URL: https://${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}.pages.dev
          PUBLIC_API_URL: https://${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}.pages.dev
        run: cd site && npm run build

      - name: Deployment Gate V4
        run: |
          npm run deploy:gate
          test -f site/dist/version.json
          node scripts/check-platform-discovery.mjs --file site/dist/.well-known/dsh-marketplace.json
          test -f site/dist/catalog/registry-v4.json
          test -f site/dist/catalog/registry-v4/index.json
          test -f site/dist/catalog/search-index-v3.json
          test ! -e site/dist/catalog/registry-v3.json
          test ! -e site/dist/catalog/search-index-v2.json
          test ! -e site/dist/catalog/plugins.json
          test ! -e site/dist/catalog/registry-candidates-v1.json
          node -e "const fs=require('node:fs');const v=JSON.parse(fs.readFileSync('site/dist/version.json','utf8'));if(v.git_sha!==process.env.DEPLOYMENT_SHA)process.exit(1)"

      - name: Validate Cloudflare Pages file limits
        shell: bash
        run: |
          set -euo pipefail
          static_file_count=$(find site/dist -type f | wc -l | tr -d ' ')
          if [ "$static_file_count" -gt 19000 ]; then
            echo "::error::Cloudflare Pages artifact contains $static_file_count files; budget=19000"
            exit 1
          fi
          oversized=$(find site/dist -type f -size +26214400c -print)
          if [ -n "$oversized" ]; then
            echo "::error::Cloudflare Pages artifact contains files larger than 25 MiB:"
            printf '%s\n' "$oversized"
            exit 1
          fi
          echo "Cloudflare Pages static file count: $static_file_count/19000"

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site/dist
            --project-name=${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}
            --branch=main
            --commit-hash=${{ env.DEPLOYMENT_SHA }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-deploy exact SHA check
        env:
          DEPLOY_BASE_URL: https://${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}.pages.dev
          EXPECTED_DEPLOYMENT_SHA: ${{ env.DEPLOYMENT_SHA }}
          DEPLOY_LABEL: Cloudflare Pages
          DEPLOY_SHA_ATTEMPTS: "12"
          DEPLOY_SHA_DELAY_MS: "10000"
        run: node scripts/check-production-sha.mjs

      - name: Post-deploy Registry V4 convergence check
        env:
          DEPLOY_BASE_URL: https://${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}.pages.dev
          DEPLOY_LABEL: Cloudflare Pages
          DEPLOY_CONVERGENCE_ATTEMPTS: "12"
          DEPLOY_CONVERGENCE_DELAY_MS: "10000"
        run: node scripts/check-deployment-convergence.mjs

      - name: Deployment summary
        if: always()
        run: |
          echo "### Cloudflare Pages · V4" >> "$GITHUB_STEP_SUMMARY"
          echo "- revision: ${DEPLOYMENT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- deployment URL: ${{ steps.cloudflare.outputs.deployment-url || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- authority: Package Protocol V2 + Registry V4" >> "$GITHUB_STEP_SUMMARY"
          echo "- gates: Architecture Conformance + Deployment Gate V4 + exact SHA + exact Registry V4 revision" >> "$GITHUB_STEP_SUMMARY"
