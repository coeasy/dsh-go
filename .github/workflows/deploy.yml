name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact commit SHA to deploy"
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact deployment revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 1
      - name: Verify deployment revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ inputs.commit_sha || github.sha }}"
          ACTUAL=$(git rev-parse HEAD)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "Deployment revision mismatch: expected=$EXPECTED actual=$ACTUAL"; exit 1; }
          echo "Deploying exact revision $ACTUAL"
      - name: Check canonical Registry V3
        id: registry
        shell: bash
        run: |
          if [ -f catalog/registry-v3.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Registry V3 is not committed yet; deployment is a successful no-op"
          fi
      - name: Setup Node.js
        if: ${{ steps.registry.outputs.ready == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install dependencies
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: |
          npm ci
          cd site && npm ci
      - name: Deploy Gate V3
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: npm run deploy:gate
      - name: Run checks
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: |
          npm run typecheck
          npm test
          npm run lint
      - name: Copy catalog into site
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: npm run copy-assets
      - name: Build site
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: cd site && npm run build
      - name: Verify build output
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: |
          test -f site/dist/index.html
          test -f site/dist/catalog/plugins.json
          test -f site/dist/catalog/catalog-v3/index.json
          test -f site/dist/catalog/registry-v3.json
          test -f site/dist/catalog/schema-v3.json
          test -f site/dist/catalog/provider-adapters.json
          node -e "const fs=require('node:fs'); const c=require('./site/dist/catalog/plugins.json'); const i=require('./site/dist/catalog/catalog-v3/index.json'); if(i.format!=='dsh-catalog-distribution'||i.distribution_version!==1||i.count!==c.meta.count||!Array.isArray(i.shards)||!i.shards.length) process.exit(1); if(fs.statSync('site/dist/catalog/plugins.json').size>25165824) process.exit(1)"
          node -e "const r=require('./site/dist/catalog/registry-v3.json'); if(r.registry_version!==3 || !r.generated?.content_hash || !r.plugins.length) process.exit(1)"
          node -e "const r=require('./site/dist/catalog/provider-adapters.json'); if(r.registry_version!==1 || !r.generated?.content_hash || !Array.isArray(r.providers) || r.generated.count!==r.providers.length) process.exit(1)"
      - name: Validate Cloudflare Pages file limits
        if: ${{ steps.registry.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          oversized=$(find site/dist -type f -size +26214400c -print)
          if [ -n "$oversized" ]; then
            echo "::error::Cloudflare Pages artifact contains files larger than 25 MiB:"
            printf '%s\n' "$oversized"
            exit 1
          fi
      - name: Deploy to Cloudflare Pages
        if: ${{ steps.registry.outputs.ready == 'true' }}
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site/dist
            --project-name=${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}
            --branch=main
            --commit-hash=${{ inputs.commit_sha || github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Post-deploy Registry V3 convergence check
        if: ${{ steps.registry.outputs.ready == 'true' }}
        env:
          DEPLOY_BASE_URL: https://${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}.pages.dev
          DEPLOY_LABEL: Cloudflare Pages
          DEPLOY_CONVERGENCE_ATTEMPTS: "9"
        run: node scripts/check-deployment-convergence.mjs
      - name: Deployment summary
        if: always()
        run: |
          echo "### Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- revision: ${{ inputs.commit_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- deployment URL: ${{ steps.cloudflare.outputs.deployment-url || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- catalog: compact compatibility export + bounded Catalog Distribution V1 shards" >> "$GITHUB_STEP_SUMMARY"
