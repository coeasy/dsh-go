name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact commit SHA to deploy"
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact deployment revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 1
      - name: Verify deployment revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ inputs.commit_sha || github.sha }}"
          ACTUAL=$(git rev-parse HEAD)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "Deployment revision mismatch: expected=$EXPECTED actual=$ACTUAL"; exit 1; }
          echo "Deploying exact revision $ACTUAL"
      - name: Check canonical Registry V3
        id: registry
        shell: bash
        run: |
          if [ -f catalog/registry-v3.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Registry V3 is not committed yet; deployment is a successful no-op"
          fi
      - name: Setup Node.js
        if: ${{ steps.registry.outputs.ready == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install dependencies
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: |
          npm ci
          cd site && npm ci
      - name: Deploy Gate V3
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: npm run deploy:gate
      - name: Run checks
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: |
          npm run typecheck
          npm test
          npm run lint
      - name: Copy catalog into site
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: npm run copy-assets
      - name: Build site
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: cd site && npm run build
      - name: Verify build output
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: |
          test -f site/dist/index.html
          test -f site/dist/catalog/plugins.json
          test -f site/dist/catalog/registry-v3.json
          test -f site/dist/catalog/schema-v3.json
          node -e "const r=require('./site/dist/catalog/registry-v3.json'); if(r.registry_version!==3 || !r.generated?.content_hash || !r.plugins.length) process.exit(1)"
      - name: Deploy to Cloudflare Pages
        if: ${{ steps.registry.outputs.ready == 'true' }}
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site/dist
            --project-name=${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}
            --branch=main
            --commit-hash=${{ inputs.commit_sha || github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Post-deploy Registry V3 convergence check
        if: ${{ steps.registry.outputs.ready == 'true' }}
        shell: bash
        env:
          SITE_URL: https://${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}.pages.dev
        run: |
          set -euo pipefail
          EXPECTED_HASH=$(node -p "require('./catalog/registry-v3.json').generated.content_hash")
          EXPECTED_COUNT=$(node -p "require('./catalog/registry-v3.json').plugins.length")
          for attempt in 1 2 3 4 5 6 7 8 9; do
            if curl -fsS --max-time 20 "${SITE_URL}/catalog/registry-v3.json" -o /tmp/registry-v3.json; then
              if EXPECTED_HASH="$EXPECTED_HASH" EXPECTED_COUNT="$EXPECTED_COUNT" node -e "const r=require('/tmp/registry-v3.json'); if(r.registry_version!==3 || r.generated?.content_hash!==process.env.EXPECTED_HASH || String(r.plugins?.length)!==process.env.EXPECTED_COUNT) process.exit(1)"; then
                echo "Registry V3 converged: hash=${EXPECTED_HASH}, count=${EXPECTED_COUNT}"
                exit 0
              fi
            fi
            echo "Waiting for Cloudflare production convergence (${attempt}/9)"
            sleep 10
          done
          echo "Cloudflare production did not converge to the exact Registry V3 revision"
          exit 1
      - name: Deployment summary
        if: always()
        run: |
          echo "### Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- revision: ${{ inputs.commit_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- deployment URL: ${{ steps.cloudflare.outputs.deployment-url || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
