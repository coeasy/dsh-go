name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# 连续推送只跑最新一次，避免并行部署互相覆盖
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 心跳提交（sync 打 [no deploy]）跳过部署；手动/dispatch 不受影响
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[no deploy]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install root dependencies & run checks
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Install site dependencies
        run: cd site && npm ci

      - name: Copy catalog into site (API 数据源 + 静态下载)
        run: node scripts/copy-assets.mjs

      - name: Build site
        run: cd site && npm run build

      - name: Verify build output
        run: |
          test -f site/dist/index.html
          test -f site/dist/catalog/plugins.json
          echo "构建产物校验通过"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: dsh-hub
          directory: site/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}