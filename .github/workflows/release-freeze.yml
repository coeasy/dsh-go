name: Release Freeze Gate

on:
  workflow_call:
    inputs:
      commit_sha:
        description: "Exact revision to validate"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact revision to validate"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-freeze-${{ inputs.commit_sha || github.sha }}
  cancel-in-progress: false

jobs:
  freeze-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 1

      - name: Verify immutable release revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ inputs.commit_sha || github.sha }}"
          [[ "$EXPECTED" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Release revision must be an exact 40-character SHA"; exit 1; }
          ACTUAL="$(git rev-parse HEAD)"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "Release revision mismatch: expected=$EXPECTED actual=$ACTUAL"; exit 1; }
          test -s catalog/registry-v4.json
          node scripts/validate-registry-v4.mjs catalog/registry-v4.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci
          cd site && npm ci

      - name: Dependency security gate
        run: |
          node scripts/npm-audit-retry.mjs --label root
          node scripts/npm-audit-retry.mjs --cwd site --label site

      - name: Architecture and contract gates
        run: |
          npm run contract:check
          npm run architecture:check
          npm run registry:verify
          npm run typecheck
          npm run lint

      - name: Provider Adapter Registry gate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const registry = JSON.parse(fs.readFileSync('catalog/provider-adapters.json', 'utf8'));
          if (registry.registry_version !== 1) throw new Error('Provider Adapter Registry version must be 1');
          if (registry.schema_version !== '1.0.0') throw new Error('Provider Adapter Registry schema must be 1.0.0');
          if (!/^[0-9a-f]{64}$/i.test(String(registry.generated?.content_hash || ''))) throw new Error('Provider Adapter Registry content hash is invalid');
          if (!Array.isArray(registry.providers)) throw new Error('Provider Adapter Registry providers must be an array');
          if (registry.generated?.count !== registry.providers.length) throw new Error('Provider Adapter Registry count mismatch');
          NODE

      - name: Full regression suite
        run: npm test

      - name: Site validation and release build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd site
          npm run check
          npm run build
          cd ..
          test -f site/dist/index.html
          test -f site/dist/catalog/registry-v4.json
          test -f site/dist/catalog/registry-v4/index.json
          test -f site/dist/catalog/search-index-v3.json
          test -f site/dist/catalog/provider-adapters.json
          test ! -e site/dist/catalog/registry-v3.json
          test ! -e site/dist/catalog/search-index-v2.json
          test ! -e site/dist/catalog/plugins.json
          test ! -e site/dist/catalog/registry-candidates-v1.json

      - name: Deployment Gate V4
        run: npm run deploy:gate

      - name: Package smoke
        run: npm pack --dry-run

      - name: Release freeze passed
        run: echo "Release freeze gate passed for ${{ inputs.commit_sha || github.sha }} on Protocol V2 / Registry V4 / Runtime State V4"
