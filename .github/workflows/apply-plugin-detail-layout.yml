name: Apply plugin detail layout balance

on:
  push:
    branches: [fix/plugin-detail-balanced-layout]
    paths:
      - ".github/workflows/apply-plugin-detail-layout.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plugin-detail-balanced-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply detail page layout changes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'site/src/pages/plugin/[slug].astro';
          let s = fs.readFileSync(path, 'utf8');

          const badge = `        <section class="card">\n          <h2 data-i18n="badge_copy_md">复制 Markdown 徽章</h2>\n          <p class="hint" data-i18n="badge_hint">在 README / 博客中引用插件的徽章链接</p>\n          <div class="badge-row">\n            <input id="badge" class="badge-input" type="text" data-badge={badgeMd} value={badgeMd} readonly />\n            <button id="badge-copy" class="qbtn" data-i18n="badge_copy_md">复制 Markdown 徽章</button>\n          </div>\n        </section>\n`;

          const mainClose = `        </section>\n      </div>\n\n      <aside class="side-col">`;
          if (!s.includes(mainClose)) throw new Error('main column anchor not found');
          s = s.replace(mainClose, `        </section>\n\n${badge}      </div>\n\n      <aside class="side-col">`);

          const badgeInSide = `\n${badge}`;
          const first = s.indexOf(badgeInSide, s.indexOf('<aside class="side-col">'));
          if (first < 0) throw new Error('sidebar badge block not found');
          s = s.slice(0, first) + '\n' + s.slice(first + badgeInSide.length);

          const replacements = [
            [
              `.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; margin-top: 18px; align-items: start; }`,
              `.layout {\n    display: grid;\n    grid-template-columns: minmax(0, 1.45fr) minmax(340px, .85fr);\n    gap: 22px;\n    margin-top: 22px;\n    align-items: start;\n  }`
            ],
            [`.main-col, .side-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }`, `.main-col, .side-col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }`],
            [`.card {\n    border: 1px solid var(--border); border-radius: 16px;\n    background: var(--card); padding: 20px 22px;\n    box-shadow: var(--shadow-sm);\n  }`, `.card {\n    border: 1px solid var(--border); border-radius: 16px;\n    background: var(--card); padding: 22px 24px;\n    box-shadow: var(--shadow-sm);\n  }`],
            [`.quick-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }`, `.quick-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-start; margin-top: 16px; }`],
            [`@media (max-width: 900px) {`, `@media (max-width: 980px) {`]
          ];

          for (const [from, to] of replacements) {
            if (!s.includes(from)) throw new Error(`style anchor not found: ${from.slice(0, 50)}`);
            s = s.replace(from, to);
          }

          fs.writeFileSync(path, s);
          NODE
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          cd site
          npm ci
          npm run check
      - name: Commit layout fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'site/src/pages/plugin/[slug].astro'
          git rm -- .github/workflows/apply-plugin-detail-layout.yml
          git commit -m "fix: balance plugin detail page layout"
          git push
