name: Ecosystem Package Release V2

on:
  workflow_call:
    inputs:
      channel:
        description: Registry release channel
        required: false
        default: stable
        type: string
      marketplace_repository:
        description: DSH Registry V4 repository to refresh after release
        required: false
        default: coeasy/dsh-go
        type: string
      package_path:
        description: Repository-relative package directory; empty means repository root
        required: false
        default: ''
        type: string
    secrets:
      marketplace_token:
        description: Token or GitHub App token allowed to dispatch Registry V4 sync
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: dsh-package-release-v2-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout package source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve immutable DSH toolkit SHA
        id: toolkit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const token = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!url || !token) throw new Error('OIDC token endpoint is unavailable');
          fetch(url + (url.includes('?') ? '&' : '?') + 'audience=dsh-package-release-v2', {
            headers: { Authorization: 'bearer ' + token },
          }).then(async (response) => {
            if (!response.ok) throw new Error('OIDC token request failed: ' + response.status);
            const body = await response.json();
            const payload = JSON.parse(Buffer.from(body.value.split('.')[1], 'base64url').toString('utf8'));
            const sha = payload.job_workflow_sha || payload.workflow_sha;
            if (!/^[0-9a-f]{40}$/i.test(String(sha || ''))) throw new Error('called workflow SHA is unavailable in OIDC claims');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sha=' + sha + '\n');
          }).catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Checkout pinned DSH release toolkit
        uses: actions/checkout@v7
        with:
          repository: coeasy/dsh-go
          ref: ${{ steps.toolkit.outputs.sha }}
          path: .dsh-toolkit
          persist-credentials: false

      - name: Validate Manifest V2 and audit local source
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ROOT="$GITHUB_WORKSPACE"
          if [ -n "$PACKAGE_PATH" ]; then PACKAGE_ROOT="$GITHUB_WORKSPACE/$PACKAGE_PATH"; fi
          node .dsh-toolkit/runtime/dsh.mjs package validate "$PACKAGE_ROOT"
          node .dsh-toolkit/runtime/dsh.mjs package audit "$PACKAGE_ROOT"

      - name: Pack deterministic Package Protocol V2 release
        id: pack
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}
          CHANNEL_INPUT: ${{ inputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          node .dsh-toolkit/scripts/package-release-pack.mjs \
            --root "$GITHUB_WORKSPACE" \
            --package-path "$PACKAGE_PATH" \
            --out-dir "$GITHUB_WORKSPACE/dist" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --channel "$CHANNEL_INPUT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Rebuild and prove release reproducibility
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}
          TAG: ${{ steps.pack.outputs.tag }}
          CHANNEL_INPUT: ${{ inputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          node .dsh-toolkit/scripts/package-release-pack.mjs \
            --root "$GITHUB_WORKSPACE" \
            --package-path "$PACKAGE_PATH" \
            --out-dir "$GITHUB_WORKSPACE/.dsh-repro" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --channel "$CHANNEL_INPUT" \
            --tag "$TAG"
          cmp "dist/${{ steps.pack.outputs.archive_name }}" ".dsh-repro/${{ steps.pack.outputs.archive_name }}"
          cmp dist/dsh-package-release.json .dsh-repro/dsh-package-release.json
          cmp dist/dsh-package-sbom.cdx.json .dsh-repro/dsh-package-sbom.cdx.json
          cmp dist/SHA256SUMS .dsh-repro/SHA256SUMS

      - name: Enforce canonical release tag
        env:
          TAG: ${{ steps.pack.outputs.tag }}
          CANONICAL_TAG: ${{ steps.pack.outputs.canonical_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$TAG" = "$CANONICAL_TAG" ] || { echo "DSH package release tag must be $CANONICAL_TAG" >&2; exit 1; }
          git check-ref-format "refs/tags/$TAG"

      - name: Bind immutable release tag to source commit
        env:
          TAG: ${{ steps.pack.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
          if [ -n "$remote_tag" ]; then
            remote_target="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk 'NR == 1 { print $1 }')"
            if [ -z "$remote_target" ]; then remote_target="$remote_tag"; fi
            [ "$remote_target" = "$GITHUB_SHA" ] || { echo "immutable tag $TAG already points to $remote_target, expected $GITHUB_SHA" >&2; exit 1; }
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Attest package artifact provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ steps.pack.outputs.archive_name }}

      - name: Attest package SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ steps.pack.outputs.archive_name }}
          sbom-path: dist/dsh-package-sbom.cdx.json

      - name: Create or verify immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pack.outputs.tag }}
          PACKAGE_ID: ${{ steps.pack.outputs.id }}
          PACKAGE_VERSION: ${{ steps.pack.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "dist/${{ steps.pack.outputs.archive_name }}"
            "dist/dsh-package-release.json"
            "dist/dsh-package-sbom.cdx.json"
            "dist/SHA256SUMS"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p .dsh-existing-release
            existing_names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            missing=()
            for asset in "${assets[@]}"; do
              name="${asset#dist/}"
              if grep -Fqx -- "$name" <<<"$existing_names"; then
                gh release download "$TAG" --pattern "$name" --dir .dsh-existing-release
                cmp "$asset" ".dsh-existing-release/$name"
              else
                missing+=("$asset")
              fi
            done
            if ((${#missing[@]} > 0)); then gh release upload "$TAG" "${missing[@]}"; fi
          else
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --title "$PACKAGE_ID $PACKAGE_VERSION" \
              --notes "Immutable Package Protocol V2 release $PACKAGE_ID@$PACKAGE_VERSION. The release descriptor binds Manifest V2, artifact digest and source commit."
          fi

      - name: Refresh Marketplace Registry V4
        env:
          GH_TOKEN: ${{ secrets.marketplace_token || github.token }}
          MARKETPLACE_REPOSITORY: ${{ inputs.marketplace_repository }}
          TAG: ${{ steps.pack.outputs.tag }}
          PACKAGE_PATH: ${{ inputs.package_path }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "Registry V4 dispatch token is unavailable" >&2; exit 1; }
          payload="$(jq -nc --arg repository "$GITHUB_REPOSITORY" --arg tag "$TAG" --arg package_path "$PACKAGE_PATH" '{event_type:"sync-plugins",client_payload:{mode:"incremental",repository:$repository,tag:$tag,package_path:$package_path,protocol_version:2,registry_version:4,release_version:2}}')"
          printf '%s' "$payload" | gh api --method POST "repos/$MARKETPLACE_REPOSITORY/dispatches" --input -
