name: Deploy Router

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact commit SHA to route (defaults to current revision)"
        required: false
        type: string
      target:
        description: "Deployment target"
        required: true
        default: all
        type: choice
        options:
          - all
          - cloudflare
          - github-pages
          - edgeone

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-router-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[no deploy]') }}
    steps:
      - name: Checkout routing revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0
      - name: Classify changed paths
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          SYNC_OWNED=false
          GENERATED_CATALOG=false
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              git diff --name-only "$BEFORE" "$SHA" > /tmp/changed-files
            else
              git diff-tree --no-commit-id --name-only -r "$SHA" > /tmp/changed-files
            fi
          else
            printf '%s\n' '.github/workflows/deploy-router.yml' > /tmp/changed-files
          fi
          echo "Changed files:"
          cat /tmp/changed-files
          while IFS= read -r path; do
            case "$path" in
              scripts/sync*.mjs|scripts/registry-pipeline-v3.mjs|scripts/registry-v3-builder.mjs|scripts/repository-identity.mjs|scripts/github-discovery.mjs|scripts/checksum.mjs|scripts/validate-registry-v3.mjs|catalog/schema-v3.json|catalog/overrides.json|.github/workflows/sync.yml)
                SYNC_OWNED=true
                ;;
              catalog/plugins.json|catalog/feed.xml|catalog/meta.json|catalog/registry-v3.json|catalog/audit-report.json)
                GENERATED_CATALOG=true
                ;;
            esac
          done < /tmp/changed-files
          echo "sync_owned=$SYNC_OWNED" >> "$GITHUB_OUTPUT"
          echo "generated_catalog=$GENERATED_CATALOG" >> "$GITHUB_OUTPUT"
          echo "revision=$SHA" >> "$GITHUB_OUTPUT"
      - name: Reject manual generated catalog publication
        if: ${{ github.event_name == 'push' && steps.changes.outputs.generated_catalog == 'true' }}
        run: |
          echo "Generated catalog files are owned by Sync V3 and must not be deployed from a direct push."
          exit 1
      - name: Defer Registry-owned changes to Sync V3
        if: ${{ github.event_name == 'push' && steps.changes.outputs.sync_owned == 'true' && steps.changes.outputs.generated_catalog != 'true' }}
        run: |
          echo "Registry-owned files changed; Sync V3 has deployment authority for revision ${{ steps.changes.outputs.revision }}."
          echo "### Deployment deferred to Sync V3" >> "$GITHUB_STEP_SUMMARY"
          echo "- source revision: ${{ steps.changes.outputs.revision }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve deployment targets
        id: targets
        if: ${{ github.event_name != 'push' || (steps.changes.outputs.sync_owned != 'true' && steps.changes.outputs.generated_catalog != 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ inputs.target || 'all' }}"
          case "$TARGET" in
            all)
              WORKFLOWS="deploy.yml deploy-pages.yml deploy-edgeone.yml monitor.yml"
              LABEL="Cloudflare Pages, GitHub Pages, Tencent EdgeOne, final production smoke"
              ;;
            cloudflare)
              WORKFLOWS="deploy.yml monitor.yml"
              LABEL="Cloudflare Pages + final production smoke"
              ;;
            github-pages)
              WORKFLOWS="deploy-pages.yml monitor.yml"
              LABEL="GitHub Pages + final production smoke"
              ;;
            edgeone)
              WORKFLOWS="deploy-edgeone.yml monitor.yml"
              LABEL="Tencent EdgeOne + final production smoke"
              ;;
            *)
              echo "Unknown deployment target: $TARGET"
              exit 1
              ;;
          esac
          echo "workflows=$WORKFLOWS" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
      - name: Dispatch deployment workflows
        id: dispatch
        if: ${{ steps.targets.outputs.workflows != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REVISION: ${{ steps.changes.outputs.revision }}
          DEPLOY_WORKFLOWS: ${{ steps.targets.outputs.workflows }}
          DEPLOY_LABEL: ${{ steps.targets.outputs.label }}
          DEPLOY_DISPATCH_RETRIES: "5"
          DEPLOY_DISPATCH_RETRY_DELAY_MS: "5000"
        run: node scripts/dispatch-deployments.mjs
