name: Deploy Router

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact commit SHA to route (defaults to current revision)"
        required: false
        type: string
      target:
        description: "Deployment target"
        required: true
        default: all
        type: choice
        options:
          - all
          - cloudflare
          - github-pages
          - edgeone

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-router-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[no deploy]') }}
    steps:
      - name: Checkout routing revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0
      - name: Dispatch deployment workflows
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REVISION: ${{ inputs.commit_sha || github.sha }}
          DEPLOY_WORKFLOWS: ${{ inputs.target == 'edgeone' && 'deploy-edgeone.yml' || inputs.target == 'github-pages' && 'deploy-pages.yml' || inputs.target == 'cloudflare' && 'deploy.yml' || 'deploy.yml deploy-pages.yml deploy-edgeone.yml' }}
          DEPLOY_LABEL: refreshed production deployment
          DEPLOY_DISPATCH_RETRIES: "5"
          DEPLOY_DISPATCH_RETRY_DELAY_MS: "5000"
        run: node scripts/dispatch-deployments.mjs
