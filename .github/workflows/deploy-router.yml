name: Deploy Router

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact commit SHA to route (defaults to current revision)"
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[no deploy]') }}
    steps:
      - name: Checkout routing revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0
      - name: Classify changed paths
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ inputs.commit_sha || github.sha }}"
          SYNC_OWNED=false
          GENERATED_CATALOG=false

          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              git diff --name-only "$BEFORE" "$SHA" > /tmp/changed-files
            else
              git diff-tree --no-commit-id --name-only -r "$SHA" > /tmp/changed-files
            fi
          else
            printf '%s\n' '.github/workflows/deploy-router.yml' > /tmp/changed-files
          fi

          echo "Changed files:"
          cat /tmp/changed-files

          while IFS= read -r path; do
            case "$path" in
              scripts/sync*.mjs|scripts/registry-pipeline-v3.mjs|catalog/schema-v3.json|catalog/overrides.json|.github/workflows/sync.yml)
                SYNC_OWNED=true
                ;;
              catalog/plugins.json|catalog/feed.xml|catalog/meta.json|catalog/registry-v3.json|catalog/audit-report.json)
                GENERATED_CATALOG=true
                ;;
            esac
          done < /tmp/changed-files

          echo "sync_owned=$SYNC_OWNED" >> "$GITHUB_OUTPUT"
          echo "generated_catalog=$GENERATED_CATALOG" >> "$GITHUB_OUTPUT"
          echo "revision=$SHA" >> "$GITHUB_OUTPUT"
      - name: Reject manual generated catalog publication
        if: ${{ steps.changes.outputs.generated_catalog == 'true' }}
        run: |
          echo "Generated catalog files are owned by Sync V3 and must not be deployed from a direct push."
          exit 1
      - name: Defer Registry-owned changes to Sync V3
        if: ${{ steps.changes.outputs.sync_owned == 'true' && steps.changes.outputs.generated_catalog != 'true' }}
        run: |
          echo "Registry-owned files changed; Sync V3 has deployment authority for revision ${{ steps.changes.outputs.revision }}."
          echo "### Deployment deferred to Sync V3" >> "$GITHUB_STEP_SUMMARY"
          echo "- source revision: ${{ steps.changes.outputs.revision }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch deployment workflows
        if: ${{ steps.changes.outputs.sync_owned != 'true' && steps.changes.outputs.generated_catalog != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ steps.changes.outputs.revision }}"
          for workflow in deploy.yml deploy-pages.yml deploy-mirror.yml deploy-edgeone.yml; do
            echo "Dispatching ${workflow} at ${SHA}"
            gh workflow run "$workflow" --ref main -f commit_sha="$SHA"
          done
          echo "### Deployment routed" >> "$GITHUB_STEP_SUMMARY"
          echo "- authoritative revision: ${SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- targets: Cloudflare Pages, GitHub Pages, CN Mirrors, Tencent EdgeOne" >> "$GITHUB_STEP_SUMMARY"
