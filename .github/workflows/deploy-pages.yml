name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact commit SHA to deploy"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  DEPLOYMENT_SHA: ${{ inputs.commit_sha || github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact deployment revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}
          fetch-depth: 1
      - name: Verify deployment revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${DEPLOYMENT_SHA}"
          ACTUAL=$(git rev-parse HEAD)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "Deployment revision mismatch: expected=$EXPECTED actual=$ACTUAL"; exit 1; }
      - name: Check canonical Registry V3
        id: registry
        shell: bash
        run: |
          if [ -f catalog/registry-v3.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Registry V3 is not committed yet; deployment is a successful no-op"
          fi
      - name: Setup Pages
        if: ${{ steps.registry.outputs.ready == 'true' }}
        uses: actions/configure-pages@v6
      - name: Setup Node.js
        if: ${{ steps.registry.outputs.ready == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install dependencies
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: |
          npm ci
          cd site && npm ci
      - name: Deploy Gate V3 and tests
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: |
          npm run deploy:gate
          npm run typecheck
          npm test
      - name: Copy catalog into site
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: npm run copy-assets
      - name: Prepare deployment identity before build
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: node scripts/write-deployment-version.mjs site/public/version.json
      - name: Build site for GitHub Pages
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: cd site && npm run build
        env:
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_SITE_URL: https://${{ github.event.repository.owner.login }}.github.io/${{ github.event.repository.name }}
          PUBLIC_API_URL: https://${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}.pages.dev
      - name: Verify build output
        if: ${{ steps.registry.outputs.ready == 'true' }}
        run: |
          test -f site/dist/index.html
          test -f site/dist/version.json
          node scripts/check-platform-discovery.mjs --file site/dist/.well-known/dsh-marketplace.json
          test -f site/dist/catalog/plugins.json
          test -f site/dist/catalog/registry-v3.json
          test -f site/dist/catalog/schema-v3.json
          test -f site/dist/catalog/provider-adapters.json
          node -e "const fs=require('node:fs'); const v=JSON.parse(fs.readFileSync('site/dist/version.json','utf8')); if(v.git_sha!==process.env.DEPLOYMENT_SHA) process.exit(1)"
          node -e "const fs=require('node:fs'); const r=require('./site/dist/catalog/registry-v3.json'); if(r.registry_version!==3 || !r.generated?.content_hash || !r.plugins.length || fs.statSync('site/dist/catalog/registry-v3.json').size>25165824) process.exit(1)"
          node -e "const r=require('./site/dist/catalog/provider-adapters.json'); if(r.registry_version!==1 || !r.generated?.content_hash || !Array.isArray(r.providers) || r.generated.count!==r.providers.length) process.exit(1)"
      - name: Upload artifact
        if: ${{ steps.registry.outputs.ready == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - name: Deploy to GitHub Pages
        if: ${{ steps.registry.outputs.ready == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Post-deploy exact SHA check
        if: ${{ steps.registry.outputs.ready == 'true' }}
        env:
          DEPLOY_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_DEPLOYMENT_SHA: ${{ env.DEPLOYMENT_SHA }}
          DEPLOY_LABEL: GitHub Pages
          DEPLOY_SHA_ATTEMPTS: "12"
          DEPLOY_SHA_DELAY_MS: "10000"
        run: node scripts/check-production-sha.mjs
      - name: Post-deploy Registry V3 convergence check
        if: ${{ steps.registry.outputs.ready == 'true' }}
        env:
          DEPLOY_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_LABEL: GitHub Pages
          DEPLOY_CONVERGENCE_ATTEMPTS: "12"
          DEPLOY_CONVERGENCE_DELAY_MS: "10000"
        run: node scripts/check-deployment-convergence.mjs
      - name: Deployment summary
        if: always()
        run: |
          echo "### GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- revision: ${DEPLOYMENT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- page URL: ${{ steps.deployment.outputs.page_url || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- gates: exact SHA + Registry V3 convergence" >> "$GITHUB_STEP_SUMMARY"
