name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact commit SHA to deploy"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  DEPLOYMENT_SHA: ${{ inputs.commit_sha || github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact deployment revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}
          fetch-depth: 1

      - name: Verify deployment revision and Registry V4 authority
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          [ "$ACTUAL" = "$DEPLOYMENT_SHA" ] || { echo "Deployment revision mismatch: expected=$DEPLOYMENT_SHA actual=$ACTUAL"; exit 1; }
          test -s catalog/registry-v4.json
          node scripts/validate-registry-v4.mjs catalog/registry-v4.json
          test ! -e functions/api/v1

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          cd site && npm ci

      - name: Canonical pre-deploy validation
        run: |
          npm run contract:check
          npm run architecture:check
          npm run typecheck
          npm test

      - name: Prepare deployment identity
        run: node scripts/write-deployment-version.mjs site/public/version.json

      - name: Build site for GitHub Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_SITE_URL: https://${{ github.event.repository.owner.login }}.github.io/${{ github.event.repository.name }}
          PUBLIC_API_URL: https://${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}.pages.dev
        run: cd site && npm run build

      - name: Preserve dot-directories
        run: touch site/dist/.nojekyll

      - name: Deployment Gate V4
        run: |
          npm run deploy:gate
          test -f site/dist/.nojekyll
          test -f site/dist/version.json
          node scripts/check-platform-discovery.mjs --file site/dist/.well-known/dsh-marketplace.json
          test -f site/dist/catalog/registry-v4.json
          test -f site/dist/catalog/registry-v4/index.json
          test -f site/dist/catalog/search-index-v3.json
          test ! -e site/dist/catalog/registry-v3.json
          test ! -e site/dist/catalog/search-index-v2.json
          test ! -e site/dist/catalog/plugins.json
          test ! -e site/dist/catalog/registry-candidates-v1.json
          node -e "const fs=require('node:fs');const v=JSON.parse(fs.readFileSync('site/dist/version.json','utf8'));if(v.git_sha!==process.env.DEPLOYMENT_SHA)process.exit(1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Post-deploy exact SHA check
        env:
          DEPLOY_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_DEPLOYMENT_SHA: ${{ env.DEPLOYMENT_SHA }}
          DEPLOY_LABEL: GitHub Pages
          DEPLOY_SHA_ATTEMPTS: "12"
          DEPLOY_SHA_DELAY_MS: "10000"
        run: node scripts/check-production-sha.mjs

      - name: Post-deploy Registry V4 convergence check
        env:
          DEPLOY_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_LABEL: GitHub Pages
          DEPLOY_CONVERGENCE_ATTEMPTS: "12"
          DEPLOY_CONVERGENCE_DELAY_MS: "10000"
        run: node scripts/check-deployment-convergence.mjs

      - name: Deployment summary
        if: always()
        run: |
          echo "### GitHub Pages · V4" >> "$GITHUB_STEP_SUMMARY"
          echo "- revision: ${DEPLOYMENT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- page URL: ${{ steps.deployment.outputs.page_url || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- authority: Package Protocol V2 + Registry V4" >> "$GITHUB_STEP_SUMMARY"
          echo "- gates: Architecture Conformance + Deployment Gate V4 + exact SHA + exact Registry V4 revision" >> "$GITHUB_STEP_SUMMARY"
