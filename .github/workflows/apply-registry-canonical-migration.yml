name: Reconcile canonical identity fix with latest main

on:
  push:
    branches: ["fix/canonical-repository-identity"]
    paths:
      - ".github/workflows/apply-registry-canonical-migration.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Merge latest main and resolve known overlaps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            echo "Merge conflicts detected:"
            printf '%s\n' "$conflicts"
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                functions/api/v1/mcp.ts|package.json|catalog/plugins.json|catalog/registry-v3.json|catalog/meta.json|catalog/feed.xml)
                  git checkout --theirs -- "$path"
                  git add -- "$path"
                  ;;
                *)
                  echo "Unexpected merge conflict: $path"
                  exit 1
                  ;;
              esac
            done <<EOF
          $conflicts
          EOF
          fi
          python3 .github/scripts/apply-registry-canonical-migration.py
          git add -- functions/api/v1/mcp.ts package.json
          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "Unresolved conflicts remain:"
            printf '%s\n' "$remaining"
            exit 1
          fi
          if [ "$merge_rc" -ne 0 ] && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "git merge failed without a resolvable merge state"
            exit 1
          fi
      - name: Verify combined main plus identity changes
        run: |
          npm ci
          cd site && npm ci && cd ..
          npm run typecheck
          npm run lint
          npm test
          cd site && npm run check && cd ..
      - name: Commit reconciled main
        shell: bash
        run: |
          git commit -m "merge: reconcile canonical identity fix with main"
          git push
