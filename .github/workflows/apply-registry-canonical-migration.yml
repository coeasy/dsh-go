name: Apply repository lifecycle identity hardening

on:
  push:
    branches: ["fix/canonical-repository-identity"]
    paths:
      - ".github/workflows/apply-registry-canonical-migration.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repository lifecycle hardening
        run: python3 .github/scripts/apply-registry-canonical-migration.py
      - name: Verify repository lifecycle hardening
        run: |
          npm ci
          node --check scripts/repository-identity.mjs
          node --check scripts/sync.mjs
          npm run typecheck
          npm run lint
          npm test
      - name: Commit patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/repository-identity.mjs scripts/sync.mjs tests/repository-identity.test.ts
          git commit -m "fix: preserve identity across repository lifecycle changes"
          git push
