name: Apply active API surface consistency hardening

on:
  push:
    branches: ["fix/canonical-repository-identity"]
    paths:
      - ".github/workflows/apply-registry-canonical-migration.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply active API surface hardening
        run: python3 .github/scripts/apply-registry-canonical-migration.py
      - name: Verify active API surface hardening
        run: |
          npm ci
          node --check scripts/update-readme.mjs
          npm run typecheck
          npm run lint
          npm test
      - name: Commit patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/v1/categories.ts functions/api/v1/stats.ts functions/api/v1/plugins/[slug].ts functions/api/v1/meta.ts functions/api/v1/mcp.ts scripts/update-readme.mjs tests/update-readme.test.mjs tests/api-active-surface.test.ts
          git commit -m "fix: align public API surfaces with active repository state"
          git push
