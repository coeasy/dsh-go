name: Apply final identity surface consistency checks

on:
  push:
    branches: ["fix/canonical-repository-identity"]
    paths:
      - ".github/workflows/apply-registry-canonical-migration.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final consistency patches
        run: python3 .github/scripts/apply-registry-canonical-migration.py
      - name: Verify final consistency patches
        run: |
          npm ci
          cd site && npm ci && cd ..
          node --check scripts/registry-v3-builder.mjs
          node --check scripts/validate-registry-v3.mjs
          npm run typecheck
          npm run lint
          npm test
          cd site && npm run check && cd ..
      - name: Commit patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/pages/plugin/[slug].astro scripts/registry-v3-builder.mjs scripts/validate-registry-v3.mjs tests/registry-v3.test.ts
          git commit -m "fix: align install fallbacks and registry identity checks"
          git push
