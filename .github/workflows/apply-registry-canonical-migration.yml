name: Apply identity consumer normalization

on:
  push:
    branches: ["fix/canonical-repository-identity"]
    paths:
      - ".github/workflows/apply-registry-canonical-migration.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply consumer identity patches
        run: python3 .github/scripts/apply-registry-canonical-migration.py
      - name: Verify consumer identity patches
        run: |
          npm ci
          cd site && npm ci && cd ..
          npm run typecheck
          npm run lint
          npm test
          cd site && npm run check && cd ..
      - name: Commit patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- functions/_lib.ts functions/api/v1/mcp.ts functions/api/v1/ecosystem/[id].ts marketplace/v1/api.ts runtime/resolver.mjs tests/identity-consumers.test.ts
          git commit -m "fix: normalize identity lookups across public consumers"
          git push
