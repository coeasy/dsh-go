# Branch-only verification harness. Remove after the repaired catalog is committed.
name: Verify canonical full sync

on:
  push:
    branches: ["fix/canonical-repository-identity"]
    paths:
      - ".github/workflows/verify-canonical-full-sync.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          cd site && npm ci
      - name: Run static and regression checks
        run: |
          node --check scripts/github-discovery.mjs
          node --check scripts/repository-identity.mjs
          node --check scripts/audit-catalog-identity.mjs
          node --check scripts/sync.mjs
          node --check scripts/sync-v3.mjs
          npm run typecheck
          npm run lint
          npm test
          cd site && npm run check
      - name: Run real full Registry V3 sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_MODE: full
          SYNC_CONCURRENCY: "32"
          REGISTRY_GRAPHQL_PAGE_SIZE: "50"
          REGISTRY_GRAPHQL_DELAY: "50"
          REGISTRY_MANIFEST_CONCURRENCY: "64"
        run: node scripts/sync-v3.mjs --full
      - name: Run strict data quality gates
        run: |
          npm run validate
          npm run audit:identity:report -- --strict
          npm run registry:verify
          npm run runtime:check
          npm run deploy:gate
          test ! -e catalog/.sync-observed.json
      - name: Assert canonical identity invariants
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const data = JSON.parse(await readFile('catalog/plugins.json', 'utf8'));
          const registry = JSON.parse(await readFile('catalog/registry-v3.json', 'utf8'));
          const meta = JSON.parse(await readFile('catalog/meta.json', 'utf8'));
          const audit = JSON.parse(await readFile('catalog/audit-report.json', 'utf8'));
          const plugins = data.plugins || [];
          const errors = [];
          const repoKeys = new Set();
          const repoIds = new Set();
          const slugKeys = new Set();
          const registryIdKeys = new Set();
          const validCategories = new Set(['web-ui','desktop','mcp','skills','theme','terminal','coding','agent','vision','memory','security','integration','tool','other']);
          const installableRepos = new Set((registry.plugins || []).map((p) => String(p.source?.repo || '').toLowerCase()));
          for (const p of plugins) {
            const key = String(p.full_name || '').toLowerCase();
            const slugKey = String(p.slug || '').toLowerCase();
            if (repoKeys.has(key)) errors.push(`duplicate repo: ${p.full_name}`);
            repoKeys.add(key);
            if (!slugKey || slugKeys.has(slugKey)) errors.push(`duplicate/empty slug: ${p.slug}`);
            slugKeys.add(slugKey);
            if (p.repo_id) {
              const id = String(p.repo_id);
              if (repoIds.has(id)) errors.push(`duplicate repo_id: ${id}`);
              repoIds.add(id);
            }
            const repoName = String(p.full_name || '').split('/').pop();
            if (p.repo_name !== repoName) errors.push(`repo_name mismatch: ${p.full_name}`);
            if (p.repo_url !== `https://github.com/${p.full_name}`) errors.push(`repo_url mismatch: ${p.full_name}`);
            if (p.repo_url?.startsWith('https://api.github.com/')) errors.push(`API URL leaked: ${p.full_name}`);
            if (p.homepage && !/^https?:\/\//.test(p.homepage)) errors.push(`unsafe homepage: ${p.full_name}`);
            if (p.manifest_file && p.manifest_file !== 'dsh-plugin.json') errors.push(`invalid manifest: ${p.full_name}`);
            if (p.verified && p.manifest_file !== 'dsh-plugin.json') errors.push(`false verified: ${p.full_name}`);
            if (p.metadata_source === 'github' && p.name !== repoName) errors.push(`GitHub name mismatch: ${p.full_name} -> ${p.name}`);
            if (p.metadata_source === 'dsh-plugin' && (!p.verified || p.manifest_file !== 'dsh-plugin.json')) errors.push(`manifest authority mismatch: ${p.full_name}`);
            if (p.metadata_source === 'override' && (!Array.isArray(p.override_fields) || !p.override_fields.length)) errors.push(`override provenance missing: ${p.full_name}`);
            if (!validCategories.has(p.category)) errors.push(`invalid category: ${p.full_name} -> ${p.category}`);
            if (!String(p.install_cmd || '').includes(`github:${p.full_name}`)) errors.push(`install source mismatch: ${p.full_name}`);
            if (Object.prototype.hasOwnProperty.call(p, '_manifest_observed')) errors.push(`transient manifest marker leaked: ${p.full_name}`);
            if (Object.prototype.hasOwnProperty.call(p, 'observed_at')) errors.push(`transient observation leaked: ${p.full_name}`);
            if ((p.deprecated || p.disabled) && installableRepos.has(key)) errors.push(`inactive repo leaked into registry: ${p.full_name}`);
          }
          for (const p of registry.plugins || []) {
            const idKey = String(p.id || '').toLowerCase();
            if (!idKey || registryIdKeys.has(idKey)) errors.push(`duplicate/empty registry id: ${p.id}`);
            registryIdKeys.add(idKey);
          }
          const ruflo = plugins.find((p) => String(p.full_name).toLowerCase() === 'ruvnet/ruflo');
          if (!ruflo) errors.push('ruvnet/ruflo missing after full sync');
          else {
            if (ruflo.name !== 'ruflo') errors.push(`ruflo name=${ruflo.name}`);
            if (ruflo.repo_name !== 'ruflo') errors.push(`ruflo repo_name=${ruflo.repo_name}`);
            if (ruflo.repo_url !== 'https://github.com/ruvnet/ruflo') errors.push(`ruflo repo_url=${ruflo.repo_url}`);
            if (ruflo.manifest_file !== null) errors.push(`ruflo manifest=${ruflo.manifest_file}`);
            if (ruflo.verified !== false) errors.push(`ruflo verified=${ruflo.verified}`);
          }
          const verified = plugins.filter((p) => p.verified).length;
          const manifestSources = plugins.filter((p) => p.metadata_source === 'dsh-plugin').length;
          if (verified !== manifestSources) errors.push(`verified/source count mismatch: ${verified}/${manifestSources}`);
          if (!audit.ok || audit.error_count !== 0) errors.push(`audit report is not clean: ${audit.error_count}`);
          if (audit.plugin_count !== plugins.length) errors.push(`audit count mismatch: ${audit.plugin_count}/${plugins.length}`);
          console.log(JSON.stringify({
            count: plugins.length,
            active: plugins.filter((p) => !p.deprecated && !p.disabled).length,
            archived_or_disabled: plugins.filter((p) => p.deprecated || p.disabled).length,
            verified,
            manifest_sources: manifestSources,
            overrides: plugins.filter((p) => p.metadata_source === 'override').length,
            registry_count: registry.plugins?.length || 0,
            repo_ids: repoIds.size,
            unique_slugs: slugKeys.size,
            unique_registry_ids: registryIdKeys.size,
            discovery_transport: meta.registry?.discovery_transport,
            discovered_count: meta.registry?.discovered_count,
            audit_ok: audit.ok,
            audit_errors: audit.error_count,
            ruflo: {
              name: ruflo?.name,
              repo_name: ruflo?.repo_name,
              repo_url: ruflo?.repo_url,
              verified: ruflo?.verified,
              manifest_file: ruflo?.manifest_file,
              watchers: ruflo?.watchers,
            },
            errors: errors.slice(0, 100),
          }, null, 2));
          if (errors.length) throw new Error(`canonical identity assertions failed: ${errors.length}`);
          NODE
      - name: Commit repaired historical catalog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -- catalog/plugins.json catalog/meta.json catalog/feed.xml catalog/registry-v3.json catalog/audit-report.json
          if git diff --cached --quiet; then
            echo "No generated catalog changes to commit"
          else
            git commit -m "data: repair canonical catalog identity"
            git push
          fi
