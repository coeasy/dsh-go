name: Sync Plugins

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync*.mjs"
      - "scripts/registry-pipeline-v3.mjs"
      - "scripts/registry-v3-builder.mjs"
      - "scripts/repository-identity.mjs"
      - "scripts/github-discovery.mjs"
      - "scripts/checksum.mjs"
      - "scripts/validate-registry-v3.mjs"
      - "catalog/schema-v3.json"
      - "catalog/overrides.json"
      - ".github/workflows/sync.yml"
      - "dsh-package.json"
      - "packages/dsh-go-marketplace/**"
  schedule:
    - cron: "18 0 * * *"
    - cron: "18 6 * * *"
    - cron: "18 12 * * *"
    - cron: "18 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        type: choice
        default: full
        options: [full, incremental]
  repository_dispatch:
    types: [sync-plugins]

permissions:
  contents: write
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve sync mode
        id: mode
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || github.event.client_payload.mode || 'incremental' }}"
          if [ "${{ github.event_name }}" = "push" ]; then MODE="incremental"; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "18 0 * * *" ]; then MODE="full"; fi
          case "$MODE" in full|incremental) ;; *) echo "Invalid sync mode: $MODE"; exit 1 ;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Sync mode: $MODE"
      - name: Run Sync V3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_MODE: ${{ steps.mode.outputs.mode }}
          SYNC_CONCURRENCY: "16"
        run: node scripts/sync-v3.mjs --${{ steps.mode.outputs.mode }}
      - name: Run integrity gates
        run: |
          npm run validate
          npm run audit:identity:report -- --strict
          npm run registry:verify
          npm run runtime:check
          npm run deploy:gate
      - name: Update README hot recommendations
        run: npm run readme:update
      - name: Detect deploy-worthy changes
        id: diff
        shell: bash
        run: |
          # meta.json is public freshness state and participates in exact-SHA production convergence.
          # Treat every successful sync metadata refresh as deploy-worthy so production never trails main.
          if ! git diff --quiet -- catalog/plugins.json catalog/feed.xml catalog/registry-v3.json catalog/schema-v3.json catalog/meta.json; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push generated data
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- catalog/ README.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.diff.outputs.data_changed }}" = "true" ]; then
            COUNT=$(node -p "require('./catalog/plugins.json').meta.count")
            MSG="chore(sync): Registry V3 update (${COUNT} plugins, ${{ steps.mode.outputs.mode }})"
          else
            MSG="chore(sync): heartbeat [no deploy]"
          fi
          git commit -m "$MSG"
          git push || { echo "Push raced with another commit; rebasing once"; git pull --rebase; git push; }
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dispatch deployment workflows and final smoke for authoritative revision
        id: dispatch
        if: github.event_name == 'push' || (steps.publish.outputs.pushed == 'true' && steps.diff.outputs.data_changed == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REVISION: ${{ steps.publish.outputs.commit_sha }}
          DEPLOY_WORKFLOWS: deploy.yml deploy-pages.yml deploy-edgeone.yml monitor.yml
          DEPLOY_LABEL: Cloudflare Pages, GitHub Pages, Tencent EdgeOne, final production smoke
          DEPLOY_DISPATCH_RETRIES: "5"
          DEPLOY_DISPATCH_RETRY_DELAY_MS: "5000"
        run: node scripts/dispatch-deployments.mjs
      - name: Summary
        if: always()
        run: |
          echo "### Registry V3 sync (${{ steps.mode.outputs.mode || 'n/a' }})" >> "$GITHUB_STEP_SUMMARY"
          if [ -f catalog/meta.json ]; then
            node -e "const m=require('./catalog/meta.json'); console.log('- last sync: '+(m.last_sync?.at||'n/a')+'\n- registry hash: '+(m.registry?.content_hash||'n/a')+'\n- registry count: '+(m.registry?.count||0))" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- generated commit pushed: ${{ steps.publish.outputs.pushed || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- deploy-worthy catalog/meta changed: ${{ steps.diff.outputs.data_changed || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- release workflows dispatched: ${{ steps.dispatch.outputs.dispatched || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- dispatch failures: ${{ steps.dispatch.outputs.dispatch_failures || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.publish.outputs.commit_sha }}" ]; then
            echo "- authoritative revision: ${{ steps.publish.outputs.commit_sha }}" >> "$GITHUB_STEP_SUMMARY"
          fi
