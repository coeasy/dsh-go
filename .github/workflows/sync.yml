name: Sync Plugins

on:
  schedule:
    - cron: "18 0 * * *"
    - cron: "18 6 * * *"
    - cron: "18 12 * * *"
    - cron: "18 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "同步模式"
        type: choice
        default: full
        options: [full, incremental]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Sync V3 pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_MODE: ${{ github.event.inputs.mode || 'incremental' }}
        run: |
          node scripts/sync-v3.mjs
          node scripts/registry-pipeline-v3.mjs

      - name: Validate Registry V3
        run: node scripts/validate-registry-v3.mjs

      - name: Update README
        run: node scripts/update-readme.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog README.md
          git diff --cached --quiet || git commit -m "chore(sync): registry v3 update"
          git push || true
