name: Sync Registry V4

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-v4.mjs"
      - "scripts/discovery-sync.mjs"
      - "scripts/registry-v4-*.mjs"
      - "scripts/repository-identity.mjs"
      - "scripts/github-discovery.mjs"
      - "scripts/checksum.mjs"
      - "scripts/validate-registry-v4.mjs"
      - "packages/protocol-core/**"
      - "packages/registry-core/**"
      - "packages/resolver/**"
      - "packages/policy-core/**"
      - "catalog/overrides.json"
      - ".github/workflows/sync.yml"
      - "dsh-package.json"
      - "packages/dsh-go-marketplace/**"
  schedule:
    - cron: "18 0 * * *"
    - cron: "18 6 * * *"
    - cron: "18 12 * * *"
    - cron: "18 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        type: choice
        default: full
        options: [full, incremental]
  repository_dispatch:
    types: [sync-plugins]

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-v4
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve sync mode
        id: mode
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || github.event.client_payload.mode || 'incremental' }}"
          if [ "${{ github.event_name }}" = "push" ]; then MODE="incremental"; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "18 0 * * *" ]; then MODE="full"; fi
          case "$MODE" in full|incremental) ;; *) echo "Invalid sync mode: $MODE"; exit 1 ;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run Sync V4 candidate pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_MODE: ${{ steps.mode.outputs.mode }}
          SYNC_CONCURRENCY: "16"
          REGISTRY_COMMIT_CONCURRENCY: "24"
        run: npm run sync:${{ steps.mode.outputs.mode }}

      - name: Run canonical integrity gates
        run: |
          npm run contract:check
          npm run architecture:check
          npm run validate
          npm run audit:identity
          npm run registry:verify
          npm run typecheck
          node -e "const r=require('./catalog/registry-v4.json');const c=require('./catalog/registry-candidates-v1.json');if(r.schema_version!==4||c.version!==1||c.authority!==false||c.registry_revision!==r.revision)process.exit(1)"

      - name: Update README recommendations
        run: npm run readme:update

      - name: Detect deploy-worthy Registry V4 changes
        id: diff
        shell: bash
        run: |
          if ! git diff --quiet -- catalog/plugins.json catalog/feed.xml catalog/registry-v4.json catalog/registry-candidates-v1.json catalog/meta.json; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated data
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- catalog/ README.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.diff.outputs.data_changed }}" = "true" ]; then
            PACKAGES=$(node -p "require('./catalog/registry-v4.json').packages.length")
            CANDIDATES=$(node -p "require('./catalog/registry-candidates-v1.json').candidates.length")
            MSG="chore(sync): Registry V4 update (${PACKAGES} packages, ${CANDIDATES} candidates, ${{ steps.mode.outputs.mode }})"
          else
            MSG="chore(sync): heartbeat [no deploy]"
          fi
          git commit -m "$MSG"
          git push || { echo "Push raced with another commit; rebasing once"; git pull --rebase; git push; }
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch three production platforms and final smoke
        id: dispatch
        if: github.event_name == 'push' || (steps.publish.outputs.pushed == 'true' && steps.diff.outputs.data_changed == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REVISION: ${{ steps.publish.outputs.commit_sha }}
          DEPLOY_WORKFLOWS: deploy.yml deploy-pages.yml deploy-edgeone.yml monitor.yml
          DEPLOY_LABEL: Cloudflare Pages, GitHub Pages, Tencent EdgeOne, final production smoke
          DEPLOY_DISPATCH_RETRIES: "5"
          DEPLOY_DISPATCH_RETRY_DELAY_MS: "5000"
          DEPLOY_WAIT_TIMEOUT_MS: "2100000"
        run: node scripts/dispatch-deployments.mjs

      - name: Summary
        if: always()
        run: |
          echo "### Registry V4 sync (${{ steps.mode.outputs.mode || 'n/a' }})" >> "$GITHUB_STEP_SUMMARY"
          if [ -f catalog/registry-v4.json ]; then
            node -e "const r=require('./catalog/registry-v4.json'); const c=require('./catalog/registry-candidates-v1.json'); console.log('- registry revision: '+r.revision+'\n- installable packages: '+r.packages.length+'\n- candidates: '+c.candidates.length+'\n- quarantined: '+c.counts.quarantined+'\n- rejected: '+c.counts.rejected)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- generated commit pushed: ${{ steps.publish.outputs.pushed || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- deploy-worthy data changed: ${{ steps.diff.outputs.data_changed || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- release workflows dispatched: ${{ steps.dispatch.outputs.dispatched || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- dispatch failures: ${{ steps.dispatch.outputs.dispatch_failures || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.publish.outputs.commit_sha }}" ]; then echo "- authoritative revision: ${{ steps.publish.outputs.commit_sha }}" >> "$GITHUB_STEP_SUMMARY"; fi
