name: EdgeOne CLI Source Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/edgeone-cli-source-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Inspect pinned EdgeOne CLI upload implementation
        shell: bash
        run: |
          set -euo pipefail
          package_archive=$(npm pack --silent edgeone@1.6.28)
          inspect_dir=$(mktemp -d)
          tar -xzf "$package_archive" -C "$inspect_dir"
          INSPECT_DIR="$inspect_dir" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.env.INSPECT_DIR + '/package';
          for (const relative of ['edgeone-bin/edgeone.js', 'edgeone-dist/cli.js']) {
            const file = path.join(root, relative);
            const source = fs.readFileSync(file, 'utf8');
            console.log('\n=== ' + relative + ' (' + source.length + ' bytes) ===');
            for (const term of ['createZip', 'zipSync', 'archiver', 'readdirSync', 'uploadFile', 'upload', 'isTld', 'IsTld', 'DescribePagesEncipherToken', 'eo_token', 'makers']) {
              const positions = [];
              let from = 0;
              while (positions.length < 4) {
                const index = source.toLowerCase().indexOf(term.toLowerCase(), from);
                if (index < 0) break;
                positions.push(index);
                console.log('\n--- ' + term + ' @ ' + index + ' ---');
                console.log(source.slice(Math.max(0, index - 900), index + 1800));
                from = index + term.length;
              }
              if (!positions.length) console.log(term + ': none');
            }
          }
          NODE
