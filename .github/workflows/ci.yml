name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          cd site && npm ci

      - name: Dependency security audit
        run: |
          npm audit --audit-level=high
          cd site && npm audit --audit-level=high

      - name: Stable contract
        run: npm run contract:check

      - name: Typecheck, lint, tests
        run: |
          npm run typecheck
          npm run lint
          npm test
          cd site && npm run check

      - name: Syntax check runtime scripts
        run: |
          node --check scripts/sync-v3.mjs
          node --check scripts/registry-v3-builder.mjs
          node --check scripts/validate-registry-v3.mjs
          node --check scripts/deploy-gate-v3.mjs
          node --check scripts/check-contract.mjs
          node --check scripts/check-deployment-convergence.mjs
          node --check scripts/check-production-sha.mjs
          node --check scripts/edgeone-deploy-ci.mjs
          node --check scripts/write-deployment-version.mjs
          node --check scripts/verify-package-evidence.mjs
          node --check bin/dsh.mjs
          node --check runtime/cli.mjs
          node --check runtime/dsh.mjs
          node --check runtime/control-cli.mjs
          node --check runtime/installer.mjs
          node --check runtime/loader.mjs
          node --check runtime/registry.mjs
          node --check runtime/execution.mjs
          node --check runtime/transaction.mjs
          node --check runtime/supply-chain-verifier.mjs
