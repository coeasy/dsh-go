name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          cd site && npm ci

      - name: Dependency security audit
        run: |
          node scripts/npm-audit-retry.mjs --label root
          node scripts/npm-audit-retry.mjs --cwd site --label site

      - name: Breaking architecture contract
        run: npm run contract:check

      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Canonical architecture tests
        run: >-
          npx vitest run
          tests/architecture-v4
          tests/deployment-convergence.test.ts
          tests/production-sha-gate.test.ts
          tests/edgeone-deploy-ci.test.ts
          tests/deployment-dispatch.test.ts
          tests/npm-audit-retry.test.ts

      - name: Astro check
        run: cd site && npm run check

      - name: Build Registry V4 marketplace
        run: cd site && npm run build

      - name: Verify generated Registry V4 assets
        run: |
          test -f catalog/registry-v4.json
          test -f site/public/catalog/registry-v4.json
          test -f site/public/catalog/registry-v4/index.json
          test -f site/public/catalog/search-index-v3.json
          node scripts/validate-registry-v4.mjs catalog/registry-v4.json
          test ! -e site/public/catalog/registry-v3.json
          test ! -e site/public/catalog/search-index-v2.json
          test ! -e site/public/catalog/distribution-v1

      - name: Runtime and build syntax
        shell: bash
        run: |
          for file in \
            packages/protocol-core/index.mjs \
            packages/registry-core/index.mjs \
            packages/resolver/index.mjs \
            scripts/sync-v4.mjs \
            scripts/registry-v4-source.mjs \
            scripts/registry-v4-builder.mjs \
            scripts/registry-distribution-v2.mjs \
            scripts/build-search-index-v3.mjs \
            scripts/copy-assets-core.mjs \
            scripts/check-contract.mjs \
            bin/dsh.mjs \
            runtime/dsh.mjs \
            runtime/package-service.mjs \
            runtime/registry-client.mjs \
            runtime/registry.mjs \
            runtime/lifecycle.mjs \
            runtime/installer.mjs \
            runtime/verifier.mjs \
            runtime/loader.mjs \
            runtime/startup.mjs \
            runtime/host-bridge.mjs \
            runtime/client-bridge.mjs \
            runtime/client-host.mjs; do
              node --check "$file"
          done

      - name: Package smoke
        run: npm pack --dry-run
