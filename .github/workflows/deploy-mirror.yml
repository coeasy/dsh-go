name: Deploy CN Mirrors (Gitee/GitCode)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: mirror-deploy
  cancel-in-progress: true

env:
  GITEE_REPO: ${{ vars.GITEE_REPO || 'easy5277/dsh_go' }}
  GITCODE_REPO: ${{ vars.GITCODE_REPO || 'easy5277/dsh_go' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: ${{ (github.event_name != 'push' || !contains(github.event.head_commit.message, '[no deploy]')) && (secrets.GITEE_TOKEN != '' || secrets.GITCODE_TOKEN != '') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          cd site && npm ci
      - name: Ensure canonical Registry V3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-v3.mjs --registry-only
      - name: Deploy Gate V3
        run: npm run deploy:gate
      - name: Copy catalog into site
        run: npm run copy-assets
      - name: Build mirror site
        run: cd site && npm run build
        env:
          PUBLIC_BASE_PATH: /dsh_go
          PUBLIC_SITE_URL: https://easy5277.gitee.io/dsh_go
          PUBLIC_API_URL: https://${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}.pages.dev
      - name: Verify build output
        run: |
          test -f site/dist/index.html
          test -f site/dist/catalog/registry-v3.json
          test -f site/dist/catalog/schema-v3.json
      - name: Deploy to Gitee Pages branch
        if: ${{ secrets.GITEE_TOKEN != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          cd site/dist
          git init -q
          git config user.name "dsh-go CI"
          git config user.email "ci@local"
          git add -A
          git commit -q -m "deploy: ${{ github.sha }}"
          git push -f "https://easy5277:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" HEAD:gh-pages
      - name: Deploy to GitCode Pages branch
        if: ${{ secrets.GITCODE_TOKEN != '' }}
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          cd site/dist
          git init -q
          git config user.name "dsh-go CI"
          git config user.email "ci@local"
          git add -A
          git commit -q -m "deploy: ${{ github.sha }}"
          git push -f "https://oauth2:${GITCODE_TOKEN}@gitcode.com/${GITCODE_REPO}.git" HEAD:gh-pages
