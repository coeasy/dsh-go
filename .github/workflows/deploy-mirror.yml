name: Deploy CN Mirrors (Gitee/GitCode)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: mirror-deploy
  cancel-in-progress: true

env:
  GITEE_REPO: ${{ vars.GITEE_REPO || 'easy5277/dsh_go' }}
  GITCODE_REPO: ${{ vars.GITCODE_REPO || 'easy5277/dsh_go' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[no deploy]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check canonical Registry V3
        id: registry
        shell: bash
        run: |
          if [ -f catalog/registry-v3.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Registry V3 is not committed yet; Sync workflow owns generation, so mirror deployment is a successful no-op"
          fi
      - name: Detect mirror credentials
        id: mirrors
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        shell: bash
        run: |
          GITEE=false
          GITCODE=false
          if [ -n "$GITEE_TOKEN" ]; then GITEE=true; fi
          if [ -n "$GITCODE_TOKEN" ]; then GITCODE=true; fi
          echo "gitee=$GITEE" >> "$GITHUB_OUTPUT"
          echo "gitcode=$GITCODE" >> "$GITHUB_OUTPUT"
          if [ "$GITEE" = true ] || [ "$GITCODE" = true ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
      - name: Setup Node.js
        if: ${{ steps.registry.outputs.ready == 'true' && steps.mirrors.outputs.any == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install dependencies
        if: ${{ steps.registry.outputs.ready == 'true' && steps.mirrors.outputs.any == 'true' }}
        run: |
          npm ci
          cd site && npm ci
      - name: Deploy Gate V3
        if: ${{ steps.registry.outputs.ready == 'true' && steps.mirrors.outputs.any == 'true' }}
        run: npm run deploy:gate
      - name: Copy catalog into site
        if: ${{ steps.registry.outputs.ready == 'true' && steps.mirrors.outputs.any == 'true' }}
        run: npm run copy-assets
      - name: Build mirror site
        if: ${{ steps.registry.outputs.ready == 'true' && steps.mirrors.outputs.any == 'true' }}
        run: cd site && npm run build
        env:
          PUBLIC_BASE_PATH: /dsh_go
          PUBLIC_SITE_URL: https://easy5277.gitee.io/dsh_go
          PUBLIC_API_URL: https://${{ vars.CF_PAGES_PROJECT || 'dsh-go' }}.pages.dev
      - name: Verify build output
        if: ${{ steps.registry.outputs.ready == 'true' && steps.mirrors.outputs.any == 'true' }}
        run: |
          test -f site/dist/index.html
          test -f site/dist/catalog/registry-v3.json
          test -f site/dist/catalog/schema-v3.json
      - name: Deploy to Gitee Pages branch
        if: ${{ steps.registry.outputs.ready == 'true' && steps.mirrors.outputs.gitee == 'true' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          cd site/dist
          git init -q
          git config user.name "dsh-go CI"
          git config user.email "ci@local"
          git add -A
          git commit -q -m "deploy: ${{ github.sha }}"
          git push -f "https://easy5277:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" HEAD:gh-pages
      - name: Deploy to GitCode Pages branch
        if: ${{ steps.registry.outputs.ready == 'true' && steps.mirrors.outputs.gitcode == 'true' }}
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          cd site/dist
          git init -q
          git config user.name "dsh-go CI"
          git config user.email "ci@local"
          git add -A
          git commit -q -m "deploy: ${{ github.sha }}"
          git push -f "https://oauth2:${GITCODE_TOKEN}@gitcode.com/${GITCODE_REPO}.git" HEAD:gh-pages
