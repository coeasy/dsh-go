name: Runtime Platform V2

on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'tests/runtime-platform/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runtime-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Runtime Platform tests
        run: npm run runtime:test
      - name: Registry compatibility gate
        run: npm run runtime:check
      - name: Runtime source lint
        run: npx eslint runtime tests/runtime-platform
