name: Runtime Platform V2

on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'tests/runtime-platform/**'
      - 'package.json'
      - 'package-lock.json'
      - 'site/**'
      - '.github/workflows/runtime-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install site dependencies
        run: cd site && npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Full lint
        run: npm run lint
      - name: Runtime Platform tests
        run: npm run runtime:test
      - name: Full tests
        run: npm test
      - name: Site check
        run: cd site && npm run check
      - name: Registry compatibility gate
        run: npm run runtime:check
      - name: Runtime syntax checks
        run: |
          node --check runtime/cli.mjs
          node --check runtime/installer.mjs
          node --check runtime/loader.mjs
          node --check runtime/registry.mjs
          node --check runtime/resolver.mjs
          node --check runtime/health.mjs
          node --check runtime/rollback.mjs
          node --check runtime/mcp-tools.mjs
