name: Runtime Platform V4

on:
  pull_request:
    branches: [main]
    paths:
      - "bin/**"
      - "runtime/**"
      - "packages/protocol-core/**"
      - "packages/registry-core/**"
      - "packages/resolver/**"
      - "schemas/**"
      - "scripts/check-contract.mjs"
      - "scripts/registry-v4-*.mjs"
      - "scripts/registry-distribution-v2.mjs"
      - "scripts/build-search-index-v3.mjs"
      - "tests/architecture-v4/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/runtime-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-platform-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-linux:
    name: Canonical Runtime V4 (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Canonical contract
        run: npm run contract:check
      - name: Runtime architecture tests
        run: npx vitest run tests/architecture-v4
      - name: Runtime syntax
        shell: bash
        run: |
          find packages/protocol-core packages/registry-core packages/resolver runtime bin -type f -name '*.mjs' -print0 \
            | xargs -0 -n1 node --check
      - name: CLI contract
        run: |
          node bin/dsh.mjs --help | grep -F 'dsh package install <type:id@range>'
          node bin/dsh.mjs --help | grep -F 'dsh://package/install'
      - name: Package smoke
        run: npm pack --dry-run

  runtime-cross-platform:
    name: Canonical Runtime V4 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Protocol, Registry, Resolver, State and Deep Link tests
        run: npx vitest run tests/architecture-v4/protocol-registry-resolver.test.ts tests/architecture-v4/runtime-state-host.test.ts
      - name: Canonical CLI syntax
        run: |
          node --check bin/dsh.mjs
          node --check runtime/dsh.mjs
          node --check runtime/host-bridge.mjs
          node --check runtime/client-host.mjs
      - name: Protocol registration plan is canonical
        shell: bash
        run: |
          node -e "import('./runtime/host-bridge.mjs').then(m=>{const p=m.protocolRegistration({platform:process.platform});if(!JSON.stringify(p).includes('package install-link'))process.exit(1)})"
