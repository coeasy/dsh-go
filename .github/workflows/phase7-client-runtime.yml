name: Phase 7 Client Runtime

on:
  pull_request:
    paths:
      - 'bin/**'
      - 'runtime/**'
      - 'tests/runtime-platform/**'
      - 'package.json'
      - '.github/workflows/phase7-client-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-runtime:
    name: Client Runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Phase 7 tests
        run: npm run phase7:test
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
