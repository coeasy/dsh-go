name: Final Acceptance E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-acceptance-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Package lifecycle V4 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Architecture and type contracts
        run: |
          npm run contract:check
          npm run architecture:check
          npm run typecheck
      - name: Protocol / Policy / Registry / Resolver / State
        run: npx vitest run tests/architecture-v4
      - name: Full local package lifecycle
        run: npx vitest run tests/architecture-v4/package-lifecycle-e2e.test.ts
      - name: No-legacy platform contract
        run: npx vitest run tests/architecture-v4/platform-contract.test.ts
      - name: Package smoke
        run: npm pack --dry-run
