name: Apply active catalog hardening

on:
  push:
    branches: ["fix/canonical-repository-identity"]
    paths:
      - ".github/workflows/apply-manifest-observation-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply active catalog hardening
        run: python3 .github/scripts/apply-active-catalog-fix.py
      - name: Verify active catalog hardening
        run: |
          npm ci
          cd site && npm ci && cd ..
          node --check scripts/validate.mjs
          node --check scripts/registry-v3-builder.mjs
          node --check scripts/copy-assets.mjs
          npm run typecheck
          npm run lint
          npm test
          cd site && npm run check && cd ..
      - name: Commit patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_lib.ts site/src/pages/index.astro site/src/pages/plugin/[slug].astro scripts/copy-assets.mjs scripts/registry-v3-builder.mjs scripts/validate.mjs tests/validate.test.ts tests/registry-v3.test.ts tests/catalog-filter.test.ts
          git commit -m "fix: hide inactive repositories and enforce canonical catalog identity"
          git push
