name: Apply complete manifest observation fix

on:
  push:
    branches: ["fix/canonical-repository-identity"]
    paths:
      - ".github/workflows/apply-manifest-observation-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply manifest observation hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          # Make manifest absence an explicit observation instead of conflating it with network failure.
          sync = Path('scripts/sync.mjs')
          text = sync.read_text()
          start = text.index('async function fetchManifest(fullName, branch) {')
          end = text.index('\nasync function fetchReadme(fullName, branch) {', start)
          replacement = r'''export async function observeDshManifest(fullName, branch) {
  const file = MANIFEST_FILES[0];
  const url = `https://raw.githubusercontent.com/${fullName}/${branch}/${file}`;
  let lastError = '';
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const res = await fetch(url, { headers: { 'User-Agent': 'dsh-go' }, signal: AbortSignal.timeout(15000) });
      if (res.status === 404) return { observed: true, manifest: null, status: 404 };
      if (!res.ok) {
        lastError = `HTTP ${res.status}`;
        if ([403, 429, 500, 502, 503, 504].includes(res.status) && attempt < 2) {
          await sleep(500 * (attempt + 1));
          continue;
        }
        return { observed: false, manifest: null, status: res.status, error: lastError };
      }
      let data;
      try { data = await res.json(); }
      catch { return { observed: true, manifest: null, status: res.status, error: 'invalid-json' }; }
      const clean = sanitizeManifest(data);
      return { observed: true, manifest: clean ? { file, data: clean } : null, status: res.status, error: clean ? '' : 'invalid-manifest' };
    } catch (error) {
      lastError = error?.message || String(error);
      if (attempt < 2) { await sleep(500 * (attempt + 1)); continue; }
    }
  }
  return { observed: false, manifest: null, status: 0, error: lastError || 'manifest-observation-failed' };
}

async function fetchManifest(fullName, branch) {
  const observation = await observeDshManifest(fullName, branch);
  if (!observation.observed) throw new Error(`DSH manifest observation failed for ${fullName}: ${observation.error || observation.status}`);
  return observation.manifest;
}

export function applyManifestObservation(plugin, observation) {
  const base = normalizeStoredPlugin(plugin);
  if (!observation?.observed) return base;
  const manifest = observation.manifest;
  const result = manifest ? {
    ...base,
    name: manifest.data?.name || base.repo_name,
    description: manifest.data?.description || base.description || '',
    category: normalizeCategory(manifest.data?.category, base.category || 'other'),
    tags: dedupeTags([...(manifest.data?.tags || []), ...(base.topics || [])]),
    metadata_source: 'dsh-plugin',
    manifest_file: 'dsh-plugin.json',
    verified: true,
  } : {
    ...base,
    name: base.repo_name,
    metadata_source: 'github',
    manifest_file: null,
    verified: false,
  };
  result.install_cmd = makeInstallCmd(result.full_name, result.category);
  result._manifest_observed = true;
  return normalizeStoredPlugin(result);
}
'''
          sync.write_text(text[:start] + replacement + text[end:])

          # A live, explicit manifest observation supersedes stale historical manifest state.
          identity = Path('scripts/repository-identity.mjs')
          text = identity.read_text()
          start = text.index('export function mergeDiscoveredRepository(current, discovered) {')
          end = text.index('\nexport function mergeCatalogPluginsWithDiscovery', start)
          replacement = r'''export function mergeDiscoveredRepository(current, discovered) {
  const liveManifestObserved = discovered?._manifest_observed === true;
  const live = normalizeStoredPlugin(discovered);
  delete live._manifest_observed;
  if (!current) return live;

  const base = normalizeStoredPlugin(current);
  const manifestSource = liveManifestObserved ? live : base;
  const manifestAuthoritative = manifestSource.manifest_file === 'dsh-plugin.json';
  const overrideFields = normalizeOverrideFields(base.override_fields);
  const overrideSet = new Set(overrideFields);
  const hasOverrides = overrideFields.length > 0;

  const name = overrideSet.has('name')
    ? (base.name || live.repo_name)
    : manifestAuthoritative ? (manifestSource.name || live.repo_name) : live.repo_name;
  const description = overrideSet.has('description')
    ? (base.description || '')
    : manifestAuthoritative ? (manifestSource.description || live.description || '') : (live.description || '');
  const category = normalizePluginCategory(
    overrideSet.has('category') ? base.category : (manifestAuthoritative ? manifestSource.category : live.category),
    'other',
  );
  const tags = overrideSet.has('tags')
    ? (Array.isArray(base.tags) ? base.tags : [])
    : manifestAuthoritative ? (Array.isArray(manifestSource.tags) ? manifestSource.tags : live.tags) : (Array.isArray(live.tags) ? live.tags : []);
  // dsh-plugin.json does not own the GitHub homepage field. Only an explicit homepage
  // override may freeze it; otherwise always refresh from live repository metadata.
  const homepage = normalizeHttpUrl(overrideSet.has('homepage') ? base.homepage : live.homepage);

  const merged = {
    ...base,
    repo_id: live.repo_id || base.repo_id || null,
    full_name: live.full_name,
    repo_name: live.repo_name,
    repo_url: canonicalRepoUrl(live.full_name),
    install_cmd: makeInstallCmd(live.full_name, category),
    topics: live.topics || [],
    stars: Number(live.stars || 0),
    forks: Number(live.forks || 0),
    watchers: Number(live.watchers || 0),
    open_issues: Number(live.open_issues || 0),
    created_at: live.created_at || base.created_at || '',
    updated_at: live.updated_at || base.updated_at || '',
    language: live.language || '',
    license: live.license || '',
    homepage,
    snapshot_commit: live.snapshot_commit || base.snapshot_commit,
    snapshot_ref: live.snapshot_ref || base.snapshot_ref,
    deprecated: Boolean(live.deprecated),
    disabled: Boolean(live.disabled),
    metadata_source: hasOverrides ? 'override' : (manifestAuthoritative ? 'dsh-plugin' : 'github'),
    manifest_file: manifestAuthoritative ? 'dsh-plugin.json' : null,
    verified: manifestAuthoritative,
    category,
    tags,
    name,
    description,
  };
  if (hasOverrides) merged.override_fields = overrideFields;
  else delete merged.override_fields;
  delete merged._manifest_observed;
  return merged;
}
'''
          identity.write_text(text[:start] + replacement + text[end:])

          replace_once(
              'scripts/sync-v3.mjs',
              "import { buildFeed } from './sync.mjs';\nimport { mergeCatalogPluginsWithDiscovery } from './repository-identity.mjs';",
              "import { applyManifestObservation, buildFeed, observeDshManifest } from './sync.mjs';\nimport { canonicalRepoKey, mergeCatalogPluginsWithDiscovery } from './repository-identity.mjs';",
          )
          old = """      const discoveredPlugins = discovery.repositories.map(discoveryRepoToLegacy).filter((plugin) => plugin.full_name && !plugin.disabled);\n      const requireObservation = !registryOnly && mode === 'full';\n      if (requireObservation && observations.mode !== 'full') {\n        throw new Error('full sync observation sidecar missing or invalid; refusing stale-repository pruning');\n      }\n      const merged = mergeCatalogPluginsWithDiscovery(legacy.plugins || [], discoveredPlugins, {\n"""
          new = """      const discoveredPlugins = discovery.repositories.map(discoveryRepoToLegacy).filter((plugin) => plugin.full_name && !plugin.disabled);\n      const requireObservation = !registryOnly && mode === 'full';\n      if (requireObservation && observations.mode !== 'full') {\n        throw new Error('full sync observation sidecar missing or invalid; refusing stale-repository pruning');\n      }\n\n      // Legacy REST star buckets cannot enumerate every low-star repository. For records that\n      // were not actually processed by the legacy full pass, observe dsh-plugin.json directly\n      // so complete discovery does not create false-negative verification/name/category data.\n      const observedKeys = new Set((observations.repos || []).map(canonicalRepoKey).filter(Boolean));\n      const observedIds = new Set((observations.repo_ids || []).map((id) => String(id)).filter(Boolean));\n      const legacyKeys = new Set((legacy.plugins || []).map((plugin) => canonicalRepoKey(plugin.full_name)).filter(Boolean));\n      const legacyIds = new Set((legacy.plugins || []).map((plugin) => String(plugin.repo_id || '')).filter(Boolean));\n      const targetIndexes = [];\n      for (let index = 0; index < discoveredPlugins.length; index++) {\n        const plugin = discoveredPlugins[index];\n        const key = canonicalRepoKey(plugin.full_name);\n        const id = String(plugin.repo_id || '');\n        const alreadyObserved = requireObservation\n          ? (observedKeys.has(key) || (id && observedIds.has(id)))\n          : (legacyKeys.has(key) || (id && legacyIds.has(id)));\n        if (!alreadyObserved) targetIndexes.push(index);\n      }\n      if (targetIndexes.length) {\n        const manifestConcurrency = Math.max(1, Math.min(64, Number(process.env.REGISTRY_MANIFEST_CONCURRENCY || 32)));\n        let manifestCursor = 0;\n        let manifestObserved = 0;\n        let manifestUncertain = 0;\n        async function manifestWorker() {\n          while (manifestCursor < targetIndexes.length) {\n            const targetIndex = targetIndexes[manifestCursor++];\n            const plugin = discoveredPlugins[targetIndex];\n            const observation = await observeDshManifest(plugin.full_name, plugin.snapshot_ref || 'HEAD');\n            if (observation.observed) {\n              discoveredPlugins[targetIndex] = applyManifestObservation(plugin, observation);\n              manifestObserved++;\n            } else {\n              manifestUncertain++;\n              console.warn(`[sync-v3] manifest observation uncertain for ${plugin.full_name}: ${observation.error || observation.status}`);\n            }\n          }\n        }\n        await Promise.all(Array.from({ length: Math.min(manifestConcurrency, targetIndexes.length) }, manifestWorker));\n        console.log(`[sync-v3] complete-discovery manifest backfill targets=${targetIndexes.length} observed=${manifestObserved} uncertain=${manifestUncertain}`);\n      }\n\n      const merged = mergeCatalogPluginsWithDiscovery(legacy.plugins || [], discoveredPlugins, {\n"""
          replace_once('scripts/sync-v3.mjs', old, new)

          # Regression tests for manifest upgrades/removals and uncertain observations.
          replace_once(
              'tests/repository-identity.test.ts',
              "const { discoveryRepoToLegacy } = await import('../scripts/github-discovery.mjs');",
              "const { discoveryRepoToLegacy } = await import('../scripts/github-discovery.mjs');\nconst { applyManifestObservation } = await import('../scripts/sync.mjs');",
          )
          replace_once(
              'tests/repository-identity.test.ts',
              "  it('audits wrong repo URLs and install sources', () => {",
              "  it('upgrades and downgrades manifest authority only after an explicit observation', () => {\n    const github: any = { full_name: 'owner/demo', repo_id: '7', name: 'demo', repo_name: 'demo', category: 'tool', topics: ['dsh-plugin'] };\n    const observedManifest: any = applyManifestObservation(github, {\n      observed: true,\n      manifest: { file: 'dsh-plugin.json', data: { name: 'Branded Demo', category: 'mcp', tags: ['custom'] } },\n    });\n    const upgraded = mergeCatalogPluginsWithDiscovery([github], [observedManifest]).plugins[0] as any;\n    expect(upgraded.name).toBe('Branded Demo');\n    expect(upgraded.category).toBe('mcp');\n    expect(upgraded.verified).toBe(true);\n    expect(upgraded.manifest_file).toBe('dsh-plugin.json');\n\n    const observedAbsent: any = applyManifestObservation(observedManifest, { observed: true, manifest: null });\n    const downgraded = mergeCatalogPluginsWithDiscovery([upgraded], [observedAbsent]).plugins[0] as any;\n    expect(downgraded.name).toBe('demo');\n    expect(downgraded.verified).toBe(false);\n    expect(downgraded.manifest_file).toBeNull();\n  });\n\n  it('preserves historical manifest authority when live manifest observation is uncertain', () => {\n    const current: any = {\n      full_name: 'owner/demo', repo_id: '7', name: 'Branded Demo', category: 'mcp', metadata_source: 'dsh-plugin',\n      manifest_file: 'dsh-plugin.json', verified: true, tags: ['custom'],\n    };\n    const live: any = { full_name: 'owner/demo', repo_id: '7', name: 'demo', repo_name: 'demo', category: 'tool', topics: ['dsh-plugin'] };\n    const uncertain: any = applyManifestObservation(live, { observed: false, manifest: null });\n    const merged = mergeCatalogPluginsWithDiscovery([current], [uncertain]).plugins[0] as any;\n    expect(merged.name).toBe('Branded Demo');\n    expect(merged.verified).toBe(true);\n    expect(merged.manifest_file).toBe('dsh-plugin.json');\n  });\n\n  it('audits wrong repo URLs and install sources', () => {",
          )
          PY
      - name: Verify manifest observation hardening
        run: |
          npm ci
          cd site && npm ci && cd ..
          node --check scripts/repository-identity.mjs
          node --check scripts/sync.mjs
          node --check scripts/sync-v3.mjs
          npm run typecheck
          npm run lint
          npm test
          cd site && npm run check && cd ..
      - name: Commit patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/repository-identity.mjs scripts/sync.mjs scripts/sync-v3.mjs tests/repository-identity.test.ts
          git commit -m "fix: observe manifests for complete repository discovery"
          git push
