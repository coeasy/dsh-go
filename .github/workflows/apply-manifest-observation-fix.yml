name: Apply complete manifest observation fix

on:
  push:
    branches: ["fix/canonical-repository-identity"]
    paths:
      - ".github/workflows/apply-manifest-observation-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply manifest observation hardening
        run: python3 .github/scripts/apply-manifest-observation.py
      - name: Verify manifest observation hardening
        run: |
          npm ci
          cd site && npm ci && cd ..
          node --check scripts/repository-identity.mjs
          node --check scripts/sync.mjs
          node --check scripts/sync-v3.mjs
          npm run typecheck
          npm run lint
          npm test
          cd site && npm run check && cd ..
      - name: Commit patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/repository-identity.mjs scripts/sync.mjs scripts/sync-v3.mjs tests/repository-identity.test.ts
          git commit -m "fix: observe manifests for complete repository discovery"
          git push
