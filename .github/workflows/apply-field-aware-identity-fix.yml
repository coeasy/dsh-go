name: Apply field-aware identity hardening

on:
  push:
    branches: ["fix/canonical-repository-identity"]
    paths:
      - ".github/workflows/apply-field-aware-identity-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply field-aware override patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'scripts/sync.mjs',
              "import { canonicalRepoKey, canonicalRepoUrl, discoveryRepoId, makeInstallCmd, normalizeStoredPlugin } from './repository-identity.mjs';",
              "import { applyPluginOverride, canonicalRepoKey, canonicalRepoUrl, discoveryRepoId, makeInstallCmd, normalizeStoredPlugin } from './repository-identity.mjs';",
          )
          replace_once(
              'scripts/sync.mjs',
              "async function loadOverrides() {\n  const raw = await readJSON(resolve(CATALOG_DIR, 'overrides.json'), {});\n  if (raw && typeof raw === 'object' && !Array.isArray(raw)) return raw;\n  return {};\n}\n\nfunction applyOverrides(plugin, overrides) {\n  const o = overrides[plugin.full_name];\n  if (!o) return plugin;\n  if (o.name) { plugin.name = o.name; plugin.metadata_source = 'override'; }\n  if (o.description) { plugin.description = o.description; plugin.metadata_source = 'override'; }\n  if (o.category) {\n    plugin.category = normalizeCategory(o.category, 'other');\n    plugin.metadata_source = 'override';\n    plugin.install_cmd = makeInstallCmd(plugin.full_name, plugin.category);\n  }\n  if (Array.isArray(o.tags)) plugin.tags = o.tags;\n  if (o.homepage) plugin.homepage = o.homepage;\n  if (o.hidden) plugin.hidden = true;\n  return plugin;\n}",
              "async function loadOverrides() {\n  const raw = await readJSON(resolve(CATALOG_DIR, 'overrides.json'), {});\n  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {};\n  const normalized = {};\n  for (const [key, value] of Object.entries(raw)) {\n    if (key.startsWith('$') || !value || typeof value !== 'object' || Array.isArray(value)) continue;\n    const canonicalKey = canonicalRepoKey(key);\n    if (canonicalKey) normalized[canonicalKey] = value;\n  }\n  return normalized;\n}\n\nfunction applyOverrides(plugin, overrides) {\n  const o = overrides[canonicalRepoKey(plugin.full_name)];\n  if (!o) return plugin;\n  const result = applyPluginOverride(plugin, o);\n  if (Object.prototype.hasOwnProperty.call(o, 'hidden')) result.hidden = Boolean(o.hidden);\n  return result;\n}",
          )

          replace_once(
              'scripts/registry-v3-builder.mjs',
              "      metadata_source: legacy.metadata_source || (legacy.manifest_file === 'dsh-plugin.json' ? 'dsh-plugin' : 'github'),\n      description: legacy.description || '', category: legacy.category || 'other', verified: Boolean(legacy.verified),",
              "      metadata_source: legacy.metadata_source || (legacy.manifest_file === 'dsh-plugin.json' ? 'dsh-plugin' : 'github'),\n      override_fields: Array.isArray(legacy.override_fields) ? legacy.override_fields : [],\n      description: legacy.description || '', category: legacy.category || 'other', verified: Boolean(legacy.verified),",
          )

          replace_once(
              'scripts/audit-catalog-identity.mjs',
              "import { canonicalRepoKey, canonicalRepoUrl, makeInstallCmd, repoNameFromFullName } from './repository-identity.mjs';",
              "import { canonicalRepoKey, canonicalRepoUrl, makeInstallCmd, normalizeHttpUrl, normalizeOverrideFields, repoNameFromFullName } from './repository-identity.mjs';",
          )
          replace_once(
              'scripts/audit-catalog-identity.mjs',
              "    if (plugin.metadata_source === 'github' && plugin.name !== repoName) errors.push(`${label}: GitHub-sourced name mismatch (${plugin.name})`);\n    if (plugin.repo_url?.startsWith('https://api.github.com/')) errors.push(`${label}: GitHub API URL exposed as repository URL`);",
              "    if (plugin.metadata_source === 'github' && plugin.name !== repoName) errors.push(`${label}: GitHub-sourced name mismatch (${plugin.name})`);\n    const overrideFields = normalizeOverrideFields(plugin.override_fields);\n    if (plugin.metadata_source === 'override' && overrideFields.length === 0) errors.push(`${label}: override source missing field-level provenance`);\n    if (Array.isArray(plugin.override_fields) && overrideFields.length !== plugin.override_fields.length) errors.push(`${label}: unsupported override_fields`);\n    if (plugin.homepage && normalizeHttpUrl(plugin.homepage) !== plugin.homepage) errors.push(`${label}: invalid/non-normalized homepage`);\n    if (plugin.repo_url?.startsWith('https://api.github.com/')) errors.push(`${label}: GitHub API URL exposed as repository URL`);",
          )

          replace_once(
              'scripts/validate-registry-v3.mjs',
              "import { canonicalRepoKey, canonicalRepoUrl, makeInstallCmd, repoNameFromFullName } from './repository-identity.mjs';",
              "import { canonicalRepoKey, canonicalRepoUrl, makeInstallCmd, normalizeOverrideFields, repoNameFromFullName } from './repository-identity.mjs';",
          )
          replace_once(
              'scripts/validate-registry-v3.mjs',
              "    if (metadata.manifest_file && metadata.manifest_file !== 'dsh-plugin.json') errors.push(`${id}: unsupported manifest_file ${metadata.manifest_file}`);",
              "    if (metadata.manifest_file && metadata.manifest_file !== 'dsh-plugin.json') errors.push(`${id}: unsupported manifest_file ${metadata.manifest_file}`);\n    const overrideFields = normalizeOverrideFields(metadata.override_fields);\n    if (metadata.metadata_source === 'override' && overrideFields.length === 0) errors.push(`${id}: override metadata missing override_fields`);\n    if (Array.isArray(metadata.override_fields) && overrideFields.length !== metadata.override_fields.length) errors.push(`${id}: unsupported override_fields`);",
          )

          replace_once(
              'functions/_lib.ts',
              "  metadata_source?: 'github' | 'dsh-plugin' | 'override';\n  full_name: string;",
              "  metadata_source?: 'github' | 'dsh-plugin' | 'override';\n  override_fields?: string[];\n  full_name: string;",
          )

          replace_once(
              'tests/repository-identity.test.ts',
              "  canonicalRepoKey, canonicalRepoUrl, discoveryTopics, makeInstallCmd,\n  mergeCatalogPluginsWithDiscovery, normalizePluginCategory, normalizeStoredPlugin,",
              "  applyPluginOverride, canonicalRepoKey, canonicalRepoUrl, discoveryTopics, makeInstallCmd,\n  mergeCatalogPluginsWithDiscovery, normalizePluginCategory, normalizeStoredPlugin,",
          )
          replace_once(
              'tests/repository-identity.test.ts',
              "      { full_name: 'owner/manual', name: 'Manual Brand', category: 'tool', metadata_source: 'override', manifest_file: null, verified: false, topics: [] },",
              "      { full_name: 'owner/manual', name: 'Manual Brand', category: 'tool', metadata_source: 'override', override_fields: ['name'], manifest_file: null, verified: false, topics: [] },",
          )
          replace_once(
              'tests/repository-identity.test.ts',
              "      { full_name: 'owner/manual', name: 'Manual', category: 'tool', metadata_source: 'override' },",
              "      { full_name: 'owner/manual', name: 'Manual', category: 'tool', metadata_source: 'override', override_fields: ['name'] },",
          )
          replace_once(
              'tests/repository-identity.test.ts',
              "  it('deduplicates repository identity case-insensitively', () => {",
              "  it('does not let legacy record-wide override flags freeze polluted names', () => {\n    const plugin: any = normalizeStoredPlugin({\n      full_name: 'ruvnet/ruflo', name: 'claude-flow', category: 'agent', metadata_source: 'override',\n    });\n    expect(plugin.name).toBe('ruflo');\n    expect(plugin.metadata_source).toBe('github');\n    expect(plugin.override_fields).toBeUndefined();\n  });\n\n  it('preserves only explicitly overridden fields across repository renames', () => {\n    const current: any = {\n      full_name: 'owner/old-name', repo_id: '42', name: 'stale-package-name', category: 'agent',\n      metadata_source: 'override', override_fields: ['category'], homepage: 'https://old.example/',\n    };\n    const live: any = {\n      full_name: 'owner/new-name', repo_id: '42', name: 'new-name', repo_name: 'new-name', category: 'tool',\n      description: 'live', topics: ['dsh-plugin'], tags: ['dsh-plugin'], homepage: 'https://new.example/', stars: 1,\n    };\n    const merged = mergeCatalogPluginsWithDiscovery([current], [live]).plugins[0] as any;\n    expect(merged.name).toBe('new-name');\n    expect(merged.category).toBe('agent');\n    expect(merged.homepage).toBe('https://new.example/');\n    expect(merged.override_fields).toEqual(['category']);\n  });\n\n  it('keeps explicit name aliases and sanitizes overridden homepage URLs', () => {\n    const base: any = normalizeStoredPlugin({ full_name: 'owner/demo', name: 'demo', category: 'tool' });\n    const aliased: any = applyPluginOverride(base, { name: 'Friendly Name', homepage: 'javascript:alert(1)' });\n    expect(aliased.name).toBe('Friendly Name');\n    expect(aliased.homepage).toBeNull();\n    expect(aliased.metadata_source).toBe('override');\n    expect(aliased.override_fields).toEqual(['homepage', 'name']);\n  });\n\n  it('deduplicates repository identity case-insensitively', () => {",
          )
          PY
      - name: Verify field-aware hardening
        run: |
          npm ci
          cd site && npm ci && cd ..
          node --check scripts/repository-identity.mjs
          node --check scripts/sync.mjs
          node --check scripts/audit-catalog-identity.mjs
          node --check scripts/registry-v3-builder.mjs
          node --check scripts/validate-registry-v3.mjs
          npm run typecheck
          npm run lint
          npm test
          cd site && npm run check && cd ..
      - name: Commit patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync.mjs scripts/registry-v3-builder.mjs scripts/audit-catalog-identity.mjs scripts/validate-registry-v3.mjs functions/_lib.ts tests/repository-identity.test.ts
          git commit -m "fix: preserve repository identity through field-level overrides"
          git push
