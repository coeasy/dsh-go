name: Dependency Security

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "site/package.json"
      - "site/package-lock.json"
      - ".github/workflows/security-audit.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "site/package.json"
      - "site/package-lock.json"
      - ".github/workflows/security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: root
            directory: .
          - project: site
            directory: site
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Block high and critical vulnerabilities
        run: npm audit --audit-level=high

  regenerate-root-lock:
    name: Regenerate root lockfile
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/dependency-security-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout controlled repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/dependency-security-gate
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Recalculate root lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          if git diff --quiet -- package-lock.json; then
            echo "Root lockfile already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "fix(deps): align lockfile with Wrangler 4 peers"
          git push origin HEAD:fix/dependency-security-gate
