name: Dependency Security

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "site/package.json"
      - "site/package-lock.json"
      - ".github/workflows/security-audit.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "site/package.json"
      - "site/package-lock.json"
      - ".github/workflows/security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: root
            directory: .
          - project: site
            directory: site
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Block high and critical vulnerabilities
        run: node "$GITHUB_WORKSPACE/scripts/npm-audit-retry.mjs" --label "${{ matrix.project }}"
