name: Branch Hygiene

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-merged-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged same-repository PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(jq -rn --arg value "$HEAD_REF" '$value|@uri')"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded"

  cleanup-history:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only safely superseded historical branches
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          preserved=0
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')

          for branch in "${branches[@]}"; do
            case "$branch" in
              "$DEFAULT_BRANCH") continue ;;
              feat/*|fix/*|chore/*|ci/*|build/*|provider-adapter/*) ;;
              *) preserved=$((preserved + 1)); continue ;;
            esac

            if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --limit 1 --json number --jq 'length')" -gt 0 ]; then
              echo "preserve open PR branch: $branch"
              preserved=$((preserved + 1))
              continue
            fi

            encoded="$(jq -rn --arg value "$branch" '$value|@uri')"
            branch_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/$encoded" --jq '.commit.sha')"
            merged_json="$(gh pr list --repo "$GITHUB_REPOSITORY" --state closed --head "$branch" --limit 100 --json mergedAt,headRefOid)"
            merged_head_match="$(jq --arg sha "$branch_sha" '[.[] | select(.mergedAt != null and .headRefOid == $sha)] | length' <<<"$merged_json")"

            safe=false
            base_encoded="$(jq -rn --arg value "$DEFAULT_BRANCH" '$value|@uri')"
            if compare="$(gh api "repos/$GITHUB_REPOSITORY/compare/${base_encoded}...${encoded}" 2>/dev/null)"; then
              ahead="$(jq -r '.ahead_by' <<<"$compare")"
              changed_files="$(jq -r '.files | length' <<<"$compare")"
              if [ "$ahead" -eq 0 ] || [ "$changed_files" -eq 0 ]; then
                safe=true
              fi
            fi
            if [ "$merged_head_match" -gt 0 ]; then
              safe=true
            fi

            if [ "$safe" = true ]; then
              echo "delete superseded branch: $branch"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded"
              deleted=$((deleted + 1))
            else
              echo "preserve branch with unique/unverified work: $branch"
              preserved=$((preserved + 1))
            fi
          done

          {
            echo "### Historical branch cleanup"
            echo "- deleted: $deleted"
            echo "- preserved: $preserved"
          } >> "$GITHUB_STEP_SUMMARY"
