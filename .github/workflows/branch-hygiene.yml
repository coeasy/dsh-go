name: Branch Hygiene

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/branch-hygiene.yml"
  schedule:
    - cron: "37 3 * * 0"
  workflow_dispatch:
    inputs:
      cleanup_workflow_runs:
        description: "Prune historical Actions runs"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  delete-merged-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged same-repository PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(jq -rn --arg value "$HEAD_REF" '$value|@uri')"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded"

  cleanup-history:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete historical branches except the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          deleted=0
          preserved=0
          mapfile -t branches < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name'
          )

          for branch in "${branches[@]}"; do
            [ "$branch" != "$DEFAULT_BRANCH" ] || continue

            open_prs="$(
              gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" \
                --limit 1 --json number --jq 'length'
            )"
            if [ "$open_prs" -gt 0 ]; then
              echo "preserve branch with open PR: $branch"
              preserved=$((preserved + 1))
              continue
            fi

            encoded="$(jq -rn --arg value "$branch" '$value|@uri')"
            echo "delete historical branch: $branch"
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded"; then
              deleted=$((deleted + 1))
            else
              echo "unable to delete branch (possibly protected): $branch"
              preserved=$((preserved + 1))
            fi
          done

          {
            echo "### Historical branch cleanup"
            echo "- default branch preserved: $DEFAULT_BRANCH"
            echo "- historical branches deleted: $deleted"
            echo "- branches preserved because of open PR/protection: $preserved"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-actions-history:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.cleanup_workflow_runs == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Keep only the latest successful run for each active workflow
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          active_paths_file="$(mktemp)"
          runs_file="$(mktemp)"
          delete_file="$(mktemp)"
          trap 'rm -f "$active_paths_file" "$runs_file" "$delete_file"' EXIT

          gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows?ref=$GITHUB_SHA" \
            --jq '.[] | select(.type == "file") | .path' \
            | sort -u > "$active_paths_file"

          test -s "$active_paths_file" || {
            echo "No active workflow files found; refusing destructive cleanup."
            exit 1
          }

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .path, (.head_branch // ""), .status, (.conclusion // "")] | @tsv' \
            > "$runs_file"

          declare -A kept_latest_success=()
          kept=0
          candidates=0

          while IFS=$'\t' read -r run_id workflow_path head_branch status conclusion; do
            [ -n "$run_id" ] || continue

            if [ "$run_id" = "$CURRENT_RUN_ID" ] || [ "$status" != "completed" ]; then
              kept=$((kept + 1))
              continue
            fi

            reason=""
            if ! grep -Fxq "$workflow_path" "$active_paths_file"; then
              reason="removed-workflow"
            elif [ "$head_branch" != "$DEFAULT_BRANCH" ]; then
              reason="historical-branch"
            elif [ "$conclusion" != "success" ]; then
              reason="non-success:$conclusion"
            elif [ -z "${kept_latest_success[$workflow_path]+x}" ]; then
              kept_latest_success["$workflow_path"]="$run_id"
              kept=$((kept + 1))
              continue
            else
              reason="older-success"
            fi

            printf '%s\t%s\t%s\n' "$run_id" "$workflow_path" "$reason" >> "$delete_file"
            candidates=$((candidates + 1))
          done < "$runs_file"

          deleted=0
          failed=0
          while IFS=$'\t' read -r run_id workflow_path reason; do
            [ -n "$run_id" ] || continue
            echo "delete Actions run: id=$run_id path=$workflow_path reason=$reason"
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"; then
              deleted=$((deleted + 1))
            else
              echo "failed to delete Actions run: $run_id"
              failed=$((failed + 1))
            fi
          done < "$delete_file"

          {
            echo "### Actions history cleanup"
            echo "- active workflow files: $(wc -l < "$active_paths_file" | tr -d ' ')"
            echo "- delete candidates: $candidates"
            echo "- deleted: $deleted"
            echo "- delete failures: $failed"
            echo "- preserved: current/in-progress runs plus the latest successful default-branch run for each active workflow"
          } >> "$GITHUB_STEP_SUMMARY"
