<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:* http://localhost:* https://dsh-go.pages.dev https://coeasy.github.io; img-src 'self' data: https:;" />
  <title>DSH Marketplace</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color-scheme:light dark;--bg:#0c0f14;--panel:#151a22;--line:#2a313d;--text:#f4f6f8;--muted:#9da8b5;--accent:#78a8ff;--good:#70d39a;--warn:#f2bd68;--bad:#ff7b89}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit}header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px)}h1{font-size:17px;margin:0;margin-right:auto}.badge{font-size:11px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}main{max-width:1180px;margin:0 auto;padding:22px}.toolbar{display:grid;grid-template-columns:1fr 150px auto;gap:10px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);color:var(--text)}button{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--panel);color:var(--text);cursor:pointer}button.primary{background:var(--accent);color:#07101f;border-color:transparent;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.summary{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:10px;margin:18px 0}.metric{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.metric b{display:block;font-size:23px}.metric span{color:var(--muted);font-size:12px}.section{margin-top:24px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.section h2{font-size:14px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}.card{display:grid;grid-template-rows:auto 1fr auto;min-height:170px;padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.card h3{font-size:14px;margin:0 0 6px}.card p{font-size:12px;color:var(--muted);min-height:34px}.meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:11px}.actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;align-self:end}.state{font-weight:700}.state.active{color:var(--good)}.state.pending-restart,.state.installed{color:var(--warn)}.state.failed{color:var(--bad)}.notice{padding:12px 14px;border:1px solid var(--line);border-radius:11px;color:var(--muted);font-size:12px;margin-top:14px}.notice.warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line));color:var(--warn)}#status{font-size:12px;color:var(--muted)}#details{white-space:pre-wrap;max-height:260px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}@media(max-width:720px){.toolbar{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <header>
    <h1>DSH Marketplace</h1>
    <span class="badge">Protocol V2</span>
    <span id="status">Connecting…</span>
  </header>
  <main>
    <div class="toolbar">
      <input id="search" placeholder="Search Plugin / MCP / Skill / Agent" autocomplete="off" />
      <select id="type"><option value="">All types</option><option>plugin</option><option>mcp</option><option>skill</option><option>agent</option></select>
      <button id="searchButton" class="primary">Search</button>
    </div>
    <div id="activationNotice" class="notice warn" hidden>Installed changes are pending activation. <button id="activateButton">Activate pending packages</button> <button id="laterButton">Later</button></div>
    <div class="summary" id="summary"></div>

    <section class="section">
      <div class="section-head"><h2>Installed packages</h2><button id="refreshButton">Refresh</button></div>
      <div id="installed" class="grid"></div>
    </section>
    <section class="section">
      <div class="section-head"><h2>Package details</h2><span class="badge">local Runtime State V4</span></div>
      <div id="details" class="notice">Select Verify from an installed package to inspect its immutable install record.</div>
    </section>
    <section class="section">
      <div class="section-head"><h2>Marketplace results</h2><span class="badge">remote discovery only</span></div>
      <div id="results" class="grid"></div>
    </section>
    <div id="authority" class="notice"></div>
  </main>

  <script type="module">
    import { createMarketplaceDesktopClient } from '../index.mjs';

    const config = globalThis.__DSH_DESKTOP__ || {};
    const client = createMarketplaceDesktopClient(config);
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

    function metric(label, value) { return `<div class="metric"><b>${escapeHtml(value)}</b><span>${escapeHtml(label)}</span></div>`; }
    function packageCard(item) {
      const state = item.state || (item.activated ? 'active' : 'installed');
      const trust = item.trust_snapshot?.trust_level || item.policy_snapshot?.trust?.level || 'unverified';
      return `<article class="card" data-type="${escapeHtml(item.type)}" data-id="${escapeHtml(item.id)}"><div><h3>${escapeHtml(item.id)}</h3><div class="meta"><span>${escapeHtml(item.type)}@${escapeHtml(item.version)}</span><span class="state ${escapeHtml(state)}">${escapeHtml(state)}</span><span>trust ${escapeHtml(trust)}</span></div></div><p>${escapeHtml(item.content_digest ? `content ${item.content_digest.slice(0,12)}…` : 'Content digest unavailable')}</p><div class="actions"><button data-action="verify">Verify</button><button data-action="update">Update</button><button data-action="rollback">Rollback</button>${item.enabled === false ? '<button data-action="enable">Enable</button>' : '<button data-action="disable">Disable</button>'}<button data-action="remove">Remove</button></div></article>`;
    }
    function marketplaceCard(item) {
      const metadata = item.metadata || {};
      const type = item.type || 'plugin';
      const release = Array.isArray(item.releases) ? item.releases.find((entry) => !entry.revoked && !entry.yanked) : null;
      const version = release?.version || item.version || null;
      const id = item.id;
      const installable = Boolean(version || item.installable === true);
      return `<article class="card" data-market-type="${escapeHtml(type)}" data-market-id="${escapeHtml(id)}" data-market-version="${escapeHtml(version || '')}"><div><h3>${escapeHtml(metadata.name || item.name || id)}</h3><div class="meta"><span>${escapeHtml(type)}${version ? `@${escapeHtml(version)}` : ''}</span><span>${installable ? 'Registry V4 release' : 'discovery only'}</span></div></div><p>${escapeHtml(metadata.description || item.description || '')}</p><div class="actions">${installable ? '<button class="primary" data-install>Install</button>' : '<button disabled>Not installable</button>'}</div></article>`;
    }

    function showDetails(label, result) {
      $('details').textContent = `${label}\n${typeof result === 'string' ? result : JSON.stringify(result, null, 2)}`;
    }

    async function refreshCenter() {
      const center = await client.center();
      $('status').textContent = `Runtime connected · Registry ${String(center.registry?.revision || '').slice(0,10)}…`;
      $('summary').innerHTML = [
        metric('installed', center.counts.installed),
        metric('active', center.counts.active),
        metric('pending activation', center.counts.pending_activation),
        metric('failed', center.counts.failed),
        metric('disabled', center.counts.disabled),
      ].join('');
      $('installed').innerHTML = center.packages.length ? center.packages.map(packageCard).join('') : '<div class="notice">No packages installed.</div>';
      $('activationNotice').hidden = !center.restart_required;
      $('authority').textContent = `${center.mutation_authority}. Marketplace and remote API are discovery/plan only; local mutations require explicit approval and never auto-restart.`;
    }

    async function search() {
      const response = await client.search($('search').value, { type: $('type').value });
      const items = response?.items || response?.packages || [];
      $('results').innerHTML = items.length ? items.map(marketplaceCard).join('') : '<div class="notice">No results.</div>';
    }

    document.addEventListener('click', async (event) => {
      const target = event.target;
      if (!(target instanceof HTMLElement)) return;
      const installedCard = target.closest('[data-type][data-id]');
      if (installedCard && target.dataset.action) {
        const action = target.dataset.action;
        const type = installedCard.dataset.type;
        const id = installedCard.dataset.id;
        const approved = globalThis.confirm(`${action === 'verify' ? 'Verify' : `Run ${action} for`} ${type}:${id}?`);
        if (!approved) return;
        const result = await client.packageAction(type, id, action, { approved: true });
        showDetails(`${action} · ${type}:${id}`, result);
        await refreshCenter();
        return;
      }
      const marketCard = target.closest('[data-market-type][data-market-id]');
      if (marketCard && target.hasAttribute('data-install')) {
        const request = { type: marketCard.dataset.marketType, id: marketCard.dataset.marketId, range: marketCard.dataset.marketVersion || '*' };
        const plan = await client.installPlan(request);
        const approved = globalThis.confirm(`Install ${client.canonicalSpec(request)}?\n\n${JSON.stringify(plan, null, 2).slice(0, 1800)}`);
        if (!approved) return;
        const result = await client.install(request, { approved: true });
        showDetails(`Install · ${client.canonicalSpec(request)}`, result);
        await refreshCenter();
      }
    });

    $('searchButton').addEventListener('click', () => search().catch((error) => { $('results').innerHTML = `<div class="notice">${escapeHtml(error.message)}</div>`; }));
    $('search').addEventListener('keydown', (event) => { if (event.key === 'Enter') $('searchButton').click(); });
    $('refreshButton').addEventListener('click', () => refreshCenter().catch((error) => { $('status').textContent = error.message; }));
    $('laterButton').addEventListener('click', () => { $('activationNotice').hidden = true; });
    $('activateButton').addEventListener('click', async () => {
      const approved = globalThis.confirm('Activate all pending packages through Runtime Supervisor? Failed candidates will use Last-Known-Good recovery when available.');
      if (!approved) return;
      const result = await client.activate({ approved: true });
      showDetails('Activation Manager', result);
      await refreshCenter();
    });

    refreshCenter().catch((error) => { $('status').textContent = error.message; });
  </script>
</body>
</html>
